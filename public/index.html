/* 카카오 장소검색(Kakao Local, Places.keywordSearch) — 상호명/주소 둘 다 검색.
   결과 목록에서 선택 → opts.onComplete(data) 호출.
   data = {placeName, address, roadAddress, jibunAddress, phone, lat, lng, sido, sigungu, dong}
   ※ 외부 라이브러리 추가 없음 (기존 카카오 지도 SDK의 services 사용) */
/* 다음 우편번호(주소 자동완성) 지연 로드 — 도로명·지번 정밀 주소검색용 */
function loadPostcode(){
  return new Promise(res=>{
    if(window.daum && window.daum.Postcode) return res(true);
    const s=document.createElement('script');
    s.src='//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
    s.onload=()=>res(true); s.onerror=()=>res(false);
    document.head.appendChild(s);
  });
}
async function openAddressSearch(opts){
  opts=opts||{};
  console.log('[주소검색] 장소검색 실행, query=', opts.query);
  if(!(await loadKakao())){ toast('지도 서비스를 불러오지 못했어요 (카카오 도메인 등록 확인)','warn'); return; }
  if(!(kakao.maps.services && kakao.maps.services.Places)){ toast('장소검색 모듈을 불러오지 못했어요','warn'); return; }

  const old=document.getElementById('addrSearchOverlay'); if(old) old.remove();
  const ov=document.createElement('div');
  ov.id='addrSearchOverlay';
  ov.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(20,30,50,.45);display:flex;align-items:center;justify-content:center;padding:16px;';
  ov.innerHTML=`
    <div style="background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.3)">
      <div style="padding:16px 18px 12px;border-bottom:1px solid var(--border,#e3e8f0)">
        <div style="font-weight:800;font-size:16px;color:var(--navy,#1F3864);margin-bottom:10px">🔍 장소·주소 검색</div>
        <div style="display:flex;gap:6px">
          <input id="asInput" type="text" placeholder="상호명 또는 주소 (예: 올인베이커리 여주창동점)" style="flex:1;padding:11px;border:1px solid var(--border,#e3e8f0);border-radius:8px;font-size:14px" value="${esc(opts.query||'')}">
          <button id="asGo" type="button" style="padding:11px 16px;background:var(--navy,#1F3864);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">검색</button>
        </div>
        <div style="font-size:11.5px;color:var(--text-mute,#6F82A8);margin-top:6px">위엔 <b>상호명</b>(가게 이름)으로 검색해요.</div>
        <button id="asPostcode" type="button" style="width:100%;margin-top:8px;padding:11px;background:#fff;border:1px solid var(--navy,#1F3864);color:var(--navy,#1F3864);border-radius:8px;font-weight:700;cursor:pointer">📮 도로명·지번 주소로 정확히 찾기</button>
      </div>
      <div id="asResults" style="overflow-y:auto;padding:6px 8px;flex:1;min-height:120px"></div>
      <div style="padding:10px 18px;border-top:1px solid var(--border,#e3e8f0);text-align:right">
        <button id="asClose" type="button" style="padding:9px 16px;background:#fff;border:1px solid var(--border,#e3e8f0);border-radius:8px;cursor:pointer">닫기</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  const q1=s=>ov.querySelector(s);
  const input=q1('#asInput'), results=q1('#asResults');
  const close=()=>ov.remove();
  q1('#asClose').addEventListener('click', close);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });

  const ps=new kakao.maps.services.Places();
  let lastData=[];
  const parseRegion=addr=>{ const p=String(addr||'').split(' '); return {sido:p[0]||'', sigungu:p[1]||'', dong:p[2]||''}; };
  const pick=place=>{
    const addr=place.road_address_name||place.address_name||'';
    const reg=parseRegion(place.address_name||place.road_address_name||'');
    return { placeName:place.place_name||'', address:addr,
      roadAddress:place.road_address_name||'', jibunAddress:place.address_name||'',
      phone:place.phone||'', lat:parseFloat(place.y), lng:parseFloat(place.x),
      sido:reg.sido, sigungu:reg.sigungu, dong:reg.dong };
  };
  const openMap=place=>{ window.open('https://map.kakao.com/link/map/'+encodeURIComponent((place.place_name||'현장')+','+place.y+','+place.x), '_blank'); };

  const rowHtml=(p,i)=>`
    <div class="asRow" data-i="${i}" style="display:flex;align-items:center;gap:8px;padding:11px 10px;border-bottom:1px solid #f0f3f8;cursor:pointer">
      <div style="min-width:0;flex:1">
        <div style="font-weight:700;font-size:13.5px;color:var(--navy,#1F3864);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.place_name||p.address_name||'')}</div>
        <div style="font-size:12px;color:#555;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.road_address_name||p.address_name||'')}</div>
        ${p.phone?`<div style="font-size:11.5px;color:var(--text-mute,#6F82A8);margin-top:1px">📞 ${esc(p.phone)}</div>`:''}
      </div>
      <button class="asMap" type="button" data-i="${i}" style="flex-shrink:0;padding:8px 10px;background:#fff;border:1px solid var(--border,#e3e8f0);border-radius:8px;font-size:12px;cursor:pointer">📍 지도</button>
    </div>`;
  const renderList=(list, note)=>{
    lastData=list;
    results.innerHTML=(note?`<div style="padding:8px 11px;font-size:11.5px;color:#7A4E0E;background:var(--amber-bg,#FBEFD6);border-radius:8px;margin:2px 2px 6px">${esc(note)}</div>`:'')
      + list.map((p,i)=>rowHtml(p,i)).join('');
  };
  // 장소검색 결과에 주소검색 결과를 합쳐(주소 직접입력 대응) 최대한 많이 보여줌
  const mergeAddress=(q, baseList, done)=>{
    try{
      const geo=new kakao.maps.services.Geocoder();
      geo.addressSearch(q, (adata, astatus)=>{
        const list=baseList.slice();
        if(astatus===kakao.maps.services.Status.OK){
          adata.forEach(a=>{
            const road=(a.road_address&&a.road_address.address_name)||'';
            const nm=a.address_name;
            if(!list.some(p=>(p.road_address_name||p.address_name)===nm)){
              list.push({ place_name:(a.road_address&&a.road_address.building_name)||nm, address_name:nm, road_address_name:road, x:a.x, y:a.y, phone:'' });
            }
          });
        }
        done(list);
      });
    }catch(e){ done(baseList.slice()); }
  };
  // keywordSearch/addressSearch를 Promise로 감싸 여러 변형을 순차 시도
  const kwSearch=(q)=> new Promise(res=>{ try{ ps.keywordSearch(q,(d,s)=>res(s===kakao.maps.services.Status.OK? d : []),{size:15}); }catch(e){ res([]); } });
  const addrSearch=(q)=> new Promise(res=>{ try{ new kakao.maps.services.Geocoder().addressSearch(q,(d,s)=>{ if(s!==kakao.maps.services.Status.OK) return res([]); res((d||[]).map(a=>({place_name:(a.road_address&&a.road_address.building_name)||a.address_name, address_name:a.address_name, road_address_name:(a.road_address&&a.road_address.address_name)||'', x:a.x, y:a.y, phone:''}))); }); }catch(e){ res([]); } });
  const mergeUniq=(a,b)=>{ const key=p=>(p.road_address_name||p.address_name||p.place_name||''); const seen=new Set(a.map(key)); (b||[]).forEach(p=>{ const k=key(p); if(k && !seen.has(k)){ seen.add(k); a.push(p); } }); return a; };
  // 단어 순서에 안 맞아도 찾게: 원본 + 뒤집기 + 앞단어 뒤로
  const variants=(q)=>{ const w=q.split(/\s+/).filter(Boolean); const v=[q]; if(w.length>=2){ v.push(w.slice().reverse().join(' ')); v.push(w.slice(1).concat(w[0]).join(' ')); } return [...new Set(v)]; };
  let searchSeq=0;
  async function doSearch(q, original){
    q=(q==null? (input.value||'') : q).trim();
    if(!q){ results.innerHTML=''; return; }
    original=original||q;
    const mySeq=++searchSeq;
    results.innerHTML='<div style="padding:24px;text-align:center;color:var(--text-mute,#6F82A8);font-size:13px">검색 중…</div>';
    let list=[];
    for(const v of variants(q)){ mergeUniq(list, await kwSearch(v)); if(mySeq!==searchSeq) return; if(list.length>=12) break; }
    if(list.length<3){ mergeUniq(list, await addrSearch(q)); if(mySeq!==searchSeq) return; }
    if(list.length){
      renderList(list, (q!==original)? `'${original}' 정확한 결과가 없어 '${q}'(으)로 넓혀 찾았어요` : '');
    } else {
      const parts=q.split(/\s+/);
      if(parts.length>1){ doSearch(parts.slice(0,-1).join(' '), original); }   // 마지막 단어 빼고 자동 재검색
      else { results.innerHTML='<div style="padding:28px;text-align:center;color:var(--text-mute,#6F82A8);font-size:13.5px">검색 결과가 없습니다.<br><span style="font-size:12px">상호명을 짧게(예: 브랜드+지역) 넣거나, 주소를 직접 입력해보세요.</span></div>'; }
    }
  }
  results.addEventListener('click', e=>{
    const mapBtn=e.target.closest('.asMap');
    if(mapBtn){ e.stopPropagation(); openMap(lastData[+mapBtn.dataset.i]); return; }
    const row=e.target.closest('.asRow');
    if(row){ const p=lastData[+row.dataset.i]; if(!p) return; const data=pick(p);
      console.log('[주소검색] 선택됨:', data.placeName, data.address);
      close(); if(opts.onComplete) opts.onComplete(data); }
  });
  // 실시간 검색: 타이핑하면 자동으로 결과가 뜸 (한글 조합 안전)
  let asComposing=false;
  const liveSearch=debounce(()=>{ if(!asComposing) doSearch(); }, 300);
  input.addEventListener('compositionstart', ()=>{ asComposing=true; });
  input.addEventListener('compositionend', ()=>{ asComposing=false; liveSearch(); });
  input.addEventListener('input', ()=>{ if(!asComposing) liveSearch(); });
  q1('#asGo').addEventListener('click', ()=>doSearch());
  // 📮 도로명·지번 주소 정밀검색 (다음 우편번호를 창 안에 임베드 → 팝업 차단 없음)
  const asPost=q1('#asPostcode');
  if(asPost) asPost.addEventListener('click', async ()=>{
    if(!(await loadPostcode())){ toast('주소검색을 불러오지 못했어요','warn'); return; }
    results.innerHTML='<div style="padding:6px 4px 4px;font-size:12px;color:var(--navy,#1F3864);font-weight:700">📮 도로명·지번·건물명으로 검색하세요</div><div id="asPostBox" style="width:100%;height:430px"></div>';
    const box=q1('#asPostBox');
    try{
      new daum.Postcode({
        async oncomplete(d){
          const road=d.roadAddress||d.address||'';
          const jibun=d.jibunAddress||d.autoJibunAddress||'';
          const data={ placeName:(d.buildingName||'')||'', address:road||jibun, roadAddress:road, jibunAddress:jibun,
            phone:'', sido:d.sido||'', sigungu:d.sigungu||'', dong:d.bname||'', zonecode:d.zonecode||'' };
          const geo=await kakaoGeocode(data.address); if(geo){ data.lat=geo[0]; data.lng=geo[1]; }
          console.log('[주소검색] 우편번호 선택:', data.address);
          close(); if(opts.onComplete) opts.onComplete(data);
        },
        width:'100%', height:'100%'
      }).embed(box);
    }catch(e){ console.error('postcode embed', e); toast('주소검색 창을 여는 데 실패했어요','warn'); }
  });
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doSearch(); } });
  input.focus();
  if((opts.query||'').trim()) doSearch();   // 상호명 있으면 바로 검색
}
/* 거래처 중복/유사 감지 — 상호·전화·주소 기준. returns [{client, why}] */
function findDuplicateClients(name, phone, addr, excludeId){
  const norm=s=>String(s||'').replace(/[\s\-()]/g,'').toLowerCase();
  const N=norm(name), P=norm(phone), A=norm(addr), out=[];
  (state.clients||[]).forEach(c=>{
    if(excludeId && c.id===excludeId) return;
    const cn=norm(c.branch||c.name), cp=norm(c.phone)||norm(c.mobile), ca=norm(c.address);
    let why='';
    if(N && cn && cn===N) why='같은 상호';
    else if(P && cp && cp===P) why='같은 전화번호';
    else if(A && ca && A.length>4 && ca===A) why='같은 주소';
    else if(N && cn && N.length>=3 && (cn.includes(N)||N.includes(cn))) why='유사한 상호';
    if(why) out.push({client:c, why});
  });
  return out;
}
/* 지도 링크(카카오맵) — 좌표 있으면 위치, 없으면 주소 검색 */
function kakaoMapLink(name, lat, lng, addr){
  if(lat&&lng) return 'https://map.kakao.com/link/map/'+encodeURIComponent((name||'현장')+','+lat+','+lng);
  if(addr) return 'https://map.kakao.com/link/search/'+encodeURIComponent(addr);
  return 'https://map.kakao.com';
}
/* 지도 그리기: points=[{lat,lng,label,no}], 선 연결 여부 */
async function drawKakaoMap(elId, points, opts){
  opts=opts||{};
  if(!(await loadKakao())) return false;
  const el=document.getElementById(elId); if(!el) return false;
  const valid=points.filter(p=>p.lat&&p.lng);
  if(!valid.length) return false;
  const center=new kakao.maps.LatLng(valid[0].lat, valid[0].lng);
  const map=new kakao.maps.Map(el, {center, level:opts.level||10});
  const bounds=new kakao.maps.LatLngBounds();
  valid.forEach(p=>{
    const pos=new kakao.maps.LatLng(p.lat,p.lng);
    bounds.extend(pos);
    const mk=new kakao.maps.Marker({map, position:pos, title:p.label||''});
    const iw=new kakao.maps.InfoWindow({ content:'<div style="padding:5px 8px;font-size:12px;white-space:nowrap">'+(p.no?('<b>'+p.no+'.</b> '):'')+(p.label||'')+'</div>' });
    kakao.maps.event.addListener(mk,'click',()=>iw.open(map,mk));
    if(opts.showLabels) iw.open(map,mk);
  });
  if(opts.line && valid.length>1){
    new kakao.maps.Polyline({ map, path:valid.map(p=>new kakao.maps.LatLng(p.lat,p.lng)),
      strokeWeight:4, strokeColor:'#1F3864', strokeOpacity:.8, strokeStyle:'shortdash' });
  }
  if(valid.length>1) map.setBounds(bounds);
  return true;
}

/* ===== 동선 지도 (남한 약도 + 방문 순서) — 외부 지도 API 없이 그린다 ===== */
const KR_OUTLINE = "126.75,37.90 127.10,38.30 128.36,38.62 129.03,37.55 129.44,36.05 129.35,35.50 129.05,35.10 128.40,34.92 127.75,34.80 127.42,34.30 126.90,34.42 126.50,34.32 126.32,34.80 126.42,35.52 126.62,36.02 126.50,36.80 126.72,37.20 126.40,37.62";
function routeMapSVG(ordered, startGeo){
  const W=100, H=132;                       // 기준 좌표계
  const LNG0=125.5, LNG1=130.0, LAT0=33.0, LAT1=38.8;
  const px=g=> ((g[1]-LNG0)/(LNG1-LNG0))*W;
  const py=g=> ((LAT1-g[0])/(LAT1-LAT0))*H;
  const outline = KR_OUTLINE.split(' ').map(p=>{ const [lng,lat]=p.split(',').map(Number); return px([lat,lng]).toFixed(1)+','+py([lat,lng]).toFixed(1); }).join(' ');
  const pts = ordered.filter(s=>s.geo||geoOf(s.addr, s.label)).map((s,i)=>{ const g=s.geo||geoOf(s.addr, s.label); return {x:px(g), y:py(g), i:i+1, label:s.label, km:s.legKm}; });
  const sg = startGeo? {x:px(startGeo), y:py(startGeo)} : null;
  let path='';
  const seq = (sg? [sg] : []).concat(pts);
  const __sc=(()=>{ const a2=(sg?[sg]:[]).concat(pts); if(!a2.length) return 1;
    const x0=Math.min(...a2.map(p=>p.x)),x1=Math.max(...a2.map(p=>p.x)),y0=Math.min(...a2.map(p=>p.y)),y1=Math.max(...a2.map(p=>p.y));
    const w=Math.max(1,(x1-x0)+Math.max(16,(x1-x0)*0.7)); return Math.min(3.2, Math.max(1, 100/w)); })();
  const LW=(0.8/__sc).toFixed(2), DASH=(1.6/__sc).toFixed(2)+' '+(1.2/__sc).toFixed(2);
  for(let i=1;i<seq.length;i++) path += `<line x1="${seq[i-1].x.toFixed(1)}" y1="${seq[i-1].y.toFixed(1)}" x2="${seq[i].x.toFixed(1)}" y2="${seq[i].y.toFixed(1)}" stroke="#1F3864" stroke-width="${LW}" stroke-dasharray="${DASH}" opacity=".8"/>`;
  // 방문지 범위에 맞춰 자동 확대 (가까운 곳끼리면 크게 보이도록)
  const all=(sg? [sg]:[]).concat(pts);
  let vb='0 0 '+W+' '+H, scale=1;
  if(all.length){
    let x0=Math.min(...all.map(p=>p.x)), x1=Math.max(...all.map(p=>p.x));
    let y0=Math.min(...all.map(p=>p.y)), y1=Math.max(...all.map(p=>p.y));
    const padX=Math.max(8,(x1-x0)*0.35), padY=Math.max(8,(y1-y0)*0.35);
    x0-=padX; x1+=padX; y0-=padY; y1+=padY;
    let w=x1-x0, h=y1-y0;
    const ar=W/H;                        // 비율 유지
    if(w/h > ar){ const nh=w/ar; y0-=(nh-h)/2; h=nh; } else { const nw=h*ar; x0-=(nw-w)/2; w=nw; }
    if(w<W*0.98){ vb=x0.toFixed(1)+' '+y0.toFixed(1)+' '+w.toFixed(1)+' '+h.toFixed(1); scale=W/w; }
  }
  const S=n=>(n/Math.max(1,Math.min(scale,3.2))).toFixed(2);   // 확대 시 글자·점 크기 보정
  return `<svg viewBox="${vb}" style="width:100%;max-width:300px;display:block;margin:0 auto">
    <polygon points="${outline}" fill="#EDF1F7" stroke="#B9C4D4" stroke-width="0.6"/>
    <ellipse cx="${px([33.42,126.55]).toFixed(1)}" cy="${py([33.42,126.55]).toFixed(1)}" rx="3.2" ry="1.8" fill="#EDF1F7" stroke="#B9C4D4" stroke-width="0.5"/>
    ${path}
    ${sg? `<circle cx="${sg.x.toFixed(1)}" cy="${sg.y.toFixed(1)}" r="${(2/__sc).toFixed(2)}" fill="#fff" stroke="#1F3864" stroke-width="${(1/__sc).toFixed(2)}"/><text x="${sg.x.toFixed(1)}" y="${(sg.y-3/__sc).toFixed(1)}" font-size="${(3.2/__sc).toFixed(2)}" text-anchor="middle" fill="#1F3864">출발</text>`:''}
    ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(2.6/__sc).toFixed(2)}" fill="#1F3864"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y+1.1/__sc).toFixed(1)}" font-size="${(3/__sc).toFixed(2)}" text-anchor="middle" fill="#fff" font-weight="700">${p.i}</text>
      <text x="${p.x.toFixed(1)}" y="${(p.y+5.2/__sc).toFixed(1)}" font-size="${(2.6/__sc).toFixed(2)}" text-anchor="middle" fill="#1F3864">${esc((p.label||'').slice(0,10))}</text>`).join('')}
  </svg>`;
}

/* ===== 지역별 대기 현장 — 전국 다니는 회사의 핵심: 묶어서 한 번에 가기 ===== */

function regionOf(addr){
  if(!addr) return '기타';
  const s=String(addr).replace(/\s/g,'');
  for(const g in REGION_GROUP){ for(const k of REGION_GROUP[g]){ if(s.indexOf(k)>=0) return g; } }
  return '기타';
}
/* 날짜 미정이거나 앞으로 해야 할 현장 전부 */
function pendingSites(){
  const out=[];
  state.quotes.forEach(q=>{
    if(q.status!=='계약') return;
    const j=getJob(q.id), inst=getInstall(q.id);
    if(inst.doneDate || j.step==='시공완료') return;
    const c=state.clients.find(x=>x.name===q.client)||{};
    const addr=j.site||c.address||q.region||'';
    out.push({ id:'i_'+q.id, qid:q.id, type:'설치', label:q.client, addr,
               when:j.installDate||'', region:regionOf(addr), amount:quoteTotal(q) });
  });
  state.asList.forEach(a=>{
    if(a.doneDate) return;
    const c=state.clients.find(x=>x.name===a.client)||{};
    const addr=c.address||'';
    out.push({ id:'a_'+a.id, qid:null, type:'A/S', label:a.client, addr,
               when:a.date||'', region:regionOf(addr), amount:0 });
  });
  return out;
}
function pendingByRegion(){
  const g={};
  pendingSites().forEach(s=>{ (g[s.region]=g[s.region]||[]).push(s); });
  return Object.entries(g).sort((a,b)=>b[1].length-a[1].length);
}

/* 네이버지도 자동차 길찾기 — 좌표 기반(실제로 경로가 그려지는 형식) */
function naverRouteUrl(ordered){
  try{
    const co=getCompany();
    const enc=t=>encodeURIComponent(String(t||'').slice(0,40));
    const seg=(g,name)=> g? (g[1].toFixed(6)+','+g[0].toFixed(6)+','+enc(name)) : null;
    const sg=geoOf(co.addr);
    const stops=ordered.map(x=>({g:(x.geo||geoOf(x.addr,x.label)), n:(x.label||x.addr)})).filter(x=>x.g);
    if(!stops.length) return '';
    const start=sg? seg(sg,'회사') : seg(stops[0].g, stops[0].n);
    const rest=sg? stops : stops.slice(1);
    if(!rest.length) return 'https://map.naver.com/p/search/'+enc(stops[0].n);
    const goal=seg(rest[rest.length-1].g, rest[rest.length-1].n);
    const way=rest.slice(0,-1).map(x=>seg(x.g,x.n)).filter(Boolean).slice(0,5);
    // 형식: /p/directions/{출발}/{도착}/{경유지들}/car
    return 'https://map.naver.com/p/directions/'+start+'/'+goal+'/'+(way.length? way.join(':'):'-')+'/car';
  }catch(e){ return ''; }
}

function routeStartGeo(){
  if(state.routeStart==='current' && state.routeCurGeo) return state.routeCurGeo;
  if(state.routeStart==='custom' && state.routeStartCustomGeo) return state.routeStartCustomGeo;
  return geoOf(getCompany().addr);
}
function computeRoute(date){
  const cands=routeCandidates(date).concat(routeExtras(date)).concat(routeSuggestions(date));
  const picked = state.routePick || routeCandidates(date).concat(routeExtras(date)).map(c=>c.id);
  const doneSet=routeDoneSet(date);
  const chosen=cands.filter(c=>picked.includes(c.id));
  const undone=chosen.filter(c=>!doneSet.has(c.id));
  const done=chosen.filter(c=>doneSet.has(c.id));
  let ordered;
  if(state.routeOrder){
    ordered = state.routeOrder.map(id=>undone.find(c=>c.id===id)).filter(Boolean);
    undone.forEach(c=>{ if(!ordered.includes(c)) ordered.push(c); });
    let cur=routeStartGeo();
    ordered.forEach(s=>{ s.geo=geoOf(s.addr, s.label); s.legKm=(cur&&s.geo)?Math.round(haversine(cur,s.geo)):null; if(s.geo) cur=s.geo; });
  } else {
    ordered=optimizeRoute(routeStartGeo(), undone);
  }
  return {cands, chosen, ordered, done, picked};
}

/* ===== V2-8 자동백업 (기기 내 스냅샷) ===== */
const AUTO_KEEP = 7;
async function autoBackupRun(force){
  try{
    const last = await store.get('autoBackupAt').catch(()=>null);
    const today = todayStr();
    if(!force && last===today) return;
    const snaps = (await store.get('autoSnaps').catch(()=>null)) || [];
    snaps.unshift({at:new Date().toISOString(), date:today, data:collectPayload()});
    const trimmed = snaps.slice(0, AUTO_KEEP);
    await store.set('autoSnaps', trimmed);
    await store.set('autoBackupAt', today);
    state.autoSnaps = trimmed;
  }catch(e){ console.error('자동백업 실패', e); }
}
async function autoRestore(i){
  const snaps = state.autoSnaps || (await store.get('autoSnaps').catch(()=>[])) || [];
  const s0 = snaps[i]; if(!s0) return false;
  await applyPayload(s0.data);
  scheduleCloudPush();
  return true;
}

/* ===== 모바일 문서 저장·공유 (PDF / 이미지 / Web Share) =====
   기존 문서 HTML은 그대로 두고, 팝업 대신 페이지 내 뷰어로 열어
   PDF 저장·이미지 저장·공유·인쇄를 모바일에서 안정적으로 지원한다. */
function docFilename(base, ext){
  const safe = String(base||'문서').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'_').slice(0,60);
  return safe + '_' + todayStr() + '.' + ext;
}
function loadScriptOnce(src){
  window.__docLibs = window.__docLibs || {};
  if(window.__docLibs[src]) return window.__docLibs[src];
  window.__docLibs[src] = new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src; s.async=true;
    s.onload=()=>res(true); s.onerror=()=>rej(new Error('load fail: '+src));
    document.head.appendChild(s);
  });
  return window.__docLibs[src];
}
async function ensureDocLibs(need){
  const out={h2c:!!window.html2canvas, pdf:!!(window.jspdf&&window.jspdf.jsPDF)};
  try{
    if(need.h2c && !out.h2c){ await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'); out.h2c=!!window.html2canvas; }
    if(need.pdf && !out.pdf){ await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); out.pdf=!!(window.jspdf&&window.jspdf.jsPDF); }
  }catch(e){ /* 오프라인/차단 → 아래에서 fallback */ }
  return out;
}

function humanSizeDL(n){ n=n||0; return n<1024? n+'B' : n<1048576? (n/1024).toFixed(0)+'KB' : (n/1048576).toFixed(1)+'MB'; }
async function recordDownload(blob, filename, kind){

async function dvShareFile(blob, filename, title){
  // 1) 공유창 (안드로이드·아이폰: 갤러리 저장/카톡 전송 다 여기서 가능)
  try{
    const file=new File([blob], filename, {type:blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:title||filename});
      return 'shared';
    }
  }catch(e){ if(e && e.name==='AbortError') return 'abort'; }
  // 2) 폰인데 공유가 막힌 브라우저(카톡 인앱 등): 새 탭에 띄워 길게 눌러 저장
  const mob = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) || window.matchMedia('(max-width:760px)').matches;
  if(mob && (/^image\//.test(blob.type) || blob.type==='application/pdf')){
    try{
      const url=URL.createObjectURL(blob);
      const w=window.open(url,'_blank');
      if(w){ setTimeout(()=>URL.revokeObjectURL(url), 180000); return 'tab'; }
    }catch(e){}
  }
  // 3) 데스크톱: 일반 다운로드
  dvDownload(blob, filename);
  return 'downloaded';
}

  bClose.addEventListener('click', close);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });

  // 인쇄: 미리보기 그대로 인쇄 (캡처 이미지를 A4로 인쇄 → 미리보기와 결과 일치)
  bPrint.addEventListener('click', async ()=>{
    setSpin(true,'인쇄 준비 중…');
    const libs=await ensureDocLibs({h2c:true});
    if(libs.h2c){
      try{ const canvas=await dvCanvas(iframe); setSpin(false); await dvPrintImage(canvas.toDataURL('image/png'), land); return; }
      catch(e){ /* 아래 기본 인쇄로 */ }
    }
    setSpin(false);
    try{ iframe.contentWindow.focus(); iframe.contentWindow.print(); }
    catch(e){ toast('이 브라우저에서 인쇄가 막혀 있어요. PDF 저장을 이용해 주세요.','warn'); }
  });

  // 이미지(PNG) 저장/공유
  bImg.addEventListener('click', async ()=>{
    setSpin(true,'이미지 만드는 중…');
    const libs=await ensureDocLibs({h2c:true});
    if(!libs.h2c){ setSpin(false); toast('오프라인이라 이미지 생성이 어려워요. 인쇄→PDF로 저장해 주세요.','warn'); return; }
    try{
      const canvas=await dvCanvas(iframe);
      const blob=await canvasToBlob(canvas,'image/png');
      setSpin(false);
      await recordDownload(blob, docFilename(base,'png'), (opts.title||base));
      const r=await dvShareFile(blob, docFilename(base,'png'), opts.title||base);
      toast(r==='downloaded'? '이미지를 저장했어요 ('+humanSizeDL(blob.size)+')' : (r==='shared'?'공유했어요':'취소됨'), r==='abort'?'warn':'ok');
    }catch(e){ setSpin(false); toast('이미지 생성 실패: 인쇄→PDF를 이용해 주세요.','warn'); }
  });

  // PDF 저장/공유 (A4, 고화질 이미지 기반)
  bPdf.addEventListener('click', async ()=>{
    setSpin(true,'PDF 만드는 중…');
    const libs=await ensureDocLibs({h2c:true,pdf:true});
    if(!libs.h2c || !libs.pdf){
      setSpin(false);
      toast('오프라인이라 PDF 자동생성이 어려워요. 인쇄 → "PDF로 저장"을 이용해 주세요.','warn');
      try{ iframe.contentWindow.focus(); iframe.contentWindow.print(); }catch(e){}
      return;
    }
    try{
      const canvas=await dvCanvas(iframe);
      const { jsPDF }=window.jspdf;
      const pdf=new jsPDF({unit:'mm', format:'a4', orientation: land?'landscape':'portrait'});
      const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
      const margin=8;
      let w=pw-margin*2, h=canvas.height*w/canvas.width;
      if(h>ph-margin*2){ h=ph-margin*2; w=canvas.width*h/canvas.height; }
      const x=(pw-w)/2, y=margin;
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',x,y,w,h,undefined,'FAST');
      const fname=docFilename(base,'pdf');
      const blob=pdf.output('blob');
      setSpin(false);
      const pblob=new Blob([blob],{type:'application/pdf'});
      await recordDownload(pblob, fname, (opts.title||base));
      const r=await dvShareFile(pblob, fname, opts.title||base);
      toast(r==='downloaded'? 'PDF를 저장했어요 ('+humanSizeDL(pblob.size)+')' : (r==='shared'?'PDF를 공유했어요':'취소됨'), r==='abort'?'warn':'ok');
    }catch(e){ setSpin(false); toast('PDF 생성 실패: 인쇄를 이용해 주세요.','warn'); try{ iframe.contentWindow.print(); }catch(_){} }
  });

  // 공유: 이미지(PNG) Web Share → 클립보드 이미지 복사(카톡) → 다운로드 → 텍스트
  bShare.addEventListener('click', async ()=>{
    setSpin(true,'공유 준비 중…');
    const libs=await ensureDocLibs({h2c:true, pdf:true});
    // 1순위: PDF 파일 공유 (카톡·메일·드라이브)
    if(libs.h2c && libs.pdf){
      try{
        const canvas=await dvCanvas(iframe);
        const { jsPDF }=window.jspdf;
        const pdf=new jsPDF({unit:'mm', format:'a4', orientation: land?'landscape':'portrait'});
        const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(), margin=8;
        let w=pw-margin*2, h=canvas.height*w/canvas.width;
        if(h>ph-margin*2){ h=ph-margin*2; w=canvas.width*h/canvas.height; }
        pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',(pw-w)/2,margin,w,h,undefined,'FAST');
        const fname=docFilename(base,'pdf');
        const pblob=new Blob([pdf.output('blob')],{type:'application/pdf'});
        setSpin(false);
        await recordDownload(pblob, fname, (opts.title||base));
        try{
          const file=new File([pblob], fname, {type:'application/pdf'});
          if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:opts.title||base}); toast('PDF를 공유했어요','ok'); return; }
        }catch(e){ if(e&&e.name==='AbortError') return; }
        // 2순위: 카톡용 이미지 클립보드 복사
        try{ const imgBlob=await canvasToBlob(canvas,'image/png'); if(await dvCopyImage(imgBlob)){ toast('이미지를 복사했어요. 카톡에 붙여넣기 하세요.','ok'); return; } }catch(e){}
        // 3순위: PDF 다운로드
        dvDownload(pblob, fname); toast('PDF를 저장했어요 ('+humanSizeDL(pblob.size)+')','ok'); return;
      }catch(e){ /* 아래 텍스트 fallback */ }
    }
    setSpin(false);
    if(opts.text){
      try{ if(navigator.share){ await navigator.share({title:opts.title||base, text:opts.text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
      try{ await navigator.clipboard.writeText(opts.text); toast('내용을 복사했어요. 카톡에 붙여넣기 하세요.','ok'); }
      catch(e){ prompt('아래 내용을 길게 눌러 복사하세요', opts.text); }
    }else{
      toast('오프라인이라 공유가 어려워요. PDF 저장을 이용해 주세요.','warn');
    }
  });

  return ov;
}

function getProject(qid){
  const p = (state.projects||{})[qid] || {};
  return {
    stages: p.stages || {},          // {단계:{at,by}}
    checks: p.checks || {},          // {항목:{at,by}}
    design: p.design || {designer:'', reqDate:'', dueDate:'', doneDate:'', state:'의뢰전', memo:''},
    print:  p.print  || {vendor:'', orderDate:'', dueDate:'', doneDate:'', recvDate:'', state:'발주', memo:''},
    timeline: p.timeline || [],
    cost: p.cost || {material:0, outsource:0, labor:0, transport:0, etc:0, memo:''}, // 원가관리
    files: p.files || []             // 메타데이터만(실파일은 IndexedDB)
  };
}

/* 견적 확정(계약) 시 프로젝트 자동 생성 + 이력 기록 */
async function ensureProject(qid){
  state.projects = state.projects || {};
  const existed = !!state.projects[qid];
  const pj = getProject(qid);
  if(!existed){
    // 견적작성·발송 단계는 이미 지난 것으로 자동 표시
    const now={at:new Date().toISOString(), by:(getCompany().ceo||'담당')};
    if(!pj.stages['견적작성']) pj.stages['견적작성']=now;
    if(!pj.stages['견적발송']) pj.stages['견적발송']=now;
    if(!pj.stages['계약'])     pj.stages['계약']=now;
    state.projects[qid]=pj;
    await saveProjects();
    await pjLog(qid, '프로젝트 생성 (견적 계약)', '프로젝트');
    const qq=state.quotes.find(x=>x.id===qid);
    await logActivity('프로젝트 생성 · '+((qq&&qq.client)||'')+' ('+((qq&&qq.qnum)||'')+')', '프로젝트');
  }
}
async function saveProjects(){
  scheduleCloudPush();
  try{ await store.set('projects', state.projects||{}); }
  catch(e){ console.error('project save failed', e); }
}
async function pjLog(qid, text, kind){
  state.projects = state.projects || {};
  const pj = getProject(qid);
  pj.timeline = pj.timeline || [];
  pj.timeline.unshift({at:new Date().toISOString(), text, kind:kind||'기록'});
  if(pj.timeline.length>200) pj.timeline = pj.timeline.slice(0,200);

  await saveProjects();

/* 단계별 똑똑한 기본 날짜 — 이미 아는 날짜가 있으면 그 날로 (과거 정리용) */
function smartStageDate(qid, stage){
  const q=state.quotes.find(x=>x.id===qid); if(!q) return null;
  const j=getJob(qid), pj=getProject(qid), inst=getInstall(qid), pay=getPayment(qid);
  const pick=d=> d? new Date(d+'T09:00').toISOString() : null;
  if(stage==='견적작성'||stage==='견적발송'||stage==='계약') return pick(q.date);
  if(stage==='디자인진행') return pick(pj.design&&pj.design.reqDate);
  if(stage==='디자인완료') return pick(pj.design&&pj.design.doneDate);
  if(stage==='인쇄발주')  return pick(pj.print&&pj.print.orderDate);
  if(stage==='인쇄완료')  return pick(pj.print&&pj.print.recvDate);
  if(stage==='설치예정')  return pick(j.installDate);
  if(stage==='설치완료')  return pick(inst.doneDate||j.installDate);
  return null;
}
/* 단계 날짜 직접 지정 (과거 날짜로 완료 처리) */
async function pjSetStageDate(qid, stage, ymdStr){
  const pj=getProject(qid);
  if(!pj.stages[stage]) return;
  pj.stages[stage].at = new Date((ymdStr||todayStr())+'T09:00').toISOString();
  state.projects[qid]=pj; await saveProjects();
  await pjLog(qid, stage+' 날짜 '+ymdStr+'로 지정', '단계');
  // 설치완료면 시공 완료일도 같이 맞춰준다
  if(stage==='설치완료'){ const inst=getInstall(qid); inst.doneDate=ymdStr; state.install[qid]=inst; await saveInstall(); }
}
async function pjToggleStage(qid, stage){
  state.projects = state.projects || {};
  const pj = getProject(qid);
  if(pj.stages[stage]){ delete pj.stages[stage]; state.projects[qid]=pj; await saveProjects(); await pjLog(qid, stage+' 해제', '단계'); }
  else{
    pj.stages[stage] = {at:(smartStageDate(qid, stage)||new Date().toISOString()), by:(getCompany().ceo||'담당')};
    state.projects[qid]=pj; await saveProjects(); await pjLog(qid, stage, '단계');
    await pjSyncFromStage(qid, stage);
  }
}
/* 단계 체크 → 기존 모듈과 자동 연동 (기존 기능 유지하며 반영만) */
async function pjSyncFromStage(qid, stage){
  const q = state.quotes.find(x=>x.id===qid); if(!q) return;
  if(stage==='계약' && q.status==='견적발송'){ q.status='계약'; await saveQuotes(); }
  if(stage==='설치완료'){
    const j=getJob(qid); j.step='시공완료'; if(!j.jobNo) j.jobNo=makeJobNo(q);
    state.jobs[qid]=j; await saveJobs();
    if(q.status==='계약'){ q.status='시공완료'; await saveQuotes(); }
    const inst=getInstall(qid);
    if(!inst.doneDate){ const st=getProject(qid).stages['설치완료']; inst.doneDate=(st&&st.at)? st.at.slice(0,10) : (j.installDate||todayStr()); state.install[qid]=inst; await saveInstall(); }
  }
  if(stage==='제작완료'){
    const cur=state.mfg[qid]||{}; MFG_STEPS.forEach(st=>{cur[st]=true;}); delete cur['출고'];
    state.mfg[qid]=cur; await saveMfg();
  }
}
async function pjToggleCheck(qid, item){
  state.projects = state.projects || {};
  const pj = getProject(qid);
  if(pj.checks[item]){ delete pj.checks[item]; }
  else { pj.checks[item] = {at:new Date().toISOString()}; }
  state.projects[qid]=pj; await saveProjects();
  await pjLog(qid, '체크: '+item+(pj.checks[item]?' 완료':' 해제'), '체크');
}
function pjProgress(qid){
  const pj=getProject(qid);
  const done=PJ_STAGES.filter(s=>pj.stages[s.k]).length;
  return {done, total:PJ_STAGES.length, pct:Math.round(done/PJ_STAGES.length*100)};
}
/* 프로젝트 파일 (IndexedDB 저장, 클라우드 미동기화) */
async function pjLoadFiles(qid){
  if(USE_IDB){ const r=await PhotoDB.get('files_'+qid); if(r!==null) return r; }
  try{ return await store.get('files_'+qid); }catch(e){ return []; }
}
async function pjSaveFiles(qid, arr){
  if(USE_IDB){ const ok=await PhotoDB.set('files_'+qid, arr); if(ok) return true; }
  try{ await store.set('files_'+qid, arr); return true; }catch(e){ return false; }
}
function fileToData(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file);
  });
}
function humanSize(n){ return n<1024? n+'B' : n<1048576? (n/1024).toFixed(0)+'KB' : (n/1048576).toFixed(1)+'MB'; }

/* 프로젝트 다음 할 일(첫 미완료 단계) */
function pjNextStage(qid){
  const pj=getProject(qid);
  const nx=PJ_STAGES.find(s=>!pj.stages[s.k]);
  return nx? nx.k : null;
}
function pjCurrentStage(qid){
  const pj=getProject(qid);
  let cur=null;
  PJ_STAGES.forEach(s=>{ if(pj.stages[s.k]) cur=s.k; });
  return cur;
}

function calEvents(){

  const add=(d,type,label,color,qid,extra)=>{ if(!d) return; (ev[d]=ev[d]||[]).push(Object.assign({type,label,color,qid},extra||{})); };
  state.quotes.forEach(q=>{
    const j=getJob(q.id), pj=getProject(q.id), inst=getInstall(q.id);
    add(q.date,'견적',q.client,'#5A6478',q.id);
    if(j.installDate) add(j.installDate, j.step==='시공완료'?'설치완료':'설치', q.client, '#B3311C', q.id);
    if(inst.doneDate && inst.doneDate!==j.installDate) add(inst.doneDate,'설치완료',q.client,'#1F7A4D',q.id);
    if(pj.design.reqDate) add(pj.design.reqDate,'디자인의뢰',q.client,'#7B4FA8',q.id);
    if(pj.design.doneDate) add(pj.design.doneDate,'디자인완료',q.client,'#7B4FA8',q.id);
    if(pj.print.orderDate) add(pj.print.orderDate,'인쇄발주',q.client,'#C87F1E',q.id);
    if(pj.print.recvDate) add(pj.print.recvDate,'인쇄수령',q.client,'#C87F1E',q.id);
    const p=getPayment(q.id);
    ['depositDate','middleDate','balanceDate'].forEach(k=>{ if(p[k]) add(p[k],'수금',q.client,'#1F7A4D',q.id); });
  });
  state.asList.forEach(a=> add(a.date,'A/S',a.client,'#1F3864',null,{asId:a.id}));
  (state.workJobs||[]).forEach(w=>{
    if(w.plan) add(w.plan,'설치', w.client||w.site||'시공', '#C55A11', null, {wjId:w.id});
    if(w.done) add(w.done,'설치완료', w.client||w.site||'시공', '#2E7D32', null, {wjId:w.id});
  });
  // 사용자 직접 등록 일정
  (state.events||[]).forEach(e=>{
    eachDate(e.startDate, e.endDate).forEach(d=> add(d, e.cat||'기타', (e.done?'✔ ':'')+(e.title||''), e.color||catColor(e.cat), null, {isUser:true, eid:e.id, done:!!e.done, priority:e.priority}));
  });
  return ev;
}
function eventById(id){ return (state.events||[]).find(e=>e.id===id); }
/* 오늘/이번주/다가오는 일정 요약 (대시보드 연동) */
function eventSummary(){
  const t=todayStr();
  const wkEnd=new Date(t+'T00:00'); wkEnd.setDate(wkEnd.getDate()+7); const wk=ymd(wkEnd);
  const inRange=(e,a,b)=>{ const s=e.startDate, en=e.endDate||e.startDate; return s && s<=b && en>=a; };
  const list=(state.events||[]).filter(e=>!e.done);
  return {
    today: list.filter(e=>inRange(e,t,t)).length,
    week: list.filter(e=>inRange(e,t,wk)).length,
    upcoming: list.filter(e=>(e.startDate||'')>t).sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||'')).slice(0,5)
  };
}
function renderCalendar(){
  const base = state.calMonth || todayStr().slice(0,7);
  const [Y,M] = base.split('-').map(Number);
  const first = new Date(Y, M-1, 1), last = new Date(Y, M, 0);
  const startDow = first.getDay(), days = last.getDate();
  const ev = calEvents();
  const T = todayStr();
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=days;d++) cells.push(`${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  while(cells.length%7) cells.push(null);
  const sel = state.calSel;

  return `
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <h2 style="margin:0">📆 ${Y}년 ${M}월</h2>
        <div style="display:flex;gap:6px">
          <button class="btn secondary calNav" data-d="-1" style="padding:5px 12px">‹</button>
          <button class="btn secondary calNav" data-d="0" style="padding:5px 12px">오늘</button>
          <button class="btn secondary calNav" data-d="1" style="padding:5px 12px">›</button>
        </div>
      </div>
      ${(()=>{ const sm=eventSummary(); if(!sm.today && !sm.week && !sm.upcoming.length) return '';
        return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:12px">
          <span class="badge" style="background:#EAF0FA;color:#1F3864">오늘 일정 ${sm.today}건</span>
          <span class="badge" style="background:#EAF0FA;color:#1F3864">이번주 ${sm.week}건</span>
          ${sm.upcoming[0]? `<span style="color:var(--text-mute)">다가오는: ${esc(sm.upcoming[0].startDate)} ${esc(sm.upcoming[0].title)}</span>`:''}
        </div>`; })()}
      <div class="calgrid">
        ${['일','월','화','수','목','금','토'].map((d,i)=>`<div class="caldow" style="color:${i===0?'#B3311C':i===6?'#1F3864':'var(--text-mute)'}">${d}</div>`).join('')}
        ${cells.map(d=>{
          if(!d) return '<div class="calcell empty"></div>';
          const list=ev[d]||[];
          const dn=Number(d.slice(8));
          const dow=new Date(d).getDay();
          return `<div class="calcell ${d===T?'today':''} ${d===sel?'sel':''} calDay" data-d="${d}">
            <div class="caldn" style="color:${dow===0?'#B3311C':dow===6?'#1F3864':'inherit'}">${dn}</div>
            ${list.slice(0,3).map(e=>`<div class="calev${e.done?' done':''}" style="background:${e.color}" ${e.eid?`data-eid="${e.eid}"`:''} ${e.qid?`data-qid="${esc(e.qid)}"`:''} ${e.asId?`data-asid="${e.asId}"`:''} ${e.wjId?`data-wjid="${e.wjId}"`:''} title="눌러서 보기">${esc(e.type)} ${esc(e.label)}</div>`).join('')}
            ${list.length>3? `<div class="calmore">+${list.length-3}</div>`:''}
          </div>`;
        }).join('')}
      </div>
      ${(()=>{ const day=sel||T; const l=ev[day]||[];
        return `<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:8px">
            <div style="font-size:13px;font-weight:700">${esc(day)} 일정 ${l.length}건</div>
            ${(()=>{ const R=computeRoute(day); const n=R.chosen.length; if(n<2) return '';
              const km=R.ordered.reduce((s,x)=>s+(x.legKm||0),0);
              return `<button class="btn secondary calRoute" data-d="${day}" style="padding:5px 12px;font-size:12px">🚗 이 날 동선 ${n}곳${km?' · ~'+km+'km':''}</button>`; })()}
            <button class="btn evAdd" data-d="${day}" style="padding:5px 12px;font-size:12px">+ ${esc(day.slice(5).replace('-','/'))} 일정 추가</button>
          </div>
          ${l.length? l.map(e=>`<div class="tdrow"><span class="badge${e.done?' done':''}" style="background:${e.color};color:#fff">${esc(e.type)}</span><b style="${e.done?'text-decoration:line-through;color:var(--text-mute)':''}">${esc(e.label)}</b>
            <span style="margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">
              ${e.isUser? `<button class="btn secondary evDone" data-id="${e.eid}" style="padding:8px 12px;font-size:12px;min-height:38px">${e.done?'되돌리기':'완료'}</button>

                <button class="btn secondary evDel" data-id="${e.eid}" style="padding:8px 12px;font-size:12px;min-height:38px;color:var(--red);border-color:#E7C4BC">삭제</button>`
              : e.asId? `<button class="btn secondary asEditCal" data-id="${e.asId}" style="padding:8px 12px;font-size:12px;min-height:38px">수정</button>
                <button class="btn secondary asDelCal" data-id="${e.asId}" style="padding:8px 12px;font-size:12px;min-height:38px;color:var(--red);border-color:#E7C4BC">삭제</button>`
              : e.wjId? `<button class="btn secondary wjEdit" data-id="${e.wjId}" style="padding:8px 12px;font-size:12px;min-height:38px">수정</button>`
              : (e.type==='설치'||e.type==='설치완료')? `<button class="btn secondary calQuote" data-id="${esc(e.qid)}" style="padding:8px 12px;font-size:12px;min-height:38px">견적서</button>
                <button class="btn secondary qEditCal" data-id="${esc(e.qid)}" style="padding:8px 12px;font-size:12px;min-height:38px">시공일 변경</button>
                <button class="btn secondary instClearCal" data-id="${esc(e.qid)}" style="padding:8px 12px;font-size:12px;min-height:38px;color:var(--red);border-color:#E7C4BC">삭제</button>`
              : (e.qid? `<button class="btn secondary calQuote" data-id="${esc(e.qid)}" style="padding:8px 12px;font-size:12px;min-height:38px">견적서</button>
                <button class="btn secondary qEditCal" data-id="${esc(e.qid)}" style="padding:8px 12px;font-size:12px;min-height:38px">수정</button>`:'')}
            </span></div>`).join('')
            : '<div style="font-size:12.5px;color:var(--text-mute)">일정이 없어요. <b>+ 일정 추가</b>로 등록하세요.</div>'}
        </div>`; })()}
    </div>`;
}

/* 설치 일정 충돌: 같은 날 2건 이상 예정(시공완료 제외), 오늘~14일 이내 */
function installConflicts(){
  const t=todayStr();
  const limit=new Date(t); limit.setDate(limit.getDate()+14);
  const limS=ymd(limit);
  const byDate={};
  state.quotes.forEach(q=>{
    const j=getJob(q.id);
    if(j.installDate && j.installDate>=t && j.installDate<=limS && j.step!=='시공완료'){
      (byDate[j.installDate]=byDate[j.installDate]||[]).push(q.client);
    }
  });
  return Object.keys(byDate).filter(d=>byDate[d].length>=2).sort()
    .map(d=>({date:d, clients:byDate[d]}));
}
function renderTodayCard(){
  const t=todayStr();
  const conflicts=installConflicts();
  const inst = state.quotes.filter(q=>getJob(q.id).installDate===t && getJob(q.id).step!=='시공완료');
  const mfg  = state.quotes.filter(q=>{const p=mfgProgress(q.id); return p.pct>0 && p.pct<100;});
  const ship = state.quotes.filter(q=>{const m=getMfg(q.id); return m['조립'] && !m['출고'];});
  const as   = state.asList.filter(a=>!a.done);
  const visit= state.quotes.filter(q=>q.status==='견적발송' && q.date===t);
  const overdue = state.quotes.filter(q=>{const j=getJob(q.id); return j.installDate && j.installDate<t && j.step!=='시공완료';});
  const total = inst.length+mfg.length+ship.length+as.length+visit.length+overdue.length;

  const block=(icon,title,list,view,fmtRow)=> !list.length? '' : `

      ${total===0? '<div class="empty" style="padding:22px">오늘 예정된 업무가 없어요. 👍</div>' : `

        ${block('🔴','오늘 설치',inst,'install',q=>`<div class="tdrow hmQuote" data-qid="${q.id}"><b>${esc(q.client)}</b><span>${esc(getJob(q.id).site||q.region||'')}</span>${(getJob(q.id).site||q.region)?`<a href="#" class="mapBtn" data-a="${esc(getJob(q.id).site||q.region)}">📍</a>`:''}</div>`)}

      </div>`}
    </div>`;

/* ===== V2-6 휴지통 (소프트 삭제) ===== */
async function trashPush(type, label, data, extra){
  state.trash = state.trash || [];
  state.trash.unshift({
    tid:'t_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    type, label, at:new Date().toISOString(), data, extra:extra||null
  });
  if(state.trash.length>200) state.trash = state.trash.slice(0,200);   // 무한 증가 방지
  await store.set('trash', state.trash);
  scheduleCloudPush();
}
async function trashRestore(tid){
  const it=(state.trash||[]).find(x=>x.tid===tid);
  if(!it) return false;
  if(it.type==='quote'){
    if(state.quotes.some(q=>q.id===it.data.id)){ toast('이미 같은 견적이 있어요','warn'); return false; }
    state.quotes.push(it.data);
    if(it.extra){
      if(it.extra.payment) state.payments[it.data.id]=it.extra.payment;
      if(it.extra.job) state.jobs[it.data.id]=it.extra.job;
      if(it.extra.mfg) state.mfg[it.data.id]=it.extra.mfg;
      if(it.extra.install) state.install[it.data.id]=it.extra.install;
      await savePayments(); await saveJobs(); await saveMfg(); await saveInstall();
    }
    await saveQuotes();
  } else if(it.type==='client'){
    if(!state.clients.some(c=>c.id===it.data.id)){ state.clients.push(it.data); await saveClients(); }
  } else if(it.type==='item'){
    if(!state.items.some(i=>i.id===it.data.id)){ state.items.push(it.data); await saveItems(); }
  } else if(it.type==='as'){
    if(!state.asList.some(a=>a.id===it.data.id)){ state.asList.push(it.data); await saveAsList(); }
  }
  state.trash=state.trash.filter(x=>x.tid!==tid);
  await store.set('trash', state.trash);
  scheduleCloudPush();
  return true;
}
async function trashPurge(tid){
  state.trash=(state.trash||[]).filter(x=>x.tid!==tid);
  await store.set('trash', state.trash);
  scheduleCloudPush();
}

function kanStage(qid){
  const j=getJob(qid), p=mfgProgress(qid);
  if(j.step==='시공대기'||j.step==='시공완료') return '시공대기';
  if(p.pct===100) return '완료';
  if(p.pct>0||j.step==='제작중') return '제작중';
  return '대기';
}
async function kanMove(qid, to){
  const q=state.quotes.find(x=>x.id===qid); if(!q) return;
  const j=getJob(qid);
  if(!j.jobNo) j.jobNo=makeJobNo(q);
  const cur=state.mfg[qid]||{};
  if(to==='대기'){ MFG_STEPS.forEach(st=>delete cur[st]); j.step='대기'; }
  else if(to==='제작중'){ MFG_STEPS.forEach(st=>delete cur[st]); cur['절곡']=true; j.step='제작중'; }
  else if(to==='완료'){ MFG_STEPS.forEach(st=>{cur[st]=true;}); delete cur['출고']; j.step='제작중'; }
  else if(to==='시공대기'){ MFG_STEPS.forEach(st=>{cur[st]=true;}); j.step='시공대기'; }
  state.mfg[qid]=cur; state.jobs[qid]=j;
  await saveMfg(); await saveJobs();
  toast('"'+to+'"(으)로 옮겼어요','ok'); render();
}

/* ===== 견적 리비전 묶기 =====
   같은 거래처의 여러 견적을 '한 건의 상담'으로 보고 통계에 1건으로 계산.
   개별 견적은 그대로 남겨 이력을 볼 수 있다. */
function dealKey(q){ return (q.client||'').trim(); }
function dealGroups(){
  const map = new Map();
  state.quotes.forEach(q=>{
    const k = dealKey(q);
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(q);
  });
  return map;
}
/* 그룹의 대표 견적: 계약/시공완료가 있으면 그것, 없으면 가장 최근 */
function dealPrimary(list){
  return list.find(q=>q.status==='시공완료')
      || list.find(q=>q.status==='계약')
      || [...list].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
}
function dealStats(){
  const g = dealGroups();
  let total=0, won=0, lost=0, sales=0;
  g.forEach(list=>{
    total++;
    const p = dealPrimary(list);
    if(p && (p.status==='계약'||p.status==='시공완료')){ won++; sales += linesTotal(p); }
    else if(list.every(q=>q.status==='미성사')) lost++;
  });
  return {total, won, lost, sales, rate: total? Math.round(won/total*100):0};
}
function revisionsOf(q){
  const list = dealGroups().get(dealKey(q)) || [];
  return [...list].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}

  const rows = (ls.length? ls : [{name:q.item||'간판 외', spec:'', qty:1, unit:'', price:q.amount||0}]);

        <td class="c">${esc(l.name)}</td>

        <td class="c">${(l.qty!==''&&l.qty!==undefined&&l.qty!==null)? esc(l.qty):''}</td>

  const emptyCells = `<td class="c">&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td>`;
  const groupBlock = (label, arr, minRows)=>{
    if(!arr.length && label==='선택품목') return '';
    const gsum = arr.reduce((s,l)=>s+lineAmount(l),0);
    const filler = Math.max(0, (minRows||0) - arr.length);
    const span = arr.length + filler || 1;
    let html='';
    const allRows = arr.map(cellsOf).concat(Array(filler).fill(emptyCells));
    allRows.forEach((cells,idx)=>{
      html += `<tr>${idx===0? `<td class="cat" rowspan="${span}">${label}</td>`:''}${cells}</tr>`;

    return html;

  const bodyRows = groupBlock('공통품목', common.length?common:rows, hasOpt?6:8) + (hasOpt? groupBlock('선택품목', optional, 5):'');

function printStatement(qid){

/* ===== 견적서 원버튼 전송: 이미지 생성 → 카톡 공유 → 자동 앨범 저장 ===== */
/* ===== 견적서를 브라우저 기본 캔버스로 직접 그린다 (외부 의존성 0 = 오류 원천 차단) ===== */
function drawQuoteCanvas(q){
  const co=getCompany();
  const ls=qLines(q);
  const rows=(ls.length? ls : [{name:q.item||'간판 외', spec:'', qty:1, unit:'', price:q.amount||0}]);
  const common=rows.filter(l=>l.group!=='선택');
  const opt=rows.filter(l=>l.group==='선택');
  const sum=rows.reduce((s,l)=>s+lineAmount(l),0);
  const csum=common.reduce((s,l)=>s+lineAmount(l),0);
  const osum=opt.reduce((s,l)=>s+lineAmount(l),0);
  const n=v=>(Number(v)||0).toLocaleString('ko-KR');

  const mob=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
  const SC = mob? 0.78 : 1;            // 폰: 해상도만 낮춤(레이아웃 동일) → 메모리 부족(흰 화면) 방지
  const Wc=1240, Hc=1754, M=64;        // 그리기 좌표계는 그대로
  const c=document.createElement('canvas');
  c.width=Math.round(Wc*SC); c.height=Math.round(Hc*SC);
  const x=c.getContext('2d');
  x.scale(SC,SC);
  x.fillStyle='#fff'; x.fillRect(0,0,Wc,Hc);
  x.textBaseline='middle';
  const F='"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  const T=(t,px,py,o)=>{ o=o||{}; x.fillStyle=o.color||'#000';
    x.font=(o.bold?'700 ':'400 ')+(o.size||22)+'px '+F;
    x.textAlign=o.align||'left'; x.fillText(String(t==null?'':t), px, py); };
  const L=(x1,y1,x2,y2,w)=>{ x.strokeStyle='#000'; x.lineWidth=w||1.4; x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke(); };
  const R=(px,py,pw,ph,w)=>{ x.strokeStyle='#000'; x.lineWidth=w||1.4; x.strokeRect(px,py,pw,ph); };
  const FR=(px,py,pw,ph,col)=>{ x.fillStyle=col; x.fillRect(px,py,pw,ph); };
  const fit=(t,max,size)=>{ t=String(t==null?'':t); x.font='400 '+size+'px '+F;
    while(t.length>1 && x.measureText(t).width>max) t=t.slice(0,-1);
    return t; };

  const W=Wc-M*2;
  let y=M;

  /* 제목 밴드 */
  const bandW=W*0.46, bandX=M+(W-bandW)/2, bandH=96;
  FR(bandX,y,bandW,bandH,'#111');
  T('見  積  書', bandX+bandW/2, y+44, {size:46,bold:true,color:'#fff',align:'center'});
  T('E S T I M A T E', bandX+bandW/2, y+76, {size:15,color:'#dcdcdc',align:'center'});
  y+=bandH+22;

  /* 정보 영역 */
  const rowH=52, infoH=rowH*4;
  const leftW=W*0.52-10, rightX=M+leftW+20, rightW=W-leftW-20;
  const d=(q.date||'').split('-');
  const dateStr=d.length===3? `${d[0]}년  ${d[1]}월  ${d[2]}일` : (q.date||'');
  // 왼쪽
  R(M,y,leftW,infoH,1.8);
  const lbW=170;
  L(M+lbW,y,M+lbW,y+infoH);
  const lrow=(i,lab,val,valBold,extra,fsz)=>{
    if(i>0) L(M,y+rowH*i,M+leftW,y+rowH*i);
    T(lab, M+lbW/2, y+rowH*i+rowH/2, {size:19,align:'center'});
    const fs = fsz || (valBold?24:21);
    T(fit(val, leftW-lbW-(extra?90:30), fs), M+lbW+18, y+rowH*i+rowH/2, {size:fs,bold:!!valBold});
    if(extra) T(extra, M+leftW-16, y+rowH*i+rowH/2, {size:19,bold:true,align:'right'});
  };
  lrow(0,'날    짜', dateStr);
  lrow(1,'광고주 / Client', q.client||'', true, '귀하');
  lrow(2,'공사명 / Project', q.item||'', false, '', 17);
  lrow(3,'금  액 / Amount', n(sum)+' 원', true);
  // 오른쪽 (공급자)
  R(rightX,y,rightW,infoH,1.8);
  const supW=44;
  L(rightX+supW,y,rightX+supW,y+infoH);
  x.save(); x.translate(rightX+supW/2, y+infoH/2);
  '공급자'.split('').forEach((ch,i)=>T(ch,0,(i-1)*30,{size:19,align:'center'}));
  x.restore();
  const rlbW=110, rX=rightX+supW;
  const rrW=rightW-supW;
  L(rX+rlbW,y,rX+rlbW,y+infoH);
  const rrow=(i,lab,val,small)=>{
    if(i>0) L(rX,y+rowH*i,rightX+rightW,y+rowH*i);
    T(lab, rX+rlbW/2, y+rowH*i+rowH/2, {size:16,align:'center'});
    T(fit(val, rrW-rlbW-30, small?16:18), rX+rlbW+12, y+rowH*i+rowH/2, {size:small?16:18});
  };
  // 실제 견적서와 동일: 사업자등록번호 / 상호+성명 / 주소 / 업태+종목
  T('사업자', rX+rlbW/2, y+rowH*0+rowH/2-11, {size:15,align:'center'});
  T('등록번호', rX+rlbW/2, y+rowH*0+rowH/2+11, {size:15,align:'center'});
  T(fit(co.bizNo||'', rrW-rlbW-30, 18), rX+rlbW+(rrW-rlbW)/2, y+rowH/2, {size:18,align:'center'});
  // 2행: 상호 | 값 | 성명 | 값
  L(rX,y+rowH,rightX+rightW,y+rowH);
  const nameLbX = rX+rlbW+(rrW-rlbW)*0.60;
  L(nameLbX, y+rowH, nameLbX, y+rowH*2);
  const nameValX = nameLbX+62;
  L(nameValX, y+rowH, nameValX, y+rowH*2);
  T('상호', rX+rlbW/2, y+rowH+rowH/2, {size:16,align:'center'});
  T(fit(co.name||'', nameLbX-(rX+rlbW)-16, 16), (rX+rlbW+nameLbX)/2, y+rowH+rowH/2, {size:16,align:'center'});
  T('성명', (nameLbX+nameValX)/2, y+rowH+rowH/2, {size:16,align:'center'});
  T(fit(co.ceo||'', rightX+rightW-nameValX-14, 16), (nameValX+rightX+rightW)/2, y+rowH+rowH/2, {size:16,align:'center'});
  rrow(2,'주   소', co.addr||'', true);
  // 4행: 업태 | 값 | 종목 | 값
  L(rX,y+rowH*3,rightX+rightW,y+rowH*3);
  const itemLbX = rX+rlbW+(rrW-rlbW)*0.58;
  L(itemLbX, y+rowH*3, itemLbX, y+infoH);
  const itemValX = itemLbX+58;
  L(itemValX, y+rowH*3, itemValX, y+infoH);
  T('업태', rX+rlbW/2, y+rowH*3+rowH/2, {size:16,align:'center'});
  T(fit(co.biztype||'', itemLbX-(rX+rlbW)-12, 13), (rX+rlbW+itemLbX)/2, y+rowH*3+rowH/2, {size:13,align:'center'});
  T('종목', (itemLbX+itemValX)/2, y+rowH*3+rowH/2, {size:16,align:'center'});
  T(fit(co.bizitem||'', rightX+rightW-itemValX-12, 13), (itemValX+rightX+rightW)/2, y+rowH*3+rowH/2, {size:13,align:'center'});
  // 도장
  try{ const si=window.__sealImg; if(si && si.complete && si.naturalWidth) x.drawImage(si, rightX+rightW-64, y+rowH+2, 48,48); }catch(e){}
  y+=infoH+24;

  /* 품목 테이블 */
  const catW=46;
  const cw={name:0.295, spec:0.145, qty:0.07, unit:0.07, price:0.135, amt:0.155, rem:0.13};
  const tw=W-catW;
  const cx={}; let acc=M+catW;
  for(const k of ['name','spec','qty','unit','price','amt','rem']){ cx[k]=[acc, tw*cw[k]]; acc+=tw*cw[k]; }
  const thH=58; let trH=44;
  // 헤더
  R(M,y,W,thH,1.8);
  L(M+catW,y,M+catW,y+thH);
  const heads=[['name','내  역','DESCRIPTION'],['spec','규  격','SIZE'],['qty','수량',"Q'TY"],['unit','단위','UNIT'],['price','단  가','UNIT PRICE'],['amt','금  액','AMOUNT'],['rem','비  고','REMARK']];
  heads.forEach(([k,ko,en],i)=>{
    if(i>0) L(cx[k][0],y,cx[k][0],y+thH);
    T(ko, cx[k][0]+cx[k][1]/2, y+22, {size:19,bold:true,align:'center'});
    T(en, cx[k][0]+cx[k][1]/2, y+44, {size:11,color:'#555',align:'center'});
  });
  y+=thH;

  const padTo=(arr,min)=>{ const out=arr.slice(); while(out.length<min) out.push(null); return out; };
  const hasOpt=opt.length>0;
  const BUDGET=15;                       // 표 데이터 행 총 개수 고정 → 항상 같은 A4 레이아웃
  const baseCommon=common.length? common : rows;
  let cN, oN;
  if(hasOpt){
    cN=Math.max(baseCommon.length, 8);
    oN=Math.max(opt.length, BUDGET-cN>=4? BUDGET-cN : 4);
  }else{ cN=Math.max(baseCommon.length, BUDGET); oN=0; }
  const totalRows=cN+oN;
  if(totalRows>BUDGET) trH=Math.max(26, Math.floor(trH*BUDGET/totalRows));   // 많으면 행 높이 축소
  const commonPad=padTo(baseCommon, cN);
  const optPad=hasOpt? padTo(opt, oN):[];

  const drawGroup=(label, arr, gsum)=>{
    const gh=arr.length*trH;
    // 카테고리 세로 라벨
    FR(M,y,catW,gh+trH,'#e4e4e4'); R(M,y,catW,gh+trH);
    x.save(); x.translate(M+catW/2, y+(gh+trH)/2);
    label.split('').forEach((ch,i)=>T(ch,0,(i-(label.length-1)/2)*26,{size:17,bold:true,align:'center'}));
    x.restore();
    // 데이터 행
    arr.forEach((l)=>{
      R(M+catW,y,tw,trH,1);
      for(const k of ['spec','qty','unit','price','amt','rem']) L(cx[k][0],y,cx[k][0],y+trH,1);
      if(l){
        T(fit(l.name, cx.name[1]-16, 19), cx.name[0]+cx.name[1]/2, y+trH/2, {size:19,align:'center'});
        T(fit(l.spec, cx.spec[1]-12, 18), cx.spec[0]+cx.spec[1]/2, y+trH/2, {size:18,align:'center'});
        T(l.qty??'', cx.qty[0]+cx.qty[1]/2, y+trH/2, {size:18,align:'center'});
        T(l.unit||'', cx.unit[0]+cx.unit[1]/2, y+trH/2, {size:18,align:'center'});
        T(l.price? n(l.price):'', cx.price[0]+cx.price[1]-12, y+trH/2, {size:18,align:'right'});
        T(n(lineAmount(l)), cx.amt[0]+cx.amt[1]-12, y+trH/2, {size:18,align:'right'});
        T(fit(l.remark, cx.rem[1]-12, 16), cx.rem[0]+cx.rem[1]/2, y+trH/2, {size:16,align:'center'});
      }
      y+=trH;
    });
    // 소계
    FR(M+catW,y,tw,trH,'#f0f0f0'); R(M+catW,y,tw,trH,1.4);
    L(cx.amt[0],y,cx.amt[0],y+trH,1);
    T('소  계', cx.price[0]+cx.price[1]-12, y+trH/2, {size:19,bold:true,align:'right'});
    T(n(gsum), cx.amt[0]+cx.amt[1]-12, y+trH/2, {size:19,bold:true,align:'right'});
    y+=trH;
  };
  drawGroup('공통품목', commonPad, hasOpt? csum : sum);
  if(hasOpt) drawGroup('선택품목', optPad, osum);

  /* 합계 */
  const totH=54;
  FR(M,y,W,totH,'#fff'); R(M,y,W,totH,1.8);
  T('합  계', cx.price[0]+cx.price[1]-12, y+totH/2, {size:22,bold:true,align:'right'});
  T(n(sum), cx.amt[0]+cx.amt[1]-12, y+totH/2, {size:22,bold:true,align:'right'});
  T('＊부가세별도', cx.rem[0]+cx.rem[1]/2, y+totH/2, {size:15,align:'center'});
  y+=totH;

  /* 하단 안내 (항상 같은 위치) */
  const noteY = Math.max(y+34, Hc-M-150);
  if(co.bank) T('＊  '+co.bank, M+10, noteY, {size:19,bold:true});
  T('＊  본 견적서의 유효기간은 발행일로부터 30일입니다.', M+10, noteY+38, {size:17});
  T('＊  위와 같이 견적합니다.', M+10, noteY+72, {size:17});

  /* 전체 외곽선 — 항상 A4 전면 고정 */
  R(M-14, M-14, W+28, Hc-(M-14)*2, 2.2);

  return c;   // 캔버스 자체 반환 (동기)
}

async function quoteImageBlob(qid){
  const q=state.quotes.find(x=>x.id===qid); if(!q) return null;
  // 1순위: 순수 캔버스 드로잉 (외부 의존성 0 — 어떤 환경에서도 동작)

/* 원버튼: 만들기→앨범저장→사진 화면표시(길게 눌러 저장) + 공유 버튼 */
/* ===== 이미지 저장 엔진 (blob 미사용 · data URL 기반 · 다중 우회) ===== */
function dataUrlToBlob(dataUrl){
  const parts=String(dataUrl).split(',');
  const mime=(/:(.*?);/.exec(parts[0])||[])[1]||'image/jpeg';
  const bin=atob(parts[1]);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
/* 여러 방법을 순서대로 시도해 무조건 저장되게 한다 */
async function saveImageSmart(dataUrl, fname, title){
  const ia=inAppInfo();
  if(ia.inApp){    // 카톡 등 인앱 브라우저는 저장 자체가 막혀 있다 → 정직하게 안내
    return 'inapp';
  }
  // ① 폰 공유창 (갤러리 저장·카톡 전송) — 사용자 탭 직후에 가장 잘 동작
  try{
    const blob=dataUrlToBlob(dataUrl);
    const file=new File([blob], fname, {type:blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      await navigator.share({files:[file], title:title||fname});
      return 'shared';
    }
  }catch(e){ if(e && e.name==='AbortError') return 'abort'; }
  // ② data URL 직접 다운로드 (blob 차단 환경에서도 통과)
  try{
    const a=document.createElement('a');
    a.href=dataUrl; a.download=fname; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
    return 'downloaded';
  }catch(e){}
  // ③ blob URL 다운로드 (일반 브라우저 예비)
  try{
    const blob=dataUrlToBlob(dataUrl);
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>{ try{URL.revokeObjectURL(url);}catch(_){} }, 8000);
    return 'downloaded';
  }catch(e){}
  // ④ 새 창에 이미지 띄우기 (길게 눌러 저장)
  try{ const w=window.open(); if(w){ w.document.write('<title>'+fname+'</title><img src="'+dataUrl+'" style="width:100%">'); w.document.close(); return 'tab'; } }catch(e){}
  return 'manual';
}
/* 견적서 사진 화면: 캔버스 + data 이미지 동시 표시 (둘 중 하나는 반드시 보임) */

  ov.innerHTML=`

      <div class="isTitle">${esc(title||'')}</div>
      <button class="isBtn primary" id="isSave">💾 저장</button>

    </div>
    <div class="isBody">
      <div class="isHint" id="isHint">💡 <b>저장</b>을 누르거나, 사진을 <b>길게 눌러</b> 저장하세요</div>
      <div id="isInApp" style="display:none;background:#7A2E12;color:#fff;border-radius:10px;padding:12px 14px;margin:0 0 12px;text-align:left;font-size:13px;line-height:1.65">

        <button id="isOpenBrowser" style="display:block;width:100%;margin-top:10px;padding:12px;border:none;border-radius:8px;background:#F0A020;color:#1F2A44;font-size:15px;font-weight:700;font-family:inherit">🌐 크롬에서 열기</button>
      </div>
      <div id="isImgWrap"></div>
    </div>`;
  document.body.appendChild(ov);
  const wrap=ov.querySelector('#isImgWrap');
  // 1) data URL 이미지 (길게 눌러 저장 가능)
  const img=document.createElement('img');
  img.alt=title||'견적서'; img.id='isImg';
  img.onerror=()=>{ // 이미지가 막히면 캔버스를 직접 붙여 화면엔 무조건 보이게
    try{
      img.remove();
      canvas.style.cssText='max-width:100%;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.4);';

    }catch(e){}

  ov.querySelector('#isClose').addEventListener('click', ()=> ov.remove());
  const ia=inAppInfo();
  if(ia.inApp){
    const box=ov.querySelector('#isInApp'); if(box) box.style.display='block';
    const hint=ov.querySelector('#isHint'); if(hint) hint.style.display='none';
    const ob=ov.querySelector('#isOpenBrowser'); if(ob) ob.addEventListener('click', openInRealBrowser);
  }
  ov.querySelector('#isSave').addEventListener('click', async ()=>{
    const r=await saveImageSmart(dataUrl, fname, title);
    if(r==='shared') toast('저장·공유했어요','ok');
    else if(r==='downloaded') toast('저장했어요 · 파일/다운로드 폴더 확인','ok');
    else if(r==='tab') toast('새 창의 사진을 길게 눌러 저장하세요','ok');
    else if(r==='inapp'){ toast('카톡 브라우저는 저장이 막혀요 · 크롬에서 열어주세요','warn'); openInRealBrowser(); }
    else if(r==='abort') return;
    else toast('사진을 길게 눌러 저장해 주세요','warn');
  });
  return ov;
}

function quoteToText(q){
  const c = getCompany();
  const ls = qLines(q);
  const sum = linesTotal(q), vat = Math.round(sum*0.1);
  let t = `[견적서] ${c.name}\n`;
  t += `${q.date||''} / ${q.client||''}\n`;
  if(q.item) t += `공사명: ${q.item}\n`;
  t += `------------------------\n`;
  if(ls.length){
    ls.forEach(l=>{ t += `· ${l.name||''}${l.spec? ' ('+l.spec+')':''} ${l.qty||1}개 = ${lineAmount(l).toLocaleString('ko-KR')}원\n`; });
  }else{
    t += `· ${q.item||'간판 외'} = ${(q.amount||0).toLocaleString('ko-KR')}원\n`;
  }
  t += `------------------------\n`;
  t += `공급가액 ${sum.toLocaleString('ko-KR')}원\n부가세 ${vat.toLocaleString('ko-KR')}원\n`;
  t += `합계 ${(sum+vat).toLocaleString('ko-KR')}원\n\n`;
  t += `입금계좌: ${c.bank}\n※ 견적 유효기간 30일`;
  return t;
}

async function copyQuoteText(qid){
  const q = state.quotes.find(x=>x.id===qid);
  if(!q) return;
  const text = quoteToText(q);
  try{
    await navigator.clipboard.writeText(text);
    alert('견적 내용을 복사했어요.\n카톡에 붙여넣기 하세요.');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); alert('견적 내용을 복사했어요.\n카톡에 붙여넣기 하세요.'); }
    catch(e2){ prompt('아래 내용을 길게 눌러 복사하세요', text); }
    ta.remove();
  }
}

/* ===== 인앱 브라우저(카톡·인스타 등) 감지 및 탈출 =====
   카톡 인앱 브라우저는 파일 저장·공유·길게눌러저장을 모두 막는다.
   → 사용자가 한 번에 크롬/삼성인터넷으로 옮겨갈 수 있게 안내한다. */
function inAppInfo(){
  const ua=navigator.userAgent||'';
  const kakao=/KAKAOTALK/i.test(ua);
  const other=/(Instagram|FB_IAB|FBAN|FBAV|Line\/|NAVER|DaumApps|everytimeApp|kakaostory)/i.test(ua);
  const android=/Android/i.test(ua);
  const ios=/iPhone|iPad|iPod/i.test(ua);
  return { inApp: kakao||other, kakao, android, ios, name: kakao? '카카오톡' : (other? '인앱' : '') };
}
function openInRealBrowser(){
  const info=inAppInfo();
  const url=location.href;
  if(info.android){
    // 카톡: 외부 브라우저 강제 실행 파라미터
    if(info.kakao){ try{ location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(url); return; }catch(e){} }
    try{
      const clean=url.replace(/^https?:\/\//,'');
      location.href='intent://'+clean+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(url)+';end';
      return;
    }catch(e){}
  }
  if(info.ios){
    try{ navigator.clipboard.writeText(url); }catch(e){}
    alert('아이폰은 아래 순서로 열어주세요\n\n1) 화면 오른쪽 아래 ⋯(더보기) 누르기\n2) "Safari로 열기" 선택\n\n주소는 복사해 두었습니다.');
    return;
  }
  try{ window.open(url,'_blank'); }catch(e){}
}

function needsLines(q){
  const ls = Array.isArray(q.lines)? q.lines : [];
  if(ls.length===0) return true;
  // 내용 전체가 한 줄로 들어간 경우도 교체 대상
  if(ls.length===1){
    const l=ls[0];
    if(!l.spec && (!l.unit || l.unit==='') && Math.round((l.qty||0)*(l.price||0))===(q.amount||0)) return true;
  }
  return false;
}
async function migrateQuoteLines(){
  try{
    let changed=0;
    (state.quotes||[]).forEach(q=>{
      if(!needsLines(q)) return;
      const key=(q.date||'')+'|'+(q.client||'')+'|'+(q.amount||0);
      const found=QLINES[key];
      if(found){ q.lines=JSON.parse(JSON.stringify(found)); changed++; }
    });
    if(changed){
      await saveQuotes();
      toast(changed+'건의 견적에 품목 내역을 채웠어요','ok');
      render();
    }
    return changed;
  }catch(e){ console.warn('migrate', e&&e.message); return 0; }
}

    if(s && s.expires_at && s.expires_at*1000 > Date.now()+60000) return s;

  }catch(e){ return null; }
}
function cmsSaveSession(s){
  cmsSession = s;
  try{ s ? localStorage.setItem(CMS_TOKEN_KEY, JSON.stringify(s)) : localStorage.removeItem(CMS_TOKEN_KEY); }catch(e){}
}
function cmsExpired(){
  return !cmsSession || !cmsSession.expires_at || cmsSession.expires_at*1000 <= Date.now()+30000;
}

/* ---------- Supabase Auth ----------
   무료 플랜은 메일 템플릿을 수정할 수 없어 기본 "매직 링크"만 발송된다.
   따라서 링크가 ERP 주소로 돌아오게 하고(redirect_to), 돌아온 URL에서 토큰을 읽어 로그인한다.
   나중에 커스텀 SMTP를 붙여 6자리 코드를 보내게 되면 아래 cmsVerifyCode 가 그대로 쓰인다. */
function cmsRedirectUrl(){
  // 해시·쿼리를 제거한 현재 페이지 주소 (file:// 로 열었을 땐 운영 주소로 대체)
  const u = location.origin + location.pathname;
  return /^https?:/.test(u) ? u : 'https://hm-sign-erp.dmswl1701.workers.dev/';
}
async function cmsSendCode(email){
  const r = await fetch(sbUrl()+'/auth/v1/otp?redirect_to='+encodeURIComponent(cmsRedirectUrl()), {
    method:'POST',
    headers:{'apikey':sbKey(),'content-type':'application/json'},
    body: JSON.stringify({email, create_user:true})
  });
  if(!r.ok){
    const t = await r.text();
    if(/rate.?limit/i.test(t)){
      throw new Error('메일 발송 한도를 초과했습니다. 무료 플랜은 시간당 발송 수가 제한됩니다. '
        + '잠시 후 다시 시도하시거나, 아래 비밀번호 로그인을 사용해 주세요.');
    }
    throw new Error(t.slice(0,160));
  }
  return true;
}
/* 비밀번호 로그인 — 메일 발송이 필요 없어 매일 쓰기에 적합하다.
   비밀번호는 Supabase 대시보드에서 관리자가 직접 설정한다. */
async function cmsLoginPassword(email, password){
  const r = await fetch(sbUrl()+'/auth/v1/token?grant_type=password', {
    method:'POST',
    headers:{'apikey':sbKey(),'content-type':'application/json'},
    body: JSON.stringify({email, password})
  });
  const j = await r.json().catch(()=>({}));
  if(!r.ok || !j.access_token){
    const m = j.error_description || j.msg || j.error || '로그인 실패';
    if(/invalid.*credential|grant/i.test(m)){
      throw new Error('이메일 또는 비밀번호가 맞지 않습니다. Supabase 대시보드에서 비밀번호를 설정하셨는지 확인해 주세요.');
    }
    if(/email.*not.*confirm/i.test(m)){
      throw new Error('이메일 인증이 완료되지 않은 계정입니다. Supabase 대시보드에서 해당 사용자를 Confirm 처리해 주세요.');
    }
    throw new Error(m);
  }
  cmsSaveSession({
    access_token:j.access_token, refresh_token:j.refresh_token,
    expires_at:j.expires_at, email:(j.user&&j.user.email)||email
  });
  return true;
}
/* 메일 링크를 눌러 ERP로 돌아왔을 때 URL에서 세션을 회수한다.
   Supabase 는 상황에 따라 두 가지 형태로 돌려보낸다.
     ① #access_token=...&refresh_token=...   (implicit)
     ② ?token_hash=...&type=magiclink        (PKCE)  */
async function cmsCaptureAuthFromUrl(){
  try{
    const hash = new URLSearchParams((location.hash||'').replace(/^#/,''));
    const qs   = new URLSearchParams(location.search||'');
    const clean = ()=>{ try{ history.replaceState(null,'',location.origin+location.pathname); }catch(e){} };

    // 오류가 실려 돌아온 경우 (만료된 링크 등)
    const err = hash.get('error_description') || qs.get('error_description');
    if(err){
      state.cmsErr = '메일 링크 오류: ' + decodeURIComponent(err).replace(/\+/g,' ')
        + ' — 링크는 한 번만, 그리고 짧은 시간 안에 사용해야 합니다. 다시 요청해 주세요.';
      state.view='website'; clean(); return true;
    }
    // ① implicit
    const at = hash.get('access_token');
    if(at){
      cmsSaveSession({
        access_token: at,
        refresh_token: hash.get('refresh_token')||'',
        expires_at: Math.floor(Date.now()/1000) + (parseInt(hash.get('expires_in'))||3600),
        email: state.cmsEmail||''
      });
      // 이메일 확인
      try{
        const u = await fetch(sbUrl()+'/auth/v1/user',{headers:{apikey:sbKey(),authorization:'Bearer '+at}});
        if(u.ok){ const j=await u.json(); if(j.email){ cmsSession.email=j.email; cmsSaveSession(cmsSession); } }
      }catch(e){}
      state.view='website'; state.cmsErr=null; state.cmsCodeSent=false; cmsData=null;
      clean(); toast('로그인했어요','ok'); return true;
    }
    // ② PKCE (token_hash)
    const th = qs.get('token_hash') || hash.get('token_hash');
    if(th){
      const type = qs.get('type') || hash.get('type') || 'magiclink';
      const r = await fetch(sbUrl()+'/auth/v1/verify',{
        method:'POST', headers:{apikey:sbKey(),'content-type':'application/json'},
        body: JSON.stringify({token_hash:th, type})
      });
      const j = await r.json();
      if(r.ok && j.access_token){
        cmsSaveSession({access_token:j.access_token, refresh_token:j.refresh_token,
          expires_at:j.expires_at, email:(j.user&&j.user.email)||state.cmsEmail||''});
        state.view='website'; state.cmsErr=null; state.cmsCodeSent=false; cmsData=null;
        clean(); toast('로그인했어요','ok'); return true;
      }
      state.cmsErr = '링크 인증 실패: ' + (j.error_description||j.msg||j.error||'알 수 없는 오류');
      state.view='website'; clean(); return true;
    }
  }catch(e){ /* URL 파싱 실패는 무시 */ }
  return false;
}
async function cmsVerifyCode(email, token){
  const r = await fetch(sbUrl()+'/auth/v1/verify', {
    method:'POST',
    headers:{'apikey':sbKey(),'content-type':'application/json'},
    body: JSON.stringify({email, token, type:'email'})
  });
  const j = await r.json();
  if(!r.ok || !j.access_token) throw new Error((j.error_description||j.msg||j.error||'인증 실패'));
  cmsSaveSession({
    access_token:j.access_token, refresh_token:j.refresh_token,
    expires_at:j.expires_at, email:(j.user&&j.user.email)||email
  });
  return true;
}
async function cmsRefresh(){
  if(!cmsSession || !cmsSession.refresh_token) return false;
  try{
    const r = await fetch(sbUrl()+'/auth/v1/token?grant_type=refresh_token', {
      method:'POST',
      headers:{'apikey':sbKey(),'content-type':'application/json'},
      body: JSON.stringify({refresh_token:cmsSession.refresh_token})
    });
    const j = await r.json();
    if(!r.ok || !j.access_token) return false;
    cmsSaveSession({
      access_token:j.access_token, refresh_token:j.refresh_token,
      expires_at:j.expires_at, email:(j.user&&j.user.email)||cmsSession.email
    });
    return true;
  }catch(e){ return false; }
}
function cmsLogout(){
  cmsSaveSession(null); cmsData=null; cmsInquiries=null;
  toast('로그아웃했어요','ok'); render();
}

/* ---------- CMS API 호출 ---------- */
async function cmsFetch(path, opts){
  opts = opts || {};
  if(cmsExpired()) await cmsRefresh();
  if(!cmsSession) throw new Error('로그인이 필요합니다');
  const headers = Object.assign({
    'authorization':'Bearer '+cmsSession.access_token,
    'accept':'application/json'
  }, opts.headers||{});
  if(opts.body && !headers['content-type']) headers['content-type']='application/json';
  const r = await fetch(CMS_API+path, {method:opts.method||'GET', headers, body:opts.body});
  if(r.status===401){
    const ok = await cmsRefresh();
    if(ok) return cmsFetch(path, opts);
    throw new Error('관리자 권한이 없거나 세션이 만료되었습니다');
  }
  if(!r.ok) throw new Error('요청 실패 ('+r.status+')');
  const t = await r.text();
  try{ return t ? JSON.parse(t) : {}; }catch(e){ return {}; }
}
/* ---------- 관리자 API 자동 탐색 ----------
   Worker 의 실제 라우트를 모르는 상태이므로, 로그인된 토큰으로 후보 경로에 GET 을 보내
   200 이 오는 경로를 찾아 기억한다. (GET 만 사용 — 데이터를 바꾸지 않는다) */
const CMS_SITE_PATHS = [
  '/api/v1/admin/site','/api/v1/admin/site-content','/api/v1/admin/content',
  '/api/v1/admin/settings','/api/v1/admin/config','/api/v1/admin',
  '/api/admin/site','/admin/api/site','/api/v1/site'
];
const CMS_INQ_PATHS = [
  '/api/v1/admin/inquiries','/api/v1/admin/inquiry','/api/v1/admin/contacts',
  '/api/v1/admin/leads','/api/admin/inquiries','/api/v1/inquiries'
];
function cmsPathCache(){
  try{ return JSON.parse(localStorage.getItem('hmCmsPaths')||'{}'); }catch(e){ return {}; }
}
function cmsSavePath(kind, path){
  const c = cmsPathCache(); c[kind]=path;
  try{ localStorage.setItem('hmCmsPaths', JSON.stringify(c)); }catch(e){}
}
async function cmsProbe(paths){
  const results = [];
  for(const p of paths){
    try{
      const r = await cmsFetchRaw(p);
      results.push({path:p, status:r.status});
      if(r.status===200) return {found:p, results};
    }catch(e){ results.push({path:p, status:'ERR'}); }
  }
  return {found:null, results};
}
/* 상태코드까지 보기 위한 저수준 호출 (토큰 갱신은 동일하게 처리) */
async function cmsFetchRaw(path, opts){
  opts = opts || {};
  if(cmsExpired()) await cmsRefresh();
  if(!cmsSession) throw new Error('로그인이 필요합니다');
  const headers = Object.assign({
    'authorization':'Bearer '+cmsSession.access_token, 'accept':'application/json'
  }, opts.headers||{});
  if(opts.body && !headers['content-type']) headers['content-type']='application/json';
  return fetch(CMS_API+path, {method:opts.method||'GET', headers, body:opts.body});
}
/* 진단 실행 — 결과를 화면에 표로 보여준다 */
async function cmsDiagnose(){
  state.cmsDiag = {running:true, site:null, inq:null};
  render();
  const s = await cmsProbe(CMS_SITE_PATHS);
  const i = await cmsProbe(CMS_INQ_PATHS);
  if(s.found) cmsSavePath('site', s.found);
  if(i.found) cmsSavePath('inq', i.found);
  state.cmsDiag = {running:false, site:s, inq:i};
  render();
}
async function cmsLoadAll(){
  state.cmsLoading = true; render();
  try{
    // 관리자 경로를 자동 탐색해 사용 (한 번 찾으면 기억)
    const cache = cmsPathCache();
    let site = null;
    const sitePaths = cache.site ? [cache.site].concat(CMS_SITE_PATHS.filter(p=>p!==cache.site)) : CMS_SITE_PATHS;
    for(const p of sitePaths){
      try{
        const r = await cmsFetchRaw(p);
        if(r.status===200){ site = await r.json(); cmsSavePath('site', p); break; }
      }catch(e){ /* 다음 후보 */ }
    }
    // 관리자 경로를 못 찾으면 공개 API 내용으로라도 화면을 채운다 (읽기 전용)
    if(!site){
      const r = await fetch(CMS_API+'/api/v1/public/site',{headers:{accept:'application/json'}});
      site = r.ok ? await r.json() : null;
      state.cmsReadOnly = true;
    } else {
      state.cmsReadOnly = false;
    }
    if(!site) throw new Error('홈페이지 내용을 불러오지 못했습니다.');
    cmsData = site;

    cmsInquiries = null;
    const inqPaths = cache.inq ? [cache.inq].concat(CMS_INQ_PATHS.filter(p=>p!==cache.inq)) : CMS_INQ_PATHS;
    for(const p of inqPaths){
      try{
        const r = await cmsFetchRaw(p);
        if(r.status===200){ cmsInquiries = await r.json(); cmsSavePath('inq', p); break; }
      }catch(e){ /* 다음 후보 */ }
    }
    state.cmsErr = null;
  }catch(e){
    state.cmsErr = e.message;
  }finally{
    state.cmsLoading = false; render();
  }
}
async function cmsSaveSite(){
  if(!cmsData) return;
  const btn = document.getElementById('cmsSaveBtn');
  if(btn){ btn.disabled=true; btn.textContent='저장 중...'; }
  const body = JSON.stringify(cmsData);
  const cache = cmsPathCache();
  // 읽기에 성공했던 경로를 우선 시도하고, 메서드는 PUT → POST → PATCH 순서로 확인한다.
  const paths = cache.site ? [cache.site].concat(CMS_SITE_PATHS.filter(p=>p!==cache.site)) : CMS_SITE_PATHS;
  const tried = [];
  let ok = false, lastStatus = null;
  try{
    outer:
    for(const p of paths){
      for(const m of ['PUT','POST','PATCH']){
        let r;
        try{ r = await cmsFetchRaw(p, {method:m, body}); }
        catch(e){ tried.push(m+' '+p+' → 통신오류'); continue; }
        lastStatus = r.status;
        if(r.status>=200 && r.status<300){
          cmsSavePath('site', p);
          try{ localStorage.setItem('hmCmsSaveMethod', m); }catch(e){}
          ok = true; break outer;
        }
        tried.push(m+' '+p+' → '+r.status);
        // 405(메서드 불가)면 다음 메서드, 404면 다음 경로로
        if(r.status===404) break;
      }
    }
    if(ok){
      toast('홈페이지에 반영했어요','ok');
      logActivity('홈페이지 콘텐츠 수정 (CMS)', '변경');
      state.cmsErr = null;
      state.cmsSaveTried = null;
    }else{
      state.cmsErr = '저장 경로를 찾지 못했습니다 (마지막 응답 '+lastStatus+'). '
        + 'Worker 의 관리자 저장 엔드포인트가 다른 주소일 수 있습니다.';
      state.cmsSaveTried = tried;
      toast('저장 실패 — 아래 진단 결과를 확인해 주세요','warn');
    }
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='💾 홈페이지에 반영'; }
    render();
  }
}

async function cmsInquiryToClient(idx){
  const list = cmsInquiryList(); if(!list) return;
  const q = list[idx]; if(!q) return;
  const name = (q.company||'').trim() || (q.name||'').trim();
  if(!name){ toast('회사명·성함이 없어 등록할 수 없어요','warn'); return; }
  if((state.clients||[]).some(c=>c.name===name)){ toast('이미 등록된 거래처예요','warn'); return; }

  const chain = (typeof deriveChain==='function') ? deriveChain(name) : '';
  state.clients.push({
    id:'c_'+Date.now(), name, chain,
    branch:(typeof branchName==='function')? branchName(name, chain) : '',
    contact:(q.name||'').trim(), phone:'', mobile:(q.phone||'').trim(),
    address:(q.location||'').trim(),
    zonecode:'', sido:'', sigungu:'', dong:'', lat:null, lng:null,
    email:'', terms:'', discount:0,
    memo:'홈페이지 문의 접수'
      + ((q.serviceType||q.service)? ' · 요청: '+(q.serviceType||q.service) : '')
      + ((q.preferredDate||q.date)? ' · 희망일: '+(q.preferredDate||q.date) : '')
      + (q.message? '\n'+q.message : '')
  });
  await saveClients();
  logActivity('홈페이지 문의 → 거래처 등록: '+name, '추가');
  toast(name+' 거래처로 등록했어요','ok');
  render();
}

/* ---------- 값 읽기/쓰기 도우미 ---------- */
function cmsGet(path, dflt){
  const parts = path.split('.');
  let v = cmsData;
  for(const p of parts){ if(v==null) return dflt; v = v[p]; }
  return (v==null || v==='') ? (dflt===undefined?'':dflt) : v;
}
function cmsSet(path, val){
  const parts = path.split('.');
  let o = cmsData;
  for(let i=0;i<parts.length-1;i++){
    if(!o[parts[i]] || typeof o[parts[i]]!=='object') o[parts[i]]={};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = val;
}

          </div>
          <div style="display:flex;gap:8px;margin-top:12px">
            <button type="button" class="btn secondary" id="cmsResend">메일 다시 보내기</button>
          </div>
          <div class="field" style="margin-top:12px">
            <label>숫자 인증번호를 받으셨다면</label>
            <input type="text" id="cmsCode" placeholder="000000" inputmode="numeric" maxlength="8">
          </div>
          <button type="button" class="btn secondary" id="cmsVerifyBtn">인증하고 로그인</button>` : `
          <div class="aic-sub" style="margin:10px 0 12px;font-size:12.5px">무료 플랜은 시간당 메일 발송 수가 제한됩니다. 평소에는 비밀번호 로그인을 권장합니다.</div>
          <button type="button" class="btn secondary" id="cmsSendBtn">로그인 링크 받기</button>`}
        </details>
        ${state.cmsErr? `<div class="aic-dm-warn" style="margin-top:14px">${esc(state.cmsErr)}</div>`:''}
      </div>`;
  }

  // 2) 로그인 후 — 데이터 로딩
  if(!cmsData && !state.cmsLoading && !state.cmsErr){ setTimeout(cmsLoadAll, 10); }
  if(state.cmsLoading){
    return `<div class="topbar"><h1>🌐 홈페이지 관리</h1></div>

           </div>`
        : list.length===0
          ? '<div class="empty">접수된 문의가 없어요.</div>'
          : `<table><thead><tr><th>접수</th><th>성함</th><th>연락처</th><th>회사·매장</th><th>요청</th><th>내용</th><th></th></tr></thead><tbody>

               <td data-l=""><button type="button" class="aic-btn ${exists?'':'aic-btn-primary'} cmsInqAdd" data-i="${i}" ${exists?'disabled':''}>${exists?'등록됨':'거래처 등록'}</button></td>

      ${(state.cmsSaveTried&&state.cmsSaveTried.length)? `<pre class="aic-doc-body" style="margin-top:10px;max-height:180px">${esc(state.cmsSaveTried.join('\n'))}</pre>`:''}
    </div>`:''}
    ${(()=>{ const d=state.cmsDiag; if(!d) return '';
      if(d.running) return `<div class="panel"><div class="empty">관리자 API 경로를 찾는 중이에요...</div></div>`;
      const row=(label,res)=>`
        <div style="margin-bottom:12px">
          <div style="font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px">${label}
            ${res.found? `<span class="aic-badge done">찾음: ${esc(res.found)}</span>` : `<span class="aic-badge rej">못 찾음</span>`}</div>

        ${row('문의함', d.inq)}
        <div class="aic-dm-ok" style="font-size:12px">모두 404 라면 Worker 의 관리자 라우트 주소가 위 후보와 다릅니다.

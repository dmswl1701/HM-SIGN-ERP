    </div>
    ${body}`;
}

/* ---------- 이벤트 바인딩 ---------- */
function bindWebsiteAdmin(){
  // 비밀번호 로그인 (기본)
  const pwBtn=document.getElementById('cmsPwLogin');
  const doPwLogin = async ()=>{
    const el=document.getElementById('cmsEmail'), pe=document.getElementById('cmsPw');
    const email=(el?el.value:'').trim(), pw=(pe?pe.value:'');
    if(!email){ toast('이메일을 입력해 주세요','warn'); if(el) el.focus(); return; }
    if(!pw){ toast('비밀번호를 입력해 주세요','warn'); if(pe) pe.focus(); return; }
    state.cmsEmail=email; state.cmsErr=null;
    if(pwBtn){ pwBtn.disabled=true; pwBtn.textContent='로그인 중...'; }
    try{
      await cmsLoginPassword(email, pw);
      state.cmsCodeSent=false; state.cmsErr=null; cmsData=null;
      toast('로그인했어요','ok');
    }catch(e){ state.cmsErr=e.message; }
    render();
  };
  if(pwBtn) pwBtn.addEventListener('click', doPwLogin);
  const pwIn=document.getElementById('cmsPw');
  if(pwIn) pwIn.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doPwLogin(); } });

  // 메일 링크 로그인 (보조)
  const sendBtn=document.getElementById('cmsSendBtn'), resend=document.getElementById('cmsResend');
  const doSend = async ()=>{
    const el=document.getElementById('cmsEmail');
    const email=(el?el.value:'').trim();
    if(!email){ toast('이메일을 입력해 주세요','warn'); if(el) el.focus(); return; }
    state.cmsEmail=email; state.cmsErr=null;
    const b=sendBtn||resend; if(b){ b.disabled=true; b.textContent='보내는 중...'; }
    try{
      await cmsSendCode(email);
      state.cmsCodeSent=true;
      toast(email+' 로 인증번호를 보냈어요','ok');
    }catch(e){ state.cmsErr=e.message; }
    render();
  };
  if(sendBtn) sendBtn.addEventListener('click', doSend);
  if(resend) resend.addEventListener('click', doSend);

  const vBtn=document.getElementById('cmsVerifyBtn');
  if(vBtn) vBtn.addEventListener('click', async ()=>{
    const code=(document.getElementById('cmsCode')||{}).value||'';
    if(!code.trim()){ toast('인증번호를 입력해 주세요','warn'); return; }
    vBtn.disabled=true; vBtn.textContent='확인 중...';
    try{
      await cmsVerifyCode(state.cmsEmail, code.trim());
      state.cmsCodeSent=false; state.cmsErr=null; cmsData=null;
      toast('로그인했어요','ok');
    }catch(e){ state.cmsErr='인증 실패: '+e.message; }
    render();
  });

  const lo=document.getElementById('cmsLogout');
  if(lo) lo.addEventListener('click', e=>{ e.preventDefault(); cmsLogout(); });
  const rt=document.getElementById('cmsRetry');
  if(rt) rt.addEventListener('click', ()=>{ state.cmsErr=null; cmsData=null; cmsLoadAll(); });
  const dg=document.getElementById('cmsDiagBtn');
  if(dg) dg.addEventListener('click', e=>{ e.preventDefault(); cmsDiagnose(); });

  // 탭
  document.querySelectorAll('.cmsTab').forEach(el=> el.addEventListener('click', ()=>{ state.cmsTab=el.dataset.t; render(); }));

  // 단순 필드 (blur 시 반영 — 입력 중 리렌더 방지)
  document.querySelectorAll('.cmsIn').forEach(el=> el.addEventListener('change', ()=>{ cmsSet(el.dataset.p, el.value); }));

  // 서비스
  document.querySelectorAll('.cmsSvcName').forEach(el=> el.addEventListener('change', ()=>{ cmsData.services[+el.dataset.i].name = el.value; }));
  document.querySelectorAll('.cmsSvcText').forEach(el=> el.addEventListener('change', ()=>{ cmsData.services[+el.dataset.i].text = el.value; }));
  document.querySelectorAll('.cmsSvcDel').forEach(el=> el.addEventListener('click', ()=>{ cmsData.services.splice(+el.dataset.i,1); render(); }));
  const sa=document.getElementById('cmsSvcAdd');
  if(sa) sa.addEventListener('click', ()=>{ cmsData.services=cmsData.services||[]; cmsData.services.push({name:'',text:''}); render(); });

  // 프로세스
  document.querySelectorAll('.cmsPrc').forEach(el=> el.addEventListener('change', ()=>{ cmsData.process[+el.dataset.i] = el.value; }));
  document.querySelectorAll('.cmsPrcDel').forEach(el=> el.addEventListener('click', ()=>{ cmsData.process.splice(+el.dataset.i,1); render(); }));
  const pa=document.getElementById('cmsPrcAdd');
  if(pa) pa.addEventListener('click', ()=>{ cmsData.process=cmsData.process||[]; cmsData.process.push(''); render(); });

  // 포트폴리오
  document.querySelectorAll('.cmsPj').forEach(el=> el.addEventListener('change', ()=>{
    cmsData.featuredProjects[+el.dataset.i][el.dataset.f] = el.value;
  }));
  document.querySelectorAll('.cmsPjDel').forEach(el=> el.addEventListener('click', ()=>{
    if(!confirm('이 시공사례를 삭제할까요?')) return;
    cmsData.featuredProjects.splice(+el.dataset.i,1); render();
  }));
  const ja=document.getElementById('cmsPjAdd');
  if(ja) ja.addEventListener('click', ()=>{

function aicErpContext(){
  const qs = state.quotes||[], cs = state.clients||[];
  const contracted = qs.filter(q=>q.status==='계약'||q.status==='시공완료');
  const done = qs.filter(q=>q.status==='시공완료');
  const unpaid = contracted.map(q=>({q, bal: quoteTotal(q)-paidTotal(getPayment(q.id))})).filter(x=>x.bal>0);
  const chains = {};
  cs.forEach(c=>{ const k=c.chain||'기타'; chains[k]=(chains[k]||0)+1; });
  return {qs, cs, contracted, done, unpaid, chains};
}
function aicRecentSites(n){
  const c = aicErpContext();
  return c.done.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,n||8);
}

  const L=[];

  L.push('');
  L.push('[견적 현황]');
  L.push('- 전체 견적 '+c.qs.length+'건 / 계약 '+c.contracted.length+'건 / 시공완료 '+c.done.length+'건');

  L.push('- 발송 후 미회신 견적: '+pendingQ.length+'건'+(pendingQ.length? ' ('+pendingQ.slice(0,5).map(q=>q.client+' '+q.date).join(', ')+')':''));

  if(c.unpaid.length){
    const tot = c.unpaid.reduce((s,x)=>s+x.bal,0);
    L.push('- 총 미수 '+fmt(tot)+' / '+c.unpaid.length+'건');
    c.unpaid.slice(0,8).forEach(x=> L.push('  · '+x.q.client+' : '+fmt(x.bal)+' (견적일 '+x.q.date+')'));
  } else L.push('- 미수금 없음');
  L.push('');
  L.push('[오늘 일정]');
  const todayEv = (state.events||[]).filter(e=>e.startDate===today && !e.done);
  const todayInst = c.contracted.filter(q=>getJob(q.id).installDate===today);
  if(todayEv.length||todayInst.length){
    todayInst.forEach(q=> L.push('  · [설치] '+q.client+' '+(q.region||'')));
    todayEv.forEach(e=> L.push('  · ['+(e.cat||'일정')+'] '+(e.title||'')));
  } else L.push('- 등록된 일정 없음');
  L.push('');
  L.push('[A/S 미완료]');
  const openAs=(state.asList||[]).filter(a=>!a.done);
  L.push('- '+openAs.length+'건'+(openAs.length? ' ('+openAs.slice(0,5).map(a=>a.client||a.title||'').join(', ')+')':''));
  L.push('');
  L.push('[AI 결과물 승인 대기]');
  const pd = aicPendingDocs();
  if(pd.length) pd.forEach(d=> L.push('  · '+d.name+' ('+d.staffName+')'));
  else L.push('- 없음');
  return L.join('\n');
}

function aicMakeDoc(team, name, type, body, needsApproval){

const AIC_MIME = {md:'text/markdown', txt:'text/plain', xlsx:'text/csv', docx:'text/plain', pdf:'text/plain'};
function aicDownloadDoc(docId){
  const d = aicDocById(docId); if(!d) return;
  const ver = d.versions[d.curV];
  const ext = (d.type==='pdf'||d.type==='docx') ? 'txt' : (d.type==='xlsx' ? 'csv' : d.type);
  const base = d.name.replace(/\.[^.]+$/,'');
  const fname = base + '_' + ver.v + '.' + ext;
  const blob = new Blob(['﻿'+ver.body], {type:(AIC_MIME[d.type]||'text/plain')+';charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  toast(fname+' 저장했어요','ok');
}

}

/* 입력 UX 전역: 브라우저 자동완성/자동수정/자동대문자/맞춤법 비활성 (IME 안전, 값은 건드리지 않음) */
function applyInputUX(){
  const main=document.getElementById('main'); if(!main) return;
  main.querySelectorAll('input, textarea').forEach(el=>{
    const t=(el.type||'text').toLowerCase();
    if(t==='file'||t==='checkbox'||t==='radio'||t==='date'||t==='range') return;
    if(!el.getAttribute('autocomplete')) el.setAttribute('autocomplete','off');
    el.setAttribute('autocorrect','off');
    el.setAttribute('autocapitalize','off');
    el.setAttribute('spellcheck','false');
  });
  // 키보드가 입력창을 가리지 않도록 포커스 시 화면 중앙으로 스크롤 (1회만 등록)
  if(!window.__focusScrollBound){
    window.__focusScrollBound=true;
    document.addEventListener('focusin', e=>{
      const el=e.target;
      if(!el || !el.matches || !el.matches('input,textarea,select')) return;
      if(['checkbox','radio','file'].includes((el.type||'').toLowerCase())) return;
      setTimeout(()=>{ try{ el.scrollIntoView({block:'center', behavior:'smooth'}); }catch(_){ try{ el.scrollIntoView(); }catch(__){} } }, 280);
    });
  }
}
/* 공지 모달: 첨부 목록만 부분 갱신 (제목·내용 등 입력값 보존) */
function refreshNoticeAttList(){
  const box=document.getElementById('nt_attList'); if(!box) return;
  const editing=state.editNoticeId? noticeById(state.editNoticeId):null;
  const atts=(editing?(editing.attachments||[]):[]).concat(state.__pendingAtts||[]);
  box.innerHTML = atts.map((a,i)=>`<div style="display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0"><span style="flex:1">${esc(a.name)} <span style="color:var(--text-mute)">(${humanSizeDL(a.size)})</span></span><button type="button" class="ntAttRm" data-i="${i}" style="border:none;background:none;color:var(--red);cursor:pointer;font-size:16px">×</button></div>`).join('');
  box.querySelectorAll('.ntAttRm').forEach(btn=> btn.addEventListener('click', ()=>{
    const i=+btn.dataset.i; const ex=editing?(editing.attachments||[]).length:0;
    if(i<ex){ editing.attachments.splice(i,1); } else { (state.__pendingAtts||[]).splice(i-ex,1); }
    refreshNoticeAttList();
  }));
}

/* 최근 사용한 거래처 N개 (견적 최신순, 중복 제거) */
function recentClients(n){
  const seen=new Set(), out=[];
  [...state.quotes].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(q=>{
    if(q.client && !seen.has(q.client)){ seen.add(q.client); out.push(q.client); }
  });
  return out.slice(0, n||6);
}

/* 입력 디바운스 */
function debounce(fn, ms){ let t; return function(){ const a=arguments, self=this; clearTimeout(t); t=setTimeout(()=>fn.apply(self,a), ms||220); }; }
/* 검색 입력 공통 바인딩 — 한글 조합(IME) 중엔 재렌더 안 하고, 입력이 멈춘 뒤에만 렌더.
   → 한글 'ㄱㅡㅇ' 깨짐 + 매 글자 렌더로 인한 렉 모두 해결. */
function bindSearchInput(id, setter, opts){
  const el=document.getElementById(id);
  if(!el) return;
  opts=opts||{};
  let composing=false;
  const doRender=debounce(()=>{
    if(composing) return;        // 조합 중이면 렌더 스킵 → compositionend에서 다시 렌더됨 (깨짐 방지)
    keepFocus(id); render();
  }, opts.ms||250);
  el.addEventListener('compositionstart', ()=>{ composing=true; });
  el.addEventListener('compositionend', ()=>{ composing=false; setter(el.value); doRender(); });
  el.addEventListener('input', ()=>{
    setter(el.value);       // 상태는 즉시 반영, 렌더만 미룸
    if(composing) return;   // 한글 조합 중엔 재렌더 금지(깨짐 방지)
    doRender();
  });
  if(opts.keydown) el.addEventListener('keydown', opts.keydown);
}

        if(!ok){ const el=document.getElementById('kmapRoute'); if(el){ el.style.height='auto'; el.innerHTML='<div style="padding:22px 16px;font-size:13px;color:var(--text-mute);text-align:center;line-height:1.8">🗺 임베드 지도는 못 불러왔어요.<br><span style="font-size:12px">카카오 개발자 사이트 <b>플랫폼 → Web 도메인</b>에 지금 이 주소를 등록하면 여기 지도가 떠요.</span><br><b style="color:var(--navy)">그냥 아래 「네이버지도 길찾기」로 진짜 지도앱에서 여는 게 제일 편해요 👇</b></div>'; } }
      })();
    }
  }
  const navReset=document.getElementById('navReset');
  if(navReset) navReset.addEventListener('click', async ()=>{
    state.navConf=null; try{ await store.set('navConf', null); }catch(e){} scheduleCloudPush();
    toast('기본 메뉴 순서로 되돌렸어요','ok'); render();
  });

  const roleSel=document.getElementById('roleSel');
  if(roleSel) roleSel.addEventListener('change', async e=>{
    state.role=e.target.value;
    try{ await store.set('role', state.role); }catch(err){}
    const allow=ROLE_MENUS[state.role];
    if(allow && !allow.includes(state.view)) state.view='home';
    toast('역할을 "'+state.role+'"(으)로 바꿨어요','ok'); render();
  });
  const clearAct=document.getElementById('clearActivity');
  if(clearAct) clearAct.addEventListener('click', async ()=>{
    if(!confirm('활동 로그를 모두 비울까요? (프로젝트별 이력은 그대로 유지됩니다)')) return;
    state.activity=[]; try{ await store.set('activity', []); }catch(e){}
    scheduleCloudPush(); toast('활동 로그를 비웠어요','ok'); render();
  });
  document.querySelectorAll('.autoRe').forEach(b=> b.addEventListener('click', async ()=>{
    if(!confirm('이 시점 상태로 되돌립니다. 현재 자료는 덮어써져요. 계속할까요?')) return;
    if(await autoRestore(parseInt(b.dataset.i))){ toast('되돌렸어요','ok'); render(); }
  }));

  const backupBtn = document.getElementById('backupBtn');
  if(backupBtn) backupBtn.addEventListener('click', ()=>doBackup(true));
  const backupLight=document.getElementById('backupLightBtn');
  if(backupLight) backupLight.addEventListener('click', ()=>doBackup(false));

  const restoreInput = document.getElementById('restoreInput');
  if(restoreInput) restoreInput.addEventListener('change', async e=>{
    if(e.target.files && e.target.files[0]) await doRestore(e.target.files[0]);
    e.target.value='';
  });

  const pasteBtn = document.getElementById('pasteRestore');
  if(pasteBtn) pasteBtn.addEventListener('click', async ()=>{
    const txt = (document.getElementById('pasteBox').value||'').trim();
    const msg = document.getElementById('backupMsg');
    if(!txt){ alert('먼저 백업 내용을 붙여넣어 주세요.'); return; }
    await doRestoreText(txt, msg);
  });

  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.addEventListener('click', async ()=>{
    if(!confirm('정말 모든 자료를 삭제할까요? 되돌릴 수 없어요.')) return;
    if(!confirm('마지막 확인입니다. 백업은 받으셨나요?')) return;
    if(STORE_MODE==='local'){
      store.keys().forEach(k=>localStorage.removeItem('hmsign_'+k));
    }else{
      await store.set('quotes',[]); await store.set('clients',[]); await store.set('items',[]);
      await store.set('payments',{}); await store.set('jobs',{}); await store.set('mfg',{});
      await store.set('install',{}); await store.set('aslist',[]);
    }
    location.reload();
  });
}

async function refreshAsPhotos(){
  const arr = await loadPhotos('as_'+state.editAsId);
  const st=document.getElementById('asPhotoStatus');
  if(st) st.textContent = arr.length? arr.length+'장 저장됨' : '등록된 사진이 없어요.';
  drawAsPhotos(arr);
}
function drawAsPhotos(arr){
  const grid=document.getElementById('asPhotoGrid');
  if(!grid) return;
  grid.innerHTML = arr.map((p,i)=>`<div class="photo-item"><img src="${p.d}" alt="하자사진"><button class="photo-del asDel" data-i="${i}">×</button></div>`).join('');
  grid.querySelectorAll('.asDel').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('이 사진을 삭제할까요?')) return;
      arr.splice(parseInt(b.dataset.i),1);
      await savePhotos('as_'+state.editAsId, arr);
      state.gallery=null;
      refreshAsPhotos();
    });
  });
}

async function refreshPhotoGrid(){
  if(!state.instQuoteId) return;
  state.photos = await loadPhotos(state.instQuoteId);
  const status = document.getElementById('photoStatus');
  if(status) status.textContent = state.photos.length? `${state.photos.length}장 저장됨` : '아직 등록된 사진이 없어요.';
  drawPhotoGrid();
}

function drawPhotoGrid(){
  const grid = document.getElementById('photoGrid');
  if(!grid) return;
  grid.innerHTML = state.photos.map((p,i)=>`
    <div class="photo-item">
      <img src="${p.d}" alt="현장사진 ${i+1}">
      <button class="photo-del" data-idx="${i}">×</button>
    </div>`).join('');
  grid.querySelectorAll('.photo-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('이 사진을 삭제할까요?')) return;
      const idx = parseInt(btn.dataset.idx);
      state.photos.splice(idx,1);
      await savePhotos(state.instQuoteId, state.photos);
      state.install[state.instQuoteId] = {...getInstall(state.instQuoteId), photoCount: state.photos.length};
      await saveInstall();
      const status = document.getElementById('photoStatus');
      if(status) status.textContent = state.photos.length? `${state.photos.length}장 저장됨` : '아직 등록된 사진이 없어요.';
      drawPhotoGrid();
    });
  });
}

document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target && e.target.tagName==='INPUT' && e.target.type!=='file'){
    const box=e.target.closest('.modal')||document;
    const fs=[...box.querySelectorAll('input:not([type=file]):not([readonly]), select, textarea')].filter(x=>x.offsetParent!==null||true);
    const i=fs.indexOf(e.target);
    if(i>-1 && i<fs.length-1){ e.preventDefault(); fs[i+1].focus(); if(fs[i+1].select) fs[i+1].select(); return; }
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    const el=document.getElementById('gsInput');
    if(el){ el.focus(); el.select(); }
    return;
  }
  if(e.key==='Escape'){
    if(state.modal){ state.modal=null; state.editQuoteId=null; state.draftLines=[]; state.draftHeader=null;
      state.editClientId=null; state.editItemId=null; state.payQuoteId=null; state.jobQuoteId=null;
      state.instQuoteId=null; state.editAsId=null; state.copiedFrom=null; render(); return; }
    if(state.galleryOpen){ state.galleryOpen=null; render(); return; }
    if(state.gqOpen){ state.gq=''; state.gqOpen=false; render(); return; }
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){
    e.preventDefault();
    const btn=document.getElementById('saveModal')||document.getElementById('saveClientModal')
            ||document.getElementById('saveItemModal')||document.getElementById('savePayModal')
            ||document.getElementById('saveJobModal')||document.getElementById('saveInstModal')
            ||document.getElementById('saveAsModal');
    if(btn){ btn.click(); toast('저장했어요','ok'); }
  }
});

/* ===== 실시간 동기화: 자동으로 받아오기 =====
   내 변경은 이미 자동 업로드(scheduleCloudPush)되지만,
   가족의 변경은 받아오지 않던 문제를 해결한다. */
let __pullBusy=false;
async function autoPull(reason){
  if(!cloudOn() || __pullBusy) return;
  if(state.pendingSync) return;               // 내 미전송분 있으면 업로드 우선
  __pullBusy=true;
  try{
    const c=cloudCfg();
    // 가벼운 헤드체크: updated_at만 조회해서 바뀐 경우에만 전체 pull
    const r=await fetch(`${c.url}/rest/v1/${CLOUD_TABLE}?workspace=eq.${encodeURIComponent(c.ws)}&select=updated_at`, {headers:cloudHeaders()});
    if(r.ok){
      const rows=await r.json();
      const stamp=rows.length? rows[0].updated_at : null;
      if(stamp && stamp!==state.cloud.remoteStamp){
        const res=await cloudPull(true);
        if(res.ok){ render(); setCloudBadge('동기화됨'); }
      }
    }
  }catch(e){ /* 오프라인 등: 조용히 무시 */ }
  finally{ __pullBusy=false; }
}
setTimeout(()=>autoPull('boot'), 2500);                    // 앱 켤 때
setInterval(()=>autoPull('interval'), 60*1000);            // 1분마다
document.addEventListener('visibilitychange', ()=>{        // 폰에서 앱으로 돌아올 때
  if(document.visibilityState==='visible') autoPull('visible');
});
window.addEventListener('focus', ()=>autoPull('focus'));

/* ===== Supabase Realtime 구독 (즉시 반영) =====
   기존 자동 업로드(scheduleCloudPush)와 주기 수신(autoPull)은 그대로 두고,
   웹소켓으로 "상대가 저장하는 즉시" 내 화면에 반영되게만 추가한다.
   연결이 끊기면 기존 1분 주기 수신이 자동으로 백업 역할을 한다. */
let __rtSock=null, __rtTimer=null, __rtHB=null, __rtRef=0, __myPushAt=0;
function rtStop(){
  try{ if(__rtHB) clearInterval(__rtHB); }catch(e){}
  try{ if(__rtSock){ __rtSock.onclose=null; __rtSock.close(); } }catch(e){}
  __rtSock=null; __rtHB=null;
}
function rtStart(){
  if(!cloudOn()) return;
  if(__rtSock && (__rtSock.readyState===0 || __rtSock.readyState===1)) return;  // 이미 연결중/연결됨
  const c=cloudCfg();
  let wsUrl;
  try{ wsUrl = c.url.replace(/^http/,'ws').replace(/\/+$/,'') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(c.key) + '&vsn=1.0.0'; }
  catch(e){ return; }
  let sock;
  try{ sock = new WebSocket(wsUrl); }catch(e){ return; }
  __rtSock = sock;

  sock.onopen = ()=>{
    __rtRef++;
    try{
      sock.send(JSON.stringify({
        topic:'realtime:public:'+CLOUD_TABLE,
        event:'phx_join',
        payload:{ config:{ postgres_changes:[{event:'*', schema:'public', table:CLOUD_TABLE}] } },
        ref:String(__rtRef)
      }));
    }catch(e){}
    if(__rtHB) clearInterval(__rtHB);
    __rtHB = setInterval(()=>{                       // 연결 유지용 하트비트
      try{ __rtRef++; sock.send(JSON.stringify({topic:'phoenix', event:'heartbeat', payload:{}, ref:String(__rtRef)})); }
      catch(e){}
    }, 25000);
  };

  sock.onmessage = (ev)=>{
    let m=null; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(!m || m.event!=='postgres_changes') return;
    if(Date.now()-__myPushAt < 4000) return;          // 내가 방금 올린 것은 무시(메아리 방지)
    clearTimeout(__rtTimer);
    __rtTimer=setTimeout(()=>autoPull('realtime'), 400);   // 살짝 모아서 1회만 수신
  };

  sock.onclose = ()=>{                                // 끊기면 잠시 후 재연결
    rtStop();
    setTimeout(rtStart, 8000);
  };
  sock.onerror = ()=>{ try{ sock.close(); }catch(e){} };
}
setTimeout(rtStart, 3500);                            // 앱 켜고 잠시 후 구독 시작
document.addEventListener('visibilitychange', ()=>{   // 화면 복귀 시 끊겼으면 재연결
  if(document.visibilityState==='visible') rtStart();
});

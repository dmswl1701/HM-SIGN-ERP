<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HM SIGN">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231F3864'/%3E%3Ctext x='90' y='84' font-size='46' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'%3EHM%3C/text%3E%3Ctext x='90' y='126' font-size='26' fill='%23C87F1E' text-anchor='middle' font-family='sans-serif'%3ESIGN%3C/text%3E%3C/svg%3E">
<title>HM SIGN ERP</title>
<style>
  :root{
    --navy:#1F3864; --navy-light:#2E4A7D; --amber:#C87F1E; --amber-bg:#FBF1E1;
    --bg:#F3F5F8; --card:#FFFFFF; --border:#E1E5EB; --text:#1C2430; --text-mute:#6B7686;
    --green:#1F7A4D; --green-bg:#E7F5EC; --red:#B3311C; --red-bg:#FBEAE7;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--text); font-size:14px;}
  .app{display:flex; min-height:600px; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--card);}
  .sidebar{width:190px; background:var(--navy); color:#fff; flex-shrink:0; display:flex; flex-direction:column;}
  .brand{padding:20px 18px; font-size:16px; font-weight:700; border-bottom:1px solid rgba(255,255,255,.12); letter-spacing:.3px;}
  .brand small{display:block; font-size:11px; font-weight:400; color:#B7C4DC; margin-top:3px;}
  .nav{padding:10px 0; flex:1;}
  .nav-item{padding:11px 20px; font-size:13.5px; cursor:pointer; color:#CBD6E8; border-left:3px solid transparent; display:flex; align-items:center; gap:9px;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.1); color:#fff; border-left-color:var(--amber); font-weight:700;}
  .nav-item.soon{color:#6F82A8; cursor:default;}
  .nav-item.soon:hover{background:none; color:#6F82A8;}
  .nav-tag{margin-left:auto; font-size:10px; background:rgba(255,255,255,.1); padding:1px 6px; border-radius:8px; color:#9FB0CC;}
  .main-wrap{flex:1; display:flex; flex-direction:column; min-width:0;}
  .gsbar{padding:12px 26px 0; background:var(--card);}
  .gsbar input{width:100%; padding:11px 15px; border:1.5px solid var(--border); border-radius:9px; font-size:14px; background:#FAFBFD;}
  .gsbar input:focus{outline:none; border-color:var(--navy); background:#fff;}
  .main{flex:1; padding:16px 26px 22px; overflow:auto; max-height:720px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
  .topbar h1{font-size:19px; font-weight:700; color:var(--navy);}
  .btn{background:var(--navy); color:#fff; border:none; padding:9px 16px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer;}
  .btn:hover{background:var(--navy-light);}
  .btn.secondary{background:#fff; color:var(--navy); border:1px solid var(--border);}
  .btn.secondary:hover{background:var(--bg);}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:20px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 18px;}
  .card .label{font-size:12px; color:var(--text-mute); margin-bottom:8px;}
  .card .value{font-size:22px; font-weight:700; color:var(--navy);}
  .card .sub{font-size:11px; color:var(--text-mute); margin-top:4px;}
  .panel{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:18px 20px; margin-bottom:16px;}
  .panel h2{font-size:14.5px; font-weight:700; margin-bottom:14px; color:var(--navy);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; padding:9px 10px; color:var(--text-mute); font-weight:700; border-bottom:1.5px solid var(--border); font-size:12px; white-space:nowrap;}
  td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:hover td{background:#FAFBFD;}
  .amt{text-align:right; font-variant-numeric:tabular-nums; font-weight:600;}
  .badge{display:inline-block; padding:3px 9px; border-radius:12px; font-size:11.5px; font-weight:700;}
  .badge.발송{background:#EEF1F7; color:#5A6478;}
  .badge.계약{background:var(--green-bg); color:var(--green);}
  .badge.완료{background:var(--green-bg); color:var(--green);}
  .badge.미성사{background:var(--red-bg); color:var(--red);}
  .toolbar{display:flex; gap:8px; margin-bottom:14px; align-items:center;}
  .toolbar input, .toolbar select{padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; background:#fff;}
  .toolbar input{flex:1; max-width:260px;}
  .empty{text-align:center; padding:40px 10px; color:var(--text-mute); font-size:13px;}
    .modal-bg{position:fixed; inset:0; background:rgba(15,20,30,.5); display:flex; align-items:center; justify-content:center;
    z-index:9990; padding:20px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
    .modal{background:#fff; border-radius:12px; width:440px; max-width:100%; padding:22px 24px; max-height:88vh; overflow-y:auto;
    box-shadow:0 12px 40px rgba(0,0,0,.28); margin:auto;}
  .modal h3{font-size:16px; color:var(--navy); margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--text-mute); margin-bottom:5px; font-weight:700;}
  .field input, .field select{width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:7px; font-size:14px; background:#fff;}
  .field input:focus, .field select:focus{outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(31,56,100,.1);}
  .modal .field{position:relative;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  /* 저장/취소 바를 모달 하단에 고정 → 항상 바로 누를 수 있게 */
  .modal-actions, .modal-btns{position:sticky; bottom:-1px; background:#fff; padding-top:12px; border-top:1px solid var(--border); z-index:3;}
  .field input, .field select, .field textarea{scroll-margin:100px;}
  .line-row input{scroll-margin:120px;}
  .qnum{font-family:monospace; font-size:12px; color:var(--amber); background:var(--amber-bg); padding:2px 7px; border-radius:5px;}
  .status-select{padding:4px 6px; border:1px solid var(--border); border-radius:5px; font-size:12px; background:#fff;}
  .banner{background:var(--amber-bg); color:#7A4E0E; border:1px solid #E9CE9C; border-radius:8px; padding:10px 14px; font-size:12.5px; margin-bottom:16px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .chip{padding:5px 12px; border:1px solid var(--border); background:#fff; border-radius:14px; font-size:12px; cursor:pointer; color:var(--text-mute);}
  .chip:hover{border-color:var(--navy); color:var(--navy);}
  .chip.active{background:var(--navy); color:#fff; border-color:var(--navy); font-weight:700;}

  /* ---------- 모바일 대응 ---------- */
  @media (max-width: 760px){
    body{font-size:15px;}
    .app{flex-direction:column; border-radius:0; border:none; min-height:auto;}
    .sidebar{width:100%; flex-direction:column;}
    .brand{padding:14px 16px; font-size:15px;}
    .nav{display:flex; overflow-x:auto; padding:0; gap:0; -webkit-overflow-scrolling:touch;}
    .nav::-webkit-scrollbar{display:none;}
    .nav-item{padding:12px 15px; border-left:none; border-bottom:3px solid transparent; white-space:nowrap; font-size:13px;}
    .nav-item.active{border-left:none; border-bottom-color:var(--amber);}
    .nav-tag{display:none;}
    .gsbar{padding:10px 14px 0;}
    .gsbar input{font-size:16px; padding:12px;}
    .main{padding:12px 14px 18px; max-height:none;}
    .topbar h1{font-size:17px;}
    .cards{grid-template-columns:repeat(2,1fr); gap:10px;}
    .card{padding:13px 14px;}
    .card .value{font-size:18px;}
    .panel{padding:14px 12px;}
    .toolbar{flex-wrap:wrap;}
    .toolbar input{max-width:none; width:100%;}
    /* 표를 카드형으로 전환 */
    .main table, .main thead, .main tbody, .main tr, .main td{display:block; width:100%;}
    .main thead, .main th{display:none;}
    .main tr{border:1px solid var(--border); border-radius:9px; margin-bottom:10px; padding:10px 12px; background:#fff;}
    .main tr:hover td{background:transparent;}
    .main td{border:none; padding:4px 0; display:flex; justify-content:space-between; align-items:center; gap:10px;}
    .main td:before{content:attr(data-l); font-size:11.5px; color:var(--text-mute); font-weight:700; flex-shrink:0;}
    .main td.amt{text-align:right;}
    .main td[data-l=""]:before{display:none;}
    .modal{width:100%; max-width:100%; border-radius:14px 14px 0 0; max-height:90vh; padding:18px 16px 26px;}
    .modal-bg{align-items:flex-end; padding:0;}
    .btn{padding:11px 16px;}
    .field input, .field select{padding:11px 10px; font-size:16px;}
  }

  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .caldow{text-align:center;font-size:11.5px;font-weight:700;padding:5px 0;}
  .calcell{min-height:78px;border:1px solid var(--border);border-radius:7px;padding:4px 5px;cursor:pointer;background:#fff;overflow:hidden;}
  .calcell.empty{background:#FAFBFD;border-color:#F0F2F6;cursor:default;}
  .calcell:hover:not(.empty){border-color:var(--navy);}
  .calcell.today{background:#FFFBF2;border-color:var(--amber);border-width:2px;}
  .calcell.sel{outline:2px solid var(--navy);}
  .caldn{font-size:11.5px;font-weight:700;margin-bottom:3px;}
  .calev{font-size:9.5px;color:#fff;border-radius:3px;padding:1px 4px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; cursor:pointer;}
  .calmore{font-size:9.5px;color:var(--text-mute);}
  @media (max-width:760px){ .calcell{min-height:56px;padding:3px;} .calev{font-size:8px;} .caldn{font-size:10.5px;} }
  .pjstage{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fff;}
  .pjstage:hover{border-color:var(--navy);}
  .pjstage.on{background:var(--green-bg);border-color:#A9D9BE;}
  .pjstage input{width:17px;height:17px;accent-color:var(--green);cursor:pointer;}
  .pjstage .nm{font-size:13px;font-weight:600;}
  .pjstage .dt{margin-left:auto;font-size:11px;color:var(--text-mute);}
  .tl{position:relative;padding-left:6px;}
  .tlrow{display:flex;gap:11px;padding:9px 0;border-left:2px solid var(--border);padding-left:15px;margin-left:5px;}
  .tldot{width:9px;height:9px;border-radius:50%;background:var(--navy);margin-left:-20px;margin-top:5px;flex-shrink:0;}
  .tltx{font-size:13px;font-weight:600;}
  .tlat{font-size:11px;color:var(--text-mute);margin-top:2px;}
  .kanwrap{display:grid; grid-template-columns:repeat(4,1fr); gap:11px;}
  .kancol{background:var(--bg); border-radius:10px; padding:9px; min-height:180px;}
  .kancol.over{background:#E8EEF9; outline:2px dashed var(--navy);}
  .kanhd{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:700;
    padding:4px 6px 8px; border-bottom:2px solid; margin-bottom:9px;}
  .kanhd b{background:#fff; border-radius:9px; padding:1px 8px; font-size:11px; color:var(--text-mute);}
  .kanbody{min-height:120px; display:flex; flex-direction:column; gap:8px;}
  .kancard{background:#fff; border:1px solid var(--border); border-radius:8px; padding:9px 10px; cursor:grab; box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .kancard:active{cursor:grabbing;}
  .kancard.drag{opacity:.45;}
  .kct{font-size:12.5px; font-weight:700; margin-bottom:3px;}
  .kcs{font-size:11px; color:var(--text-mute); margin-bottom:6px;}
  .kcbar{background:#EEF1F7; border-radius:4px; height:5px; overflow:hidden; margin-bottom:5px;}
  .kcbar>div{height:100%;}
  .kcf{display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-mute);}
  .kanempty{text-align:center; color:#AEB6C2; font-size:11.5px; padding:16px 0;}
  @media (max-width:760px){ .kanwrap{grid-template-columns:repeat(2,1fr); gap:8px;} .kancol{padding:7px;} }
  .mfg-card{border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:12px; background:#fff;}
  .mfg-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px;}
  .mfg-bar{background:#EEF1F7; border-radius:6px; height:8px; overflow:hidden; margin-bottom:12px;}
  .mfg-bar>div{height:100%; transition:width .2s;}
  .mfg-steps{display:flex; flex-wrap:wrap; gap:8px;}
  .mfg-step{display:flex; align-items:center; gap:6px; padding:7px 13px; border:1px solid var(--border); border-radius:16px; font-size:12.5px; cursor:pointer; user-select:none; color:var(--text-mute);}
  .mfg-step:hover{border-color:var(--navy);}
  .mfg-step.on{background:var(--green-bg); border-color:#A9D9BE; color:var(--green); font-weight:700;}
  .mfg-step input{cursor:pointer; width:15px; height:15px; accent-color:var(--green);}
  @media (max-width:760px){
    .mfg-steps{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
    .mfg-step{justify-content:center; padding:10px 4px; font-size:12px;}
  }

  .inst-card{border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:12px; background:#fff;}
  .inst-card.today{border-color:#E9CE9C; background:#FFFDF8;}
  .inst-card.done{opacity:.72;}
  .inst-head{display:flex; justify-content:space-between; gap:12px; margin-bottom:12px;}
  .inst-actions{display:flex; gap:8px;}
  .photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:10px;}
  .photo-item{position:relative; padding-top:100%; border-radius:7px; overflow:hidden; background:#EEF1F7;}
  .photo-item img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .photo-del{position:absolute; top:4px; right:4px; background:rgba(20,25,35,.72); color:#fff; border:none; border-radius:50%; width:22px; height:22px; font-size:13px; cursor:pointer; line-height:1;}
  @media (max-width:760px){
    .inst-head{flex-direction:column; gap:6px;}
    .inst-actions{flex-direction:column;}
    .photo-grid{grid-template-columns:repeat(3,1fr);}
  }

  .frow{display:flex; gap:10px;}
  .revtag{display:inline-block; font-size:10.5px; background:#EEF1F7; color:#5A6478; padding:1px 6px; border-radius:8px; margin-left:4px; font-weight:700;}
  .qbtns{white-space:nowrap;}
  .qbtns .btn{padding:5px 9px; font-size:13px; margin-right:3px;}
  @media (max-width:760px){ .qbtns{display:flex; gap:6px;} .qbtns .btn{flex:1; padding:9px;} }
  .lines-head{display:grid; grid-template-columns:46px 1.4fr 0.85fr 50px 50px 82px 84px 0.7fr 30px; gap:6px; font-size:11px; color:var(--text-mute); font-weight:700; padding:0 2px 5px;}
  .line-row{display:grid; grid-template-columns:46px 1.4fr 0.85fr 50px 50px 82px 84px 0.7fr 30px; gap:6px; align-items:center; margin-bottom:6px;}
  .l-group{background:#EAF0FA; border:1px solid var(--border); border-radius:6px; color:var(--navy); font-size:11px; font-weight:700; cursor:pointer; height:34px; font-family:inherit;}
  .l-group.sel{background:#F3EAF7; color:#7B4FA8;}
  .line-row input{padding:8px 8px; border:1px solid var(--border); border-radius:6px; font-size:13px; width:100%; min-width:0;}
  .l-amt{text-align:right; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; padding-right:2px;}
  .l-del{background:#fff; border:1px solid var(--border); border-radius:6px; color:var(--red); cursor:pointer; height:34px; font-size:16px;}
  .total-box{background:var(--bg); border-radius:9px; padding:12px 15px; margin-top:14px; font-size:13px;}
  .total-box>div{display:flex; justify-content:space-between; padding:3px 0;}
  .total-box .tot{border-top:1px solid var(--border); margin-top:6px; padding-top:9px; font-size:16px; color:var(--navy);}
  @media (max-width:760px){
    .frow{flex-direction:column; gap:0;}
    .lines-head{display:none;}
    .line-row{grid-template-columns:1fr 1fr 1fr; gap:5px; border:1px solid var(--border); border-radius:8px; padding:9px; margin-bottom:9px; position:relative;}
    .line-row .l-group{grid-column:1/4; height:30px;}
    .line-row .l-name{grid-column:1/4;}
    .line-row .l-spec{grid-column:1/4;}
    .line-row .l-remark{grid-column:1/4;}
    .l-amt{grid-column:1/4; text-align:right; border-top:1px dashed var(--border); padding-top:6px;}
    .l-del{position:absolute; top:-8px; right:-8px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.15);}
    .modal{width:100%!important;}
  }
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute; left:0; top:0; width:100%;}
    @page{size:A4; margin:12mm;}
  }
  #printArea{display:none;}
  .mchart{display:flex; align-items:flex-end; gap:6px; overflow-x:auto; padding-bottom:4px;}
  .mcol{display:flex; flex-direction:column; align-items:center; gap:4px; min-width:44px; flex:1;}
  .mbar{width:26px; background:var(--navy); border-radius:5px 5px 0 0; transition:height .3s;}
  .mval{font-size:10px; color:var(--text-mute); white-space:nowrap;}
  .mlab{font-size:10.5px; color:var(--text-mute);}
  .hrow{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .hname{width:110px; font-size:12.5px; font-weight:600; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .htrack{flex:1; background:#EEF1F7; border-radius:6px; height:14px; overflow:hidden;}
  .hfill{height:100%; background:var(--navy); border-radius:6px; min-width:3px;}
  .hval{font-size:11.5px; color:var(--text-mute); white-space:nowrap; flex-shrink:0; font-variant-numeric:tabular-nums;}
  @media (max-width:760px){ .hname{width:82px;} .hval{font-size:10.5px;} }
  .cbadge{margin-top:7px; font-size:10.5px; color:#9FB0CC; font-weight:400;}
  .cbadge:not(:empty){padding:3px 8px; background:rgba(255,255,255,.1); border-radius:10px; display:inline-block;}
  .tdgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px;}
  .tdblk{border:1px solid var(--border); border-radius:9px; padding:11px 13px; background:#fff;}
  .tdhd{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; margin-bottom:8px; color:var(--navy);}
  .tdcnt{background:var(--navy); color:#fff; border-radius:10px; padding:1px 8px; font-size:11px;}
  .tdhd .btn{margin-left:auto; padding:3px 9px; font-size:11px;}
  .tdrow{display:flex; align-items:center; gap:6px; padding:5px 0; border-top:1px solid #F1F3F7; font-size:12.5px;}
  .tdrow b{font-weight:600;}
  .tdrow span{color:var(--text-mute); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tdrow a{margin-left:auto; text-decoration:none; font-size:14px;}
  .tdmore{font-size:11px; color:var(--text-mute); padding-top:6px; text-align:center;}
  .quick{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .qbtn{display:flex; flex-direction:column; align-items:center; gap:7px; padding:16px 8px; background:#fff;
    border:1px solid var(--border); border-radius:10px; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--navy);}
  .qbtn:hover{border-color:var(--navy); background:#FAFBFD;}
  .qbtn span{font-size:21px;}
  @media (max-width:760px){ .quick{grid-template-columns:repeat(2,1fr);} .qbtn{padding:16px 8px;} .tdgrid{grid-template-columns:1fr;} }
  #updBar{position:fixed; left:0; right:0; bottom:0; background:#1F3864; color:#fff; padding:13px 16px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; z-index:9998; font-size:13.5px; box-shadow:0 -3px 14px rgba(0,0,0,.2);}
  #updBar button{padding:8px 15px; border:none; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; background:#E8A33D; color:#3A2A05;}
  #updBar button#updLater{background:rgba(255,255,255,.16); color:#fff;}
  @media (max-width:760px){ #updBar{font-size:12.5px; padding:11px 12px;} }

/* ===== 저장소 어댑터 =====
   클로드 안에서는 window.storage(가족 공유), 밖에서는 localStorage(기기 저장)를 자동 사용 */
const STORE_MODE = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') ? 'claude' : 'local';
const LS_PREFIX = 'hmsign_';
const store = {
  /* 읽기·쓰기 모두 한 줄로 줄 세우고, 속도제한(rate limit)이면 자동 재시도.
     '자료 없음'과 '일시적 오류'를 정확히 구분해 데이터 유실을 막는다. */
  _q: Promise.resolve(),
  _last: 0,
  _isRate(e){ return /rate limit|too many|429|throttl/i.test(String((e&&e.message)||e)); },
  _isMissing(e){ const m=String((e&&e.message)||e); return /not found|no data|does not exist|missing|null/i.test(m); },
  async _run(fn){                       // 큐 + 최소 간격 + 재시도
    const task = store._q.then(async ()=>{
      const gap = 350 - (Date.now()-store._last);
      if(gap>0) await new Promise(r=>setTimeout(r,gap));
      let lastErr=null;
      for(let i=0;i<5;i++){
        try{ const r = await fn(); store._last=Date.now(); return r; }
        catch(e){
          lastErr=e; store._last=Date.now();
          if(store._isRate(e) && i<4){ await new Promise(r=>setTimeout(r, 1200*(i+1))); continue; }
          throw e;
        }
      }
      throw lastErr;
    });
    store._q = task.catch(()=>{});      // 하나 실패해도 큐는 계속
    return await task;
  },
  async get(key){
    if(STORE_MODE==='claude'){
      const res = await store._run(()=> window.storage.get(key, true));
      return JSON.parse(res.value);
    }
    const v = localStorage.getItem(LS_PREFIX+key);
    if(v===null){ const e=new Error('no data'); e.__missing=true; throw e; }
    return JSON.parse(v);
  },
  /* 값이 없을 때만 기본값을 주고, 통신 오류면 그대로 알린다 */
  async getSafe(key, dflt){
    try{ const v = await store.get(key); return (v===undefined||v===null)? dflt : v; }
    catch(e){ return dflt; }
  },
  async set(key, val){
    if(STORE_MODE==='claude'){
      const str = JSON.stringify(val);
      return await store._run(()=> window.storage.set(key, str, true));
    }
    localStorage.setItem(LS_PREFIX+key, JSON.stringify(val));
    return true;
  },
  keys(){
    if(STORE_MODE==='claude') return [];
    return Object.keys(localStorage).filter(k=>k.startsWith(LS_PREFIX)).map(k=>k.slice(LS_PREFIX.length));
  }
};

/* ===== 견적 내역(라인아이템) ===== */
function qLines(q){ return Array.isArray(q.lines)? q.lines : []; }
function lineAmount(l){ return Math.round((parseFloat(l.qty)||0) * (parseFloat(l.price)||0)); }
function linesTotal(q){
  const ls = qLines(q);
  if(ls.length) return ls.reduce((s,l)=>s+lineAmount(l),0);
  return q.amount||0;
}
function quoteVat(q){ return Math.round(linesTotal(q)*0.1); }

let _toastTimer=null;
function toast(msg, type){
  const el=document.getElementById('toast');
  if(!el) return;
  el.textContent=msg;
  el.className='show'+(type? ' '+type : '');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{ el.className=''; }, 2200);
}

function esc(v){
  return String(v==null?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let _focusTarget=null;
function keepFocus(id){ const el=document.getElementById(id); if(el) _focusTarget={id, pos:el.selectionStart}; }
function restoreFocus(){
  if(!_focusTarget) return;
  const el=document.getElementById(_focusTarget.id);
  if(el){ el.focus(); try{ el.setSelectionRange(_focusTarget.pos,_focusTarget.pos); }catch(e){} }
  _focusTarget=null;
}


/* ===== 사진 전용 저장소 =====
   클로드 안: window.storage(가족 공유) / 밖: IndexedDB(대용량, 수백 장 가능) */
const PhotoDB = {
  _db:null, _failed:false,
  async open(){
    if(this._db) return this._db;
    if(this._failed || typeof indexedDB==='undefined') return null;
    try{
      this._db = await new Promise((res,rej)=>{
        const r = indexedDB.open('hmsign_photos', 1);
        r.onupgradeneeded = ()=>{ const db=r.result; if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos'); };
        r.onsuccess = ()=>res(r.result);
        r.onerror = ()=>rej(r.error);
      });
      return this._db;
    }catch(e){ this._failed=true; return null; }
  },
  async get(key){
    const db = await this.open(); if(!db) return null;
    return await new Promise((res)=>{
      try{
        const tx=db.transaction('photos','readonly').objectStore('photos').get(key);
        tx.onsuccess=()=>res(tx.result===undefined? null : tx.result); tx.onerror=()=>res(null);
      }catch(e){ res(null); }
    });
  },
  async set(key, arr){
    const db = await this.open(); if(!db) return false;
    return await new Promise((res)=>{
      try{
        const tx=db.transaction('photos','readwrite').objectStore('photos').put(arr, key);
        tx.onsuccess=()=>res(true); tx.onerror=()=>res(false);
      }catch(e){ res(false); }
    });
  }
};

/* [안전장치 E] 동시 편집 보호 — 서버에만 있는 항목은 지우지 않고 살려서 합침 */
function mergeById(mine, theirs){
  const out = Array.isArray(mine)? [...mine] : [];
  const have = new Set(out.map(x=>x && x.id));
  (Array.isArray(theirs)? theirs : []).forEach(t=>{
    if(t && t.id && !have.has(t.id)) out.push(t);   // 상대가 추가한 건 보존
  });
  return out;
}
function mergeMap(mine, theirs){
  const out = {...(theirs||{}), ...(mine||{})};      // 내 값 우선, 상대 것도 유지
  return out;
}
function mergePayload(mine, theirs){
  if(!theirs) return mine;
  return {
    quotes:  mergeById(mine.quotes,  theirs.quotes),
    clients: mergeById(mine.clients, theirs.clients),
    items:   mergeById(mine.items,   theirs.items),
    asList:  mergeById(mine.asList,  theirs.asList),
    trash:   Array.isArray(mine.trash)? mine.trash : (theirs.trash||[]),
    projects: mergeMap(mine.projects, theirs.projects),
    notice:  mine.notice || theirs.notice || null,
    payments: mergeMap(mine.payments, theirs.payments),
    jobs:     mergeMap(mine.jobs,     theirs.jobs),
    mfg:      mergeMap(mine.mfg,      theirs.mfg),
    install:  mergeMap(mine.install,  theirs.install),
    company:  mine.company || theirs.company || null
  };
}

async function cloudPull(silent, opts){
  opts = opts || {};
  if(!cloudOn()) return {ok:false, msg:'클라우드 미설정'};
  const c=cloudCfg();
  try{
    const r = await fetch(`${c.url}/rest/v1/${CLOUD_TABLE}?workspace=eq.${encodeURIComponent(c.ws)}&select=payload,updated_at`, {headers:cloudHeaders()});
    if(!r.ok) throw new Error('서버 응답 '+r.status);
    const rows = await r.json();
    if(!rows.length){
      const up = await cloudPush(true);
      return up.ok? {ok:true, msg:'클라우드에 처음 올렸어요'} : up;
    }

    // [안전장치 C] 아직 못 올린 내 변경분이 있으면 덮어쓰지 않는다
    if(state.pendingSync && !opts.discardLocal){
      const localN = state.quotes.length;
      const remoteN = (rows[0].payload && rows[0].payload.quotes || []).length;
      setCloudBadge('미저장 있음');
      if(!silent){
        const go = confirm(
          '이 기기에 아직 클라우드로 올리지 못한 변경분이 있어요.\n\n'+
          '· 내 기기 견적 '+localN+'건\n· 클라우드 견적 '+remoteN+'건\n\n'+
          '[확인] 내 변경분을 먼저 클라우드에 올립니다 (권장)\n'+
          '[취소] 아무것도 하지 않습니다');
        if(go){ const up=await cloudPush(false); if(up.ok){ toast('내 변경분을 올렸어요','ok'); } return up; }
        return {ok:false, msg:'사용자 취소'};
      }
      // 자동 실행 중이면 조용히 내 것을 먼저 올린다
      const up = await cloudPush(true);
      return up.ok? {ok:true, msg:'미저장분 업로드 후 유지'} : {ok:false, msg:'미저장분 보존(업로드 대기)'};
    }

    // [안전장치 D] 받아오기 전 되돌리기용 스냅샷 보관
    try{ await store.set('lastLocalSnapshot', {at:new Date().toISOString(), data:collectPayload()}); }catch(e){}

    await applyPayload(rows[0].payload||{});
    state.cloud.lastSync = new Date().toISOString();
    state.cloud.remoteStamp = rows[0].updated_at || null;
    await store.set('cloud', state.cloud);
    if(!silent){ toast('클라우드에서 불러왔어요','ok'); render(); }
    return {ok:true, msg:'불러오기 완료'};
  }catch(e){
    if(!silent) toast('클라우드 연결 실패: '+e.message,'warn');
    return {ok:false, msg:e.message};
  }
}

let __lastPushSig=null;
function payloadSig(p){                       // 가벼운 변경 감지용 서명
  try{ const j=JSON.stringify(p); let h=0; for(let i=0;i<j.length;i++){ h=(h*31+j.charCodeAt(i))|0; } return j.length+':'+h; }
  catch(e){ return String(Date.now()); }
}
async function cloudPush(silent, force){
  if(!cloudOn()) return {ok:false, msg:'클라우드 미설정'};
  const c=cloudCfg();
  const payload = collectPayload();
  // 바뀐 게 없으면 올리지 않는다 (통신·배터리 절약)
  const sig = payloadSig(payload);
  if(!force && sig===__lastPushSig){ setCloudBadge('동기화됨'); return {ok:true, msg:'변경 없음'}; }

  // [안전장치 A] 빈 상태가 서버 자료를 덮어쓰지 못하게 차단
  if(!force){
    const localCount = (payload.quotes||[]).length + (payload.clients||[]).length;
    if(localCount === 0){
      try{
        const chk = await fetch(`${c.url}/rest/v1/${CLOUD_TABLE}?workspace=eq.${encodeURIComponent(c.ws)}&select=payload`, {headers:cloudHeaders()});
        if(chk.ok){
          const rows = await chk.json();
          const remote = rows.length? rows[0].payload : null;
          const remoteCount = remote? ((remote.quotes||[]).length + (remote.clients||[]).length) : 0;
          if(remoteCount > 0){
            state.blockedPush = true;
            if(!silent) toast('내 기기가 비어 있어 업로드를 막았어요. 최신자료 받기를 먼저 하세요.','warn');
            setCloudBadge('업로드 보류');
            return {ok:false, msg:'빈 자료 업로드 차단(서버 '+remoteCount+'건 보호)'};
          }
        }
      }catch(e){ /* 확인 실패 시엔 아래 정상 경로로 진행 */ }
    }
  }

  // [안전장치 E] 저장 직전 서버 최신본과 병합 — 상대가 추가한 자료를 지우지 않음
  let merged = payload;
  if(!force){
    try{
      const cur = await fetch(`${c.url}/rest/v1/${CLOUD_TABLE}?workspace=eq.${encodeURIComponent(c.ws)}&select=payload,updated_at`, {headers:cloudHeaders()});
      if(cur.ok){
        const rows = await cur.json();
        if(rows.length && rows[0].payload){
          const stamp = rows[0].updated_at;
          // 내가 마지막으로 본 서버 시각과 다르면 = 그사이 누가 저장함 → 병합
          if(!state.cloud.remoteStamp || stamp !== state.cloud.remoteStamp){
            merged = mergePayload(payload, rows[0].payload);
            const added = merged.quotes.length - (payload.quotes||[]).length;
            if(added > 0 && !silent) toast('다른 기기에서 추가된 '+added+'건을 함께 보존했어요','ok');
          }
        }
      }
    }catch(e){ /* 확인 실패 시 내 자료 그대로 저장 */ }
  }

  try{
    const nowStamp = new Date().toISOString();
    const body=[{workspace:c.ws, payload:merged, updated_at:nowStamp}];
    const r = await fetch(`${c.url}/rest/v1/${CLOUD_TABLE}?on_conflict=workspace`, {
      method:'POST',
      headers:{...cloudHeaders(), 'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(body)
    });
    if(!r.ok){ const t=await r.text(); throw new Error('서버 응답 '+r.status+' '+t.slice(0,80)); }
    state.cloud.lastSync = nowStamp;
    state.cloud.remoteStamp = nowStamp;
    state.pendingSync = false;
    __lastPushSig=sig;
    await store.set('cloud', state.cloud);
    await store.set('pendingSync', false);
    if(merged !== payload){ await applyPayload(merged); render(); }
    if(!silent) toast('클라우드에 저장했어요','ok');
    updateCloudBadge();
    return {ok:true, msg:'저장 완료'};
  }catch(e){
    // [안전장치 B] 실패하면 '미저장' 표시 + 자동 재시도 예약
    state.pendingSync = true;
    try{ await store.set('pendingSync', true); }catch(x){}
    setCloudBadge('미저장 — 재시도 중');
    scheduleRetry();
    if(!silent) toast('클라우드 저장 실패: '+e.message,'warn');
    return {ok:false, msg:e.message};
  }
}

let _retryTimer=null;
function scheduleRetry(){
  clearTimeout(_retryTimer);
  _retryTimer = setTimeout(async ()=>{
    if(!cloudOn() || !state.pendingSync) return;
    const r = await cloudPush(true);
    if(!r.ok) scheduleRetry();
    else toast('미저장 자료를 올렸어요','ok');
  }, 20000);
}

let _pushTimer=null;
function scheduleCloudPush(){
  if(!cloudOn()) return;
  try{ __myPushAt = Date.now(); }catch(e){}   // Realtime 메아리 방지용 표시
  clearTimeout(_pushTimer);
  setCloudBadge('저장 중...');
  _pushTimer=setTimeout(async ()=>{
    const r=await cloudPush(true);
    setCloudBadge(r.ok? '동기화됨' : '저장 실패');
  }, 1200);
}
function setCloudBadge(txt){
  const el=document.getElementById('cloudBadge');
  if(el) el.textContent = txt;
}
function updateCloudBadge(){
  if(!cloudOn()) return;
  if(state.pendingSync){ setCloudBadge('미저장 있음'); return; }
  const t=state.cloud.lastSync? new Date(state.cloud.lastSync) : null;
  setCloudBadge(t? '동기화 '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0') : '동기화됨');
}

const APP_BUILD = 'V42.0-2026-07-30';
async function checkNewVersion(){
  // http/https 환경에서만 버전 체크 (file:// 등에서는 콘솔 에러 방지)
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const r = await fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const txt = await r.text();
    const m = txt.match(new RegExp("const APP_BUILD = '([^']+)'"));
    if(m && m[1] !== APP_BUILD){
      state.newVersion = m[1];
      showUpdateBar();
    }
  }catch(e){ /* 오프라인이면 무시 */ }
}
function showUpdateBar(){
  if(document.getElementById('updBar')) return;
  const d=document.createElement('div');
  d.id='updBar';
  d.innerHTML = '<span>새 버전이 나왔어요. 새로고침하면 최신 기능으로 바뀝니다.</span>'+
                '<button id="updNow">지금 새로고침</button><button id="updLater">나중에</button>';
  document.body.appendChild(d);
  document.getElementById('updNow').addEventListener('click', ()=>location.reload(true));
  document.getElementById('updLater').addEventListener('click', ()=>d.remove());
}

function warrantyEnd(qid){
  const inst = getInstall(qid);
  const j = getJob(qid);
  const base = inst.doneDate || (j.step==='시공완료'? j.installDate : '');
  if(!base) return '';
  const d = new Date(base);
  if(isNaN(d)) return '';
  d.setFullYear(d.getFullYear()+1);
  return d.toISOString().slice(0,10);
}
function warrantyStatus(qid){
  const end = warrantyEnd(qid);
  if(!end) return {end:'', label:'미시공', days:null};
  const today = new Date(todayStr());
  const e = new Date(end);
  const days = Math.round((e-today)/86400000);
  if(days < 0) return {end, label:'보증만료', days};
  if(days <= 30) return {end, label:'만료임박', days};
  return {end, label:'보증중', days};
}

/* 도장 이미지: 220px 정사각 축소 */
function compressSeal(file){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>{ const im=new Image();
      im.onload=()=>{ const S=220; const cv=document.createElement('canvas'); cv.width=S; cv.height=S;
        const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,S,S);
        const r=Math.min(S/im.width,S/im.height), w=im.width*r, h=im.height*r;
        ctx.drawImage(im,(S-w)/2,(S-h)/2,w,h);
        res(cv.toDataURL('image/jpeg',0.8)); };
      im.onerror=rej; im.src=rd.result; };
    rd.onerror=rej; rd.readAsDataURL(file);
  });
}

// 사진을 폰 저장용으로 축소·압축 (가로 최대 1100px, JPEG 품질 0.62)
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const max = 1100;
        let w = img.width, h = img.height;
        if(w > max || h > max){
          if(w >= h){ h = Math.round(h * max / w); w = max; }
          else { w = Math.round(w * max / h); h = max; }
        }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', 0.62));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function computeStats(){
  const total = state.quotes.length;
  const contracted = state.quotes.filter(q=>q.status==='계약'||q.status==='시공완료');
  const contractRate = total? Math.round(contracted.length/total*100):0;
  const thisMonth = monthKey(todayStr());
  const monthSales = state.quotes.filter(q=>(q.status==='계약'||q.status==='시공완료') && monthKey(q.date)===thisMonth)
    .reduce((s,q)=>s+linesTotal(q),0);
  const monthQuotes = state.quotes.filter(q=>monthKey(q.date)===thisMonth).length;
  const totalUnpaid = contracted.reduce((s,q)=>s+(quoteTotal(q)-paidTotal(getPayment(q.id))),0);
  const todaySites = contracted.filter(q=>getJob(q.id).installDate===todayStr()).length;
  const openAs = state.asList.filter(a=>!a.done).length;
  const todayMfg = state.quotes.filter(q=>{const p=mfgProgress(q.id); return p.pct>0 && p.pct<100;}).length;
  const monthContract = state.quotes.filter(q=>(q.status==='계약'||q.status==='시공완료') && monthKey(q.date)===thisMonth)
    .reduce((s,q)=>s+quoteTotal(q),0);
  return {total, contracted:contracted.length, contractRate, monthSales, monthQuotes, totalUnpaid, todaySites, openAs, todayMfg, monthContract};
}

/* ===== 거래처 지도 (지역별 자동 표시) ===== */
function clientGeo(c){
  return geoOf(c.address, c.branch, c.name, c.chain);
}
function clientMapData(){
  const groups={}, noloc=[];
  (state.clients||[]).forEach(c=>{
    const g=clientGeo(c);
    if(!g){ noloc.push(c); return; }
    const key=g[0].toFixed(2)+','+g[1].toFixed(2);
    (groups[key]=groups[key]||{geo:g, list:[]}).list.push(c);
  });
  return { groups:Object.values(groups).sort((a,b)=>b.list.length-a.list.length), noloc };
}
function clientMapSVG(){
  const {groups}=clientMapData();
  const me=state.myGeo;
  const W=100, H=132, LNG0=125.5, LNG1=130.0, LAT0=33.0, LAT1=38.8;
  const px=g=>((g[1]-LNG0)/(LNG1-LNG0))*W, py=g=>((LAT1-g[0])/(LAT1-LAT0))*H;
  const outline=KR_OUTLINE.split(' ').map(p=>{const[lng,lat]=p.split(',').map(Number);return px([lat,lng]).toFixed(1)+','+py([lat,lng]).toFixed(1);}).join(' ');
  const maxN=Math.max(1,...groups.map(g=>g.list.length));
  const sel=state.mapRegion;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:420px;display:block;margin:0 auto">
    <polygon points="${outline}" fill="#EDF1F7" stroke="#B9C4D4" stroke-width="0.6"/>
    <ellipse cx="${px([33.42,126.55]).toFixed(1)}" cy="${py([33.42,126.55]).toFixed(1)}" rx="3.2" ry="1.8" fill="#EDF1F7" stroke="#B9C4D4" stroke-width="0.5"/>
    ${me? `<circle cx="${px(me).toFixed(1)}" cy="${py(me).toFixed(1)}" r="4" fill="#B3311C" opacity=".22"/><circle cx="${px(me).toFixed(1)}" cy="${py(me).toFixed(1)}" r="1.8" fill="#B3311C"/><text x="${px(me).toFixed(1)}" y="${(py(me)-3.2).toFixed(1)}" font-size="3.2" text-anchor="middle" fill="#B3311C" font-weight="700">내 위치</text>`:''}
    ${groups.map(g=>{
      const n=g.list.length, r=2+Math.sqrt(n/maxN)*3.2;
      const x=px(g.geo).toFixed(1), y=py(g.geo).toFixed(1);
      const key=g.geo[0].toFixed(2)+','+g.geo[1].toFixed(2);
      const on = sel===key;
      return `<g class="cmapDot" data-k="${key}" style="cursor:pointer">
        <circle cx="${x}" cy="${y}" r="${(r+1.6).toFixed(1)}" fill="${on?'#F0A020':'#1F3864'}" opacity=".18"/>
        <circle cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="${on?'#C87F1E':'#1F3864'}"/>
        <text x="${x}" y="${(+y+1.1).toFixed(1)}" font-size="${Math.min(3.4,r*1.1).toFixed(1)}" text-anchor="middle" fill="#fff" font-weight="700">${n}</text>
      </g>`;
    }).join('')}
  </svg>`;
}

        <span style="margin-left:auto;font-size:11.5px;color:var(--navy)">주소 입력 ›</span></div>`).join('')}
    </div>`:''}`;
}

function renderPay(){
  const contracted = state.quotes.filter(q=>q.status==='계약'||q.status==='시공완료');
  let list = contracted.map(q=>{
    const p = getPayment(q.id);
    const paid = paidTotal(p);
    const unpaid = quoteTotal(q) - paid;
    return {q, p, paid, unpaid};
  });
  if(state.payFilter==='미완료') list = list.filter(x=>x.unpaid>0);
  else if(state.payFilter==='완납') list = list.filter(x=>x.unpaid<=0);
  list.sort((a,b)=>(b.q.date||'').localeCompare(a.q.date||''));

  const totalContract = contracted.reduce((s,q)=>s+quoteTotal(q),0);
  const totalPaid = contracted.reduce((s,q)=>s+paidTotal(getPayment(q.id)),0);
  const totalUnpaid = totalContract - totalPaid;

  return `
    <div class="topbar"><h1>수금관리</h1></div>
    ${contracted.length===0? `<div class="banner">아직 계약 상태의 견적이 없어요. 견적관리에서 상태를 "계약"으로 바꾸면 여기에 자동으로 나타나 계약금·잔금·미수금을 관리할 수 있어요.</div>` : `
    <div class="cards">
      <div class="card"><div class="label">계약 총액(VAT포함)</div><div class="value">${fmt(totalContract)}</div><div class="sub">${contracted.length}건</div></div>
      <div class="card"><div class="label">수금 완료</div><div class="value" style="color:var(--green)">${fmt(totalPaid)}</div></div>
      <div class="card"><div class="label">미수금</div><div class="value" style="color:var(--red)">${fmt(totalUnpaid)}</div></div>
      <div class="card"><div class="label">수금률</div><div class="value">${totalContract? Math.round(totalPaid/totalContract*100):0}%</div></div>
    </div>
    <div class="panel">
      <div class="chips">
        ${['미완료','완납','전체'].map(f=>`<button class="chip ${state.payFilter===f?'active':''}" data-payfilter="${f}">${f}</button>`).join('')}
        <div style="margin-left:auto; font-size:12px; color:var(--text-mute); align-self:center">${list.length}건</div>
      </div>
      ${list.length===0? '<div class="empty">해당하는 건이 없어요.</div>' : `
      <table>
        <tr><th>날짜</th><th>거래처</th><th style="text-align:right">계약금액(VAT포함)</th><th style="text-align:right">수금액</th><th style="text-align:right">미수금</th><th style="text-align:center">진행</th><th></th></tr>
        ${list.map(({q,paid,unpaid})=>{
          const pct = quoteTotal(q)? Math.round(paid/quoteTotal(q)*100):0;
          return `<tr>
            <td data-l="날짜">${q.date}</td>
            <td data-l="거래처" style="font-weight:600">${esc(q.client)}</td>
            <td data-l="계약금액" class="amt">${fmt(quoteTotal(q))}</td>
            <td data-l="수금액" class="amt" style="color:var(--green)">${fmt(paid)}</td>
            <td data-l="미수금" class="amt" style="color:${unpaid>0?'var(--red)':'var(--text-mute)'}; font-weight:700">${unpaid>0?fmt(unpaid):'완납'}</td>
            <td data-l="진행" style="width:110px;">
              <div style="background:#EEF1F7; border-radius:6px; height:8px; overflow:hidden;"><div style="width:${Math.min(pct,100)}%; height:100%; background:${pct>=100?'var(--green)':'var(--navy)'}"></div></div>
              <div style="font-size:10px; color:var(--text-mute); text-align:center; margin-top:2px">${pct}%</div>
            </td>
            <td data-l=""><button class="btn secondary payBtn" data-id="${q.id}" style="padding:5px 10px; font-size:12px;">입금관리</button></td>
          </tr>`;
        }).join('')}
      </table>`}
    </div>`}
  `;
}

/* ===== 작업관리 통합 뷰 (작업·제작 · 시공 · A/S 한 화면) ===== */
function workSegBar(active, extra){
  const segs=[['작업','🛠 작업·시공'],['제작','⚙ 제작공정'],['AS','🔧 A/S']];
  return `<div class="topbar"><h1>작업관리</h1>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      ${segs.map(([t,l])=>`<button class="btn ${active===t?'':'secondary'} workSeg" data-t="${t}">${l}</button>`).join('')}
      ${extra||''}
    </div></div>`;
}
function renderWork(){
  if(!state.workTab) state.workTab='작업';
  if(!state.workFilter) state.workFilter='전체';
  if(state.workTab==='제작') return renderMfg();
  if(state.workTab==='AS')  return renderAs();
  return workSegBar('작업') + renderWorkMain();
}
function renderWorkMain(){
  const contracted = state.quotes.filter(q=>q.status==='계약'||q.status==='시공완료');
  const today = todayStr();
  const f = state.workFilter||'전체';
  // A/S를 현장(거래처)별로 묶기 — 카드 안에 이력으로 보여주려고
  const asByClient={};
  state.asList.forEach(a=>{ (asByClient[a.client]=asByClient[a.client]||[]).push(a); });

  let list = contracted.map(q=>({q, j:getJob(q.id), prog:mfgProgress(q.id)}));
  if(f==='제작') list=list.filter(x=>x.j.step==='대기'||x.j.step==='제작중');
  else if(f==='시공대기') list=list.filter(x=>x.j.step==='시공대기');
  else if(f==='시공완료') list=list.filter(x=>x.j.step==='시공완료');
  list.sort((a,b)=>(a.j.installDate||'9999').localeCompare(b.j.installDate||'9999'));

  const todayCount = contracted.filter(q=>getJob(q.id).installDate===today && getJob(q.id).step!=='시공완료').length;
  const overdueCount = contracted.filter(q=>{const j=getJob(q.id); return j.installDate && j.installDate<today && j.step!=='시공완료';}).length;
  const mfgCount = contracted.filter(q=>{const p=mfgProgress(q.id); return p.pct>0 && p.pct<100;}).length;
  const waitCount = contracted.filter(q=>getJob(q.id).step==='시공대기').length;
  const doneCount = contracted.filter(q=>getJob(q.id).step==='시공완료').length;
  const asOpen = state.asList.filter(a=>!a.done).length;

  const wjs = (state.workJobs||[]).slice().sort((a,b)=>(((b.plan||b.done||'')+'')).localeCompare(((a.plan||a.done||'')+'')));
  const addBtn = `<div style="display:flex; justify-content:flex-end; margin-bottom:12px"><button class="btn" id="wjAddBtn">+ 작업 직접 추가</button></div>`;
  const wjCard = w=>`
    <div class="inst-card" style="margin-bottom:12px; border-left:3px solid var(--amber)">
      <div class="inst-head">
        <div style="min-width:0">
          <div style="font-weight:700; display:flex; gap:6px; align-items:center; flex-wrap:wrap">
            ${esc(w.client||'(거래처 미입력)')}
            <span class="badge" style="background:var(--amber-bg); color:#7A4E0E">직접입력</span>
            ${w.step==='완료'?'<span class="badge 완료">완료</span>':(w.step&&w.step!=='예정')?`<span class="badge">${esc(w.step)}</span>`:''}
          </div>
          <div style="font-size:12px; margin-top:3px">${w.site? `<a href="#" class="mapBtn" data-a="${esc(w.site)}" style="color:var(--navy); text-decoration:none; border-bottom:1px dashed var(--navy)">📍 ${esc(w.site)}</a>`:'<span style="color:var(--text-mute)">현장 미입력</span>'}</div>
          <div style="font-size:12px; color:var(--text-mute); margin-top:2px">시공예정 <b>${w.plan||'미정'}</b>${w.done?` · 완료 <b style="color:var(--green)">${w.done}</b>`:''}${w.amount?` · ${Number(w.amount).toLocaleString()}원`:''}${w.quoteId?' · 🔗견적연결':''}</div>
          ${w.memo? `<div style="font-size:12px; color:var(--text-mute); margin-top:3px">📝 ${esc(w.memo)}</div>`:''}
        </div>
        <div style="flex-shrink:0; display:flex; gap:5px; align-items:flex-start">
          <button class="btn secondary wjEdit" data-id="${w.id}" style="padding:8px 12px; min-height:38px">수정</button>
        </div>
      </div>
    </div>`;
  const standaloneSection = wjs.length? `
    <div class="panel">
      <div style="font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:6px">🖊 직접 추가한 작업 <span style="font-weight:400; color:var(--text-mute); font-size:12px">(견적 없이 기록한 것 · ${wjs.length}건)</span></div>
      ${wjs.map(wjCard).join('')}
    </div>` : '';

  if(contracted.length===0){
    return addBtn + standaloneSection + `<div class="banner">계약된 건이 아직 없어요. 견적관리에서 상태를 "계약"으로 바꾸면 여기 작업으로 자동 생성돼요. 견적 없이 시공만 기록하려면 위 <b>+ 작업 직접 추가</b>를 쓰세요.</div>`;
  }
  return `
    ${addBtn}
    <div class="cards">
      <div class="card"><div class="label">오늘 시공</div><div class="value" style="color:${todayCount?'var(--amber)':'var(--text-mute)'}">${todayCount}건</div></div>
      <div class="card"><div class="label">지연</div><div class="value" style="color:${overdueCount?'var(--red)':'var(--text-mute)'}">${overdueCount}건</div></div>
      <div class="card"><div class="label">제작 중</div><div class="value">${mfgCount}건</div></div>
      <div class="card"><div class="label">시공 대기</div><div class="value">${waitCount}건</div></div>
      <div class="card"><div class="label">시공 완료</div><div class="value" style="color:var(--green)">${doneCount}건</div></div>
      <div class="card"><div class="label">A/S 미완료</div><div class="value" style="color:${asOpen?'var(--red)':'var(--text-mute)'}">${asOpen}건</div></div>
    </div>
    <div class="banner">한 카드에서 <b>상태 변경 · 제작 체크 · 시공/사진 · A/S</b>까지 전부 처리돼요. 6개 공정을 다 체크하면 자동으로 <b>시공대기</b>로 넘어갑니다.</div>
    ${standaloneSection}
    <div class="panel">
      <div class="chips">
        ${['전체','제작','시공대기','시공완료'].map(x=>`<button class="chip ${f===x?'active':''}" data-workfilter="${x}">${x}</button>`).join('')}
        <div style="margin-left:auto; font-size:12px; color:var(--text-mute); align-self:center">${list.length}건</div>
      </div>
      ${list.length===0? '<div class="empty">해당하는 작업이 없어요.</div>' : list.map(({q,j,prog})=>{
        const m=getMfg(q.id); const inst=getInstall(q.id);
        const isToday=j.installDate===today, isOver=j.installDate&&j.installDate<today&&j.step!=='시공완료', isDone=j.step==='시공완료';
        const asList=(asByClient[q.client]||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
        const openAs=asList.filter(a=>!a.done).length;
        return `
        <div class="inst-card ${isToday?'today':''} ${isDone?'done':''}" style="margin-bottom:12px">
          <div class="inst-head">
            <div style="min-width:0">
              <div style="font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                ${esc(q.client)}
                ${isToday&&!isDone?'<span class="badge" style="background:var(--amber-bg); color:#7A4E0E;">오늘</span>':''}
                ${isOver?'<span class="badge 미성사">지연</span>':''}
                ${isDone?'<span class="badge 완료">완료</span>':''}
                ${openAs?`<span class="badge" style="background:var(--red-bg); color:var(--red)">A/S ${openAs}</span>`:''}
              </div>

function renderJobs(){
  if(state.jobTab==='제작') return renderMfg();
  const contracted = state.quotes.filter(q=>q.status==='계약'||q.status==='시공완료');
  let list = contracted.map(q=>({q, j:getJob(q.id)}));
  if(state.jobFilter==='진행중') list = list.filter(x=>x.j.step!=='시공완료');
  else if(state.jobFilter==='완료') list = list.filter(x=>x.j.step==='시공완료');
  list.sort((a,b)=>{
    const ad=a.j.installDate||'9999', bd=b.j.installDate||'9999';
    return ad.localeCompare(bd);
  });

  const counts = {};
  JOB_STEPS.forEach(st=> counts[st] = contracted.filter(q=>getJob(q.id).step===st).length);
  const today = todayStr();
  const todayJobs = contracted.filter(q=>getJob(q.id).installDate===today).length;

  return `
    <div class="topbar"><h1>작업·제작</h1>
      <div style="display:flex;gap:6px">
        <button class="btn ${state.jobTab!=='제작'?'':'secondary'} jobTabBtn" data-t="작업">📋 작업 단계</button>
        <button class="btn ${state.jobTab==='제작'?'':'secondary'} jobTabBtn" data-t="제작">⚙ 제작 공정</button>
      </div></div>
    ${contracted.length===0? `<div class="banner">계약된 견적이 아직 없어요. 견적관리에서 상태를 "계약"으로 바꾸면 작업이 자동 생성됩니다.</div>` : `
    <div class="cards">
      <div class="card"><div class="label">오늘 시공 현장</div><div class="value" style="color:${todayJobs?'var(--amber)':'var(--text-mute)'}">${todayJobs}건</div></div>
      ${JOB_STEPS.map(st=>`<div class="card"><div class="label">${st}</div><div class="value">${counts[st]}건</div></div>`).join('')}
    </div>
    <div class="panel">
      <div class="chips">
        ${['진행중','완료','전체'].map(f=>`<button class="chip ${state.jobFilter===f?'active':''}" data-jobfilter="${f}">${f}</button>`).join('')}
        <div style="margin-left:auto; font-size:12px; color:var(--text-mute); align-self:center">${list.length}건</div>
      </div>
      ${list.length===0? '<div class="empty">해당하는 작업이 없어요.</div>' : `
      <table>
        <tr><th>작업번호</th><th>거래처</th><th>현장</th><th>시공일</th><th>담당자</th><th>진행상태</th><th></th></tr>
        ${list.map(({q,j})=>{
          const isToday = j.installDate===today;
          const overdue = j.installDate && j.installDate < today && j.step!=='시공완료';
          return `<tr>
            <td data-l="작업번호" class="qnum">${j.jobNo || makeJobNo(q)}</td>
            <td data-l="거래처" style="font-weight:600">${esc(q.client)}</td>
            <td data-l="현장">${(j.site||q.region)? `<a href="#" class="mapBtn" data-a="${esc(j.site||q.region)}" style="color:var(--navy);text-decoration:none;border-bottom:1px dashed var(--navy)">📍 ${esc(j.site||q.region)}</a>`:'<span style="color:var(--text-mute)">미입력</span>'}</td>
            <td data-l="시공일">${j.installDate? `<span style="${isToday?'color:var(--amber); font-weight:700':overdue?'color:var(--red); font-weight:700':''}">${j.installDate}${isToday?' (오늘)':overdue?' (지연)':''}</span>` : '<span style="color:var(--text-mute)">미정</span>'}</td>
            <td data-l="담당자">${j.manager||'<span style="color:var(--text-mute)">-</span>'}</td>
            <td data-l="진행상태">
              <select class="status-select jobStep" data-id="${q.id}">
                ${JOB_STEPS.map(st=>`<option ${j.step===st?'selected':''}>${st}</option>`).join('')}
              </select>
            </td>
            <td data-l="" class="qbtns"><button class="btn secondary jobBtn" data-id="${q.id}" style="padding:5px 10px; font-size:12px;">상세</button><button class="btn secondary woBtn" data-id="${q.id}" style="padding:5px 9px;font-size:12px" title="작업지시서">🖨</button></td>
          </tr>`;
        }).join('')}
      </table>`}
    </div>`}
  `;
}

function renderMfg(){
  const contracted = state.quotes.filter(q=>q.status==='계약'||q.status==='시공완료');
  let list = contracted.map(q=>({q, prog:mfgProgress(q.id), j:getJob(q.id)}));
  if(state.mfgFilter==='진행중') list = list.filter(x=>x.prog.pct<100);
  else if(state.mfgFilter==='완료') list = list.filter(x=>x.prog.pct===100);
  list.sort((a,b)=>{
    const ad=a.j.installDate||'9999', bd=b.j.installDate||'9999';
    return ad.localeCompare(bd);
  });

  const inProgress = contracted.filter(q=>{const p=mfgProgress(q.id); return p.pct>0 && p.pct<100;}).length;
  const notStarted = contracted.filter(q=>mfgProgress(q.id).pct===0).length;
  const done = contracted.filter(q=>mfgProgress(q.id).pct===100).length;

  return `
    ${workSegBar('제작')}
    ${contracted.length===0? `<div class="banner">계약된 건이 없어요. 견적관리에서 상태를 "계약"으로 바꾸면 제작 공정을 관리할 수 있어요.</div>` : `
    <div class="cards">
      <div class="card"><div class="label">제작 대기</div><div class="value">${notStarted}건</div></div>
      <div class="card"><div class="label">제작 중</div><div class="value" style="color:var(--amber)">${inProgress}건</div></div>
      <div class="card"><div class="label">출고 완료</div><div class="value" style="color:var(--green)">${done}건</div></div>
      <div class="card"><div class="label">전체</div><div class="value">${contracted.length}건</div></div>
    </div>
    <div class="banner">공정을 체크하면 진행률이 자동 계산되고, 6개 공정이 모두 끝나면 작업관리 상태가 "시공대기"로 자동 변경됩니다.</div>
    <div class="panel">
      <div class="chips">
        <button class="chip ${state.mfgView==='kanban'?'active':''}" id="mfgKan">📋 칸반보드</button>
        <button class="chip ${state.mfgView!=='kanban'?'active':''}" id="mfgList">☰ 목록</button>
        <span style="width:10px"></span>
        ${state.mfgView==='kanban'? '' : ['진행중','완료','전체'].map(f=>`<button class="chip ${state.mfgFilter===f?'active':''}" data-mfgfilter="${f}">${f}</button>`).join('')}
        <div style="margin-left:auto; font-size:12px; color:var(--text-mute); align-self:center">${list.length}건</div>
      </div>
      ${state.mfgView==='kanban'? renderKanban() : (list.length===0? '<div class="empty">해당하는 건이 없어요.</div>' : list.map(({q,prog,j})=>{
        const m = getMfg(q.id);
        return `
        <div class="mfg-card">
          <div class="mfg-head">
            <div>
              <div style="font-weight:700">${q.client}</div>
              <div style="font-size:12px; color:var(--text-mute); margin-top:2px">${j.jobNo||makeJobNo(q)} · 시공일 ${j.installDate||'미정'}</div>
            </div>
            <div style="text-align:right; flex-shrink:0;">
              <div style="font-size:17px; font-weight:700; color:${prog.pct===100?'var(--green)':'var(--navy)'}">${prog.pct}%</div>
              <div style="font-size:11px; color:var(--text-mute)">${prog.done}/${prog.total} 공정</div>
            </div>
          </div>
          <div class="mfg-bar"><div style="width:${prog.pct}%; background:${prog.pct===100?'var(--green)':'var(--navy)'}"></div></div>
          <div class="mfg-steps">
            ${MFG_STEPS.map(st=>`
              <label class="mfg-step ${m[st]?'on':''}">
                <input type="checkbox" class="mfgChk" data-id="${q.id}" data-step="${st}" ${m[st]?'checked':''}>
                <span>${st}</span>
              </label>`).join('')}
          </div>
        </div>`;
      }).join(''))}
    </div>`}
  `;
}

function renderInstall(){
  const contracted = state.quotes.filter(q=>q.status==='계약'||q.status==='시공완료');
  const today = todayStr();
  let list = contracted.map(q=>({q, j:getJob(q.id), inst:getInstall(q.id)}));
  if(state.instFilter==='예정') list = list.filter(x=>x.j.step!=='시공완료');
  else if(state.instFilter==='완료') list = list.filter(x=>x.j.step==='시공완료');
  list.sort((a,b)=>{
    const ad=a.j.installDate||'9999', bd=b.j.installDate||'9999';
    return state.instFilter==='완료'? bd.localeCompare(ad) : ad.localeCompare(bd);
  });

  const todayCount = contracted.filter(q=>getJob(q.id).installDate===today && getJob(q.id).step!=='시공완료').length;
  const overdue = contracted.filter(q=>{const j=getJob(q.id); return j.installDate && j.installDate<today && j.step!=='시공완료';}).length;
  const doneCount = contracted.filter(q=>getJob(q.id).step==='시공완료').length;
  const photoTotal = contracted.reduce((s,q)=>s+(getInstall(q.id).photoCount||0),0);

  return `
    <div class="topbar"><h1>시공관리</h1></div>
    ${contracted.length===0? `<div class="banner">계약된 건이 없어요. 견적관리에서 상태를 "계약"으로 바꾸면 시공 현장이 여기에 나타납니다.</div>` : `
    <div class="cards">
      <div class="card"><div class="label">오늘 시공</div><div class="value" style="color:${todayCount?'var(--amber)':'var(--text-mute)'}">${todayCount}건</div></div>
      <div class="card"><div class="label">지연</div><div class="value" style="color:${overdue?'var(--red)':'var(--text-mute)'}">${overdue}건</div></div>
      <div class="card"><div class="label">시공 완료</div><div class="value" style="color:var(--green)">${doneCount}건</div></div>
      <div class="card"><div class="label">현장 사진</div><div class="value">${photoTotal}장</div></div>
    </div>
    <div class="panel">
      <div class="chips">
        ${['예정','완료','전체'].map(f=>`<button class="chip ${state.instFilter===f?'active':''}" data-instfilter="${f}">${f}</button>`).join('')}
        <div style="margin-left:auto; font-size:12px; color:var(--text-mute); align-self:center">${list.length}건</div>
      </div>
      ${list.length===0? '<div class="empty">해당하는 현장이 없어요.</div>' : list.map(({q,j,inst})=>{
        const isToday = j.installDate===today;
        const isOver = j.installDate && j.installDate<today && j.step!=='시공완료';
        const isDone = j.step==='시공완료';
        return `
        <div class="inst-card ${isToday?'today':''} ${isDone?'done':''}">
          <div class="inst-head">
            <div style="min-width:0">
              <div style="font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                ${q.client}
                ${isToday&&!isDone?'<span class="badge" style="background:var(--amber-bg); color:#7A4E0E;">오늘</span>':''}
                ${isOver?'<span class="badge 미성사">지연</span>':''}
                ${isDone?'<span class="badge 완료">완료</span>':''}
              </div>
              <div style="font-size:12px; margin-top:3px">${(j.site||q.region)? `<a href="#" class="mapBtn" data-a="${esc(j.site||q.region)}" style="color:var(--navy); text-decoration:none; border-bottom:1px dashed var(--navy)">📍 ${esc(j.site||q.region)}</a>` : '<span style="color:var(--text-mute)">현장주소 미입력</span>'}</div>
              <div style="font-size:12px; color:var(--text-mute); margin-top:2px">
                시공일 ${j.installDate||'미정'}${inst.driver? ' · 기사 '+inst.driver:''}${inst.vehicle? ' · '+inst.vehicle:''}
              </div>
            </div>
            <div style="flex-shrink:0; text-align:right;">
              ${inst.photoCount? `<div style="font-size:12px; color:var(--navy); font-weight:700">📷 ${inst.photoCount}장</div>`:'<div style="font-size:12px; color:var(--text-mute)">사진 없음</div>'}
            </div>
          </div>
          <div class="inst-actions">
            <button class="btn secondary instBtn" data-id="${q.id}" style="flex:1; padding:9px;">현장 상세 · 사진</button>
            <button class="btn secondary icBtn" data-id="${q.id}" style="flex:1; padding:9px;">🖨 설치확인서</button>
            ${!isDone? `<button class="btn instDoneBtn" data-id="${q.id}" style="flex:1; padding:9px;">시공 완료 처리</button>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>`}
  `;
}

function downloadCSV(filename, rows){
  const esc = v => {
    const t = (v===null||v===undefined)? '' : String(v);
    return /[",\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
  };
  const csv = rows.map(r=>r.map(esc).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});  // BOM: 엑셀 한글 깨짐 방지
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

function exportQuotesCSV(){
  const rows = [['견적번호','날짜','거래처','지역','공사명','품목수','공급가액','부가세','합계','상태','계약금액','수금액','미수금']];
  state.quotes.forEach(q=>{
    const sum = linesTotal(q), vat = Math.round(sum*0.1);
    const isC = q.status==='계약'||q.status==='시공완료';
    const paid = isC? paidTotal(getPayment(q.id)) : 0;
    rows.push([q.qnum,q.date,q.client,q.region||'',q.item||'',qLines(q).length,sum,vat,sum+vat,q.status,
               isC? sum:'', isC? paid:'', isC? sum-paid:'']);
  });
  downloadCSV('HM_견적대장_'+todayStr()+'.csv', rows); toast('견적대장 파일을 내려받았어요','ok');
}

function canManageNotice(){ return true; }  // 3인 회사 — 모두 공지 관리 가능
function noticeById(id){ return (state.notices||[]).find(n=>n.id===id); }
function sortedNotices(){
  let list=(state.notices||[]).slice();
  const kw=(state.noticeSearch||'').trim().toLowerCase();
  if(kw) list=list.filter(n=> (n.title||'').toLowerCase().includes(kw) || (n.body||'').toLowerCase().includes(kw) || (n.author||'').toLowerCase().includes(kw) || (n.createdAt||'').slice(0,10).includes(kw));
  const s=state.noticeSort;
  list.sort((a,b)=>{
    if(s==='중요공지 우선'){ const p=(b.pinned?2:0)+(b.important?1:0)-((a.pinned?2:0)+(a.important?1:0)); if(p) return p; }
    if(s==='작성자순'){ const c=(a.author||'').localeCompare(b.author||''); if(c) return c; }
    if(s==='오래된순') return (a.createdAt||'').localeCompare(b.createdAt||'');
    return (b.createdAt||'').localeCompare(a.createdAt||'');
  });
  const pinned=list.filter(n=>n.pinned && !n.draft);
  const rest=list.filter(n=>!(n.pinned && !n.draft));
  return pinned.concat(rest);
}

async function doBackup(withPhotos){
  const photos = {};
  if(withPhotos!==false){
  for(const q of state.quotes){
    try{ const ph = await loadPhotos(q.id); if(ph && ph.length) photos[q.id]=ph; }catch(e){}
  }
  for(const a of state.asList){
    try{ const ph = await loadPhotos('as_'+a.id); if(ph && ph.length) photos['as_'+a.id]=ph; }catch(e){}
  }
  }
  const payload = {
    _app:'HM SIGN ERP', _version:1, _date:new Date().toISOString(),
    quotes:state.quotes, clients:state.clients, items:state.items,
    payments:state.payments, jobs:state.jobs, mfg:state.mfg,
    install:state.install, asList:state.asList, photos,
    workJobs:state.workJobs||[]
  };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (withPhotos===false? 'HM_SIGN_자료백업_' : 'HM_SIGN_전체백업_')+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  state.lastBackup=todayStr();
  try{ await store.set('lastBackup', state.lastBackup); }catch(e){}
  scheduleCloudPush();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  const msg = document.getElementById('backupMsg');
  if(msg) msg.innerHTML = '<span style="color:var(--green); font-weight:700">백업 파일을 내려받았어요.</span> 카톡 나에게 보내기나 클라우드에 보관해 두세요.';
  const mb = (blob.size/1024/1024);
  toast('백업 완료 ('+(mb<1? (blob.size/1024).toFixed(0)+' KB' : mb.toFixed(1)+' MB')+')','ok');
}

async function doRestore(file){
  const msg = document.getElementById('backupMsg');
  try{
    const text = await file.text();
    await doRestoreText(text, msg);
  }catch(e){
    if(msg) msg.innerHTML = '<span style="color:var(--red)">복원 실패: '+esc(e.message)+'</span>';
  }
}

async function doRestoreText(text, msg){
  try{
    const d = JSON.parse(text);
    if(!d || d._app!=='HM SIGN ERP') throw new Error('형식이 올바르지 않은 파일이에요.');
    if(!confirm('현재 자료를 백업 파일 내용으로 덮어씁니다. 계속할까요?')) return;
    state.quotes = d.quotes||[]; state.clients = d.clients||[]; state.items = d.items||[];
    state.payments = d.payments||{}; state.jobs = d.jobs||{}; state.mfg = d.mfg||{};
    state.install = d.install||{}; state.asList = d.asList||[];
    if(Array.isArray(d.workJobs)){ state.workJobs = d.workJobs; await store.set('workJobs', state.workJobs); }
    if(d.company){ state.company = d.company; await store.set('company', state.company); }
    await store.set('quotes', state.quotes); await store.set('clients', state.clients);
    await store.set('items', state.items); await store.set('payments', state.payments);
    await store.set('jobs', state.jobs); await store.set('mfg', state.mfg);
    await store.set('install', state.install); await store.set('aslist', state.asList);
    if(d.photos){ for(const [k,arr] of Object.entries(d.photos)){ try{ await savePhotos(k, arr); }catch(e){} } }
    state.gallery=null;
    if(msg) msg.innerHTML = '<span style="color:var(--green); font-weight:700">복원 완료!</span>';
    toast('복원했어요','ok');
    render();
  }catch(e){
    if(msg) msg.innerHTML = '<span style="color:var(--red)">복원 실패: '+e.message+'</span>';
  }
}

async function loadGallery(){
  state.galleryLoading = true;
  const groups = [];
  for(const q of state.quotes){
    const ph = await loadPhotos(q.id);
    if(ph && ph.length) groups.push({key:q.id, title:q.client, sub:(getJob(q.id).site||q.region||''), date:(getInstall(q.id).doneDate||getJob(q.id).installDate||q.date), photos:ph, kind:'현장'});
  }
  for(const a of state.asList){
    const ph = await loadPhotos('as_'+a.id);
    if(ph && ph.length) groups.push({key:'as_'+a.id, title:a.client, sub:'A/S · '+(a.type||''), date:a.date, photos:ph, kind:'A/S'});
  }
  groups.sort((x,y)=>(y.date||'').localeCompare(x.date||''));
  state.gallery = groups;
  state.galleryLoading = false;
  render();
}


/* ===== 사진 클라우드 공유 =====
   본문 자료와 분리해 사진만 별도 행(workspace: ws__photo__키)으로 저장.
   본문 동기화가 사진 때문에 느려지지 않게 분리했고, 필요한 현장만 골라 올린다. */
async function cloudPushPhotos(qid, silent){
  if(!cloudOn()) return {ok:false, msg:'클라우드 미설정'};
  const c=cloudCfg();
  try{
    const arr = await loadPhotos(qid);
    const body=[{workspace: c.ws+'__photo__'+qid, payload:{photos:arr}, updated_at:new Date().toISOString()}];
    const r = await fetch(`${c.url}/rest/v1/${CLOUD_TABLE}?on_conflict=workspace`, {
      method:'POST', headers:{...cloudHeaders(),'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(body)
    });
    if(!r.ok){ const t=await r.text(); throw new Error('서버 응답 '+r.status+' '+t.slice(0,60)); }
    const idx = state.photoShared || {};
    idx[qid] = arr.length;
    state.photoShared = idx;
    await store.set('photoShared', idx);
    if(!silent) toast(arr.length+'장을 가족과 공유했어요','ok');
    return {ok:true, n:arr.length};
  }catch(e){
    if(!silent) toast('사진 공유 실패: '+e.message,'warn');
    return {ok:false, msg:e.message};
  }
}
async function cloudPullPhotos(qid, silent){
  if(!cloudOn()) return {ok:false, msg:'클라우드 미설정'};
  const c=cloudCfg();
  try{
    const r = await fetch(`${c.url}/rest/v1/${CLOUD_TABLE}?workspace=eq.${encodeURIComponent(c.ws+'__photo__'+qid)}&select=payload`, {headers:cloudHeaders()});
    if(!r.ok) throw new Error('서버 응답 '+r.status);
    const rows = await r.json();
    if(!rows.length){ if(!silent) toast('공유된 사진이 없어요','warn'); return {ok:false, msg:'없음'}; }
    const remote = (rows[0].payload && rows[0].payload.photos) || [];
    const mine = await loadPhotos(qid);
    // 같은 시각·같은 데이터는 중복 제외하고 합치기
    const seen = new Set(mine.map(p=>(p.t||'')+'|'+(p.d||'').slice(0,60)));
    let added=0;
    remote.forEach(p=>{ const k=(p.t||'')+'|'+(p.d||'').slice(0,60); if(!seen.has(k)){ mine.push(p); added++; } });
    await savePhotos(qid, mine);
    if(!String(qid).startsWith('as_')){
      state.install[qid] = {...getInstall(qid), photoCount: mine.length};
      await saveInstall();
    }
    state.gallery=null;
    if(!silent) toast(added? added+'장을 받아왔어요' : '이미 최신이에요','ok');
    return {ok:true, added};
  }catch(e){
    if(!silent) toast('사진 받기 실패: '+e.message,'warn');
    return {ok:false, msg:e.message};
  }
}


/* ===== V2-1 통합검색 + 규칙기반 자연어 검색 ===== */
const NL_RULES = [
  {re:/오늘\s*(일정|할\s*일|스케[줄쥴])/, run:()=>nlToday(), label:'오늘 일정'},
  {re:/오늘\s*(시공|설치)/,   run:()=>nlInstall(0,0), label:'오늘 시공'},
  {re:/내일\s*(시공|설치)/,   run:()=>nlInstall(1,1), label:'내일 시공'},
  {re:/(이번\s*주|금주)\s*(시공|설치)/, run:()=>nlInstall(0,7), label:'이번주 시공'},
  {re:/오늘\s*제작/,          run:()=>nlMfg(), label:'오늘 제작'},
  {re:/(미수금|못\s*받은|안\s*들어온)/, run:()=>nlUnpaid(), label:'미수금'},
  {re:/(최근|요즘)\s*견적/,    run:()=>nlRecentQuotes(), label:'최근 견적'},
  {re:/(계약|수주)(된|한)?\s*(건|현장)?/, run:()=>nlContracted(), label:'계약 건'},
  {re:/(미완료|남은|진행중)?\s*a\/?s/i, run:()=>nlAs(), label:'A/S'},
  {re:/(보증|하자)\s*(만료|끝)/, run:()=>nlWarranty(), label:'보증 만료임박'},
  {re:/(이번\s*달|이달)\s*매출/, run:()=>nlMonthSales(), label:'이번달 매출'},
];
function dayShift(n){ const d=new Date(todayStr()+'T00:00'); d.setDate(d.getDate()+n); return ymd(d); }

function nlToday(){
  const t=todayStr(); const g=[];
  const inst=state.quotes.filter(q=>getJob(q.id).installDate===t && getJob(q.id).step!=='시공완료');
  if(inst.length) g.push({title:'🔴 오늘 시공', view:'install', rows:inst.map(q=>({main:q.client, sub:getJob(q.id).site||q.region||'', right:getJob(q.id).manager||''}))});
  const mfg=state.quotes.filter(q=>{const p=mfgProgress(q.id); return p.pct>0&&p.pct<100;});
  if(mfg.length) g.push({title:'🟠 제작 중', view:'mfg', rows:mfg.map(q=>({main:q.client, sub:mfgProgress(q.id).done+'/6 공정', right:getJob(q.id).installDate||''}))});
  const as=state.asList.filter(a=>!a.done);
  if(as.length) g.push({title:'🔵 미완료 A/S', view:'as', rows:as.map(a=>({main:a.client, sub:a.type+' · '+(a.content||''), right:a.date}))});
  const unpaid=state.quotes.filter(q=>(q.status==='계약'||q.status==='시공완료') && quoteTotal(q)-paidTotal(getPayment(q.id))>0);
  if(unpaid.length) g.push({title:'🟡 미수금', view:'pay', rows:unpaid.slice(0,8).map(q=>({main:q.client, sub:'', right:fmt(quoteTotal(q)-paidTotal(getPayment(q.id)))}))});
  return g.length? g : [{title:'오늘 예정된 일정이 없어요', rows:[]}];
}
function nlInstall(from,to){
  const a=dayShift(from), b=dayShift(to);
  const list=state.quotes.filter(q=>{const j=getJob(q.id); return j.installDate>=a && j.installDate<=b && j.step!=='시공완료';});
  return [{title:'시공 예정 '+list.length+'건', view:'install',
    rows:list.map(q=>({main:q.client, sub:getJob(q.id).site||q.region||'', right:getJob(q.id).installDate}))}];
}
function nlMfg(){
  const list=state.quotes.filter(q=>(q.status==='계약'||q.status==='시공완료') && mfgProgress(q.id).pct<100);
  return [{title:'제작 진행 '+list.length+'건', view:'mfg',
    rows:list.map(q=>({main:q.client, sub:mfgProgress(q.id).done+'/6 공정', right:getJob(q.id).installDate||'시공일 미정'}))}];
}
function nlUnpaid(){
  const list=state.quotes.filter(q=>(q.status==='계약'||q.status==='시공완료') && quoteTotal(q)-paidTotal(getPayment(q.id))>0);
  const sum=list.reduce((s,q)=>s+(quoteTotal(q)-paidTotal(getPayment(q.id))),0);
  return [{title:'미수금 '+list.length+'건 · 합계 '+fmt(sum), view:'pay',
    rows:list.map(q=>({main:q.client, sub:q.date, right:fmt(quoteTotal(q)-paidTotal(getPayment(q.id)))}))}];
}
function nlRecentQuotes(){
  const list=[...state.quotes].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,10);
  return [{title:'최근 견적 10건', view:'quotes', rows:list.map(q=>({main:q.client, sub:q.qnum+' · '+q.status, right:fmt(linesTotal(q))}))}];
}
function nlContracted(){

function nlAs(){
  const list=state.asList.filter(a=>!a.done);
  return [{title:'미완료 A/S '+list.length+'건', view:'as', rows:list.map(a=>({main:a.client, sub:a.type+' · '+(a.content||''), right:a.date}))}];

function nlWarranty(){
  const list=state.quotes.filter(q=>q.status==='시공완료' && ['만료임박','보증만료'].includes(warrantyStatus(q.id).label));

    rows:list.map(q=>({main:q.client, sub:warrantyStatus(q.id).label, right:warrantyEnd(q.id)}))}];

function nlMonthSales(){
  const m=monthKey(todayStr());
  const list=state.quotes.filter(q=>(q.status==='계약'||q.status==='시공완료') && monthKey(q.date)===m);
  const sum=list.reduce((s,q)=>s+linesTotal(q),0);
  return [{title:'이번달 매출 '+fmt(sum)+' ('+list.length+'건)', view:'sales',
    rows:list.map(q=>({main:q.client, sub:q.date, right:fmt(linesTotal(q))}))}];
}

/* 키워드 전체 검색 */
function keywordSearch(kw){
  const k=kw.toLowerCase().trim();
  const hit=(...v)=>v.some(x=>String(x||'').toLowerCase().includes(k));
  const g=[];
  const qs=state.quotes.filter(q=>hit(q.client,q.qnum,q.item,q.region)||qLines(q).some(l=>hit(l.name,l.spec,l.remark)));
  if(qs.length) g.push({title:'견적 '+qs.length+'건', view:'quotes',
    rows:qs.slice(0,20).map(q=>({main:q.client, sub:q.qnum+' · '+q.date+' · '+q.status, right:fmt(linesTotal(q))}))});
  const cs=state.clients.filter(c=>hit(c.name,c.chain,c.branch,c.contact,c.phone,c.mobile,c.address,c.memo));
  if(cs.length) g.push({title:'거래처 '+cs.length+'곳', view:'clients',
    rows:cs.map(c=>({main:c.name, sub:[c.contact,c.mobile||c.phone,c.address].filter(Boolean).join(' · '), right:clientStats(c.name).count+'건'}))});
  const its=state.items.filter(i=>hit(i.name,i.spec,i.cat));
  if(its.length) g.push({title:'품목 '+its.length+'개', view:'items',
    rows:its.map(i=>({main:i.name, sub:(i.cat||'')+(i.spec?' · '+i.spec:''), right:fmt(i.price)}))});
  const js=state.quotes.filter(q=>{const j=getJob(q.id); return hit(j.site,j.manager,j.jobNo,j.memo);});
  if(js.length) g.push({title:'시공/작업 '+js.length+'건', view:'install',
    rows:js.map(q=>({main:q.client, sub:getJob(q.id).site||'', right:getJob(q.id).installDate||''}))});
  const as=state.asList.filter(a=>hit(a.client,a.type,a.content,a.manager,a.result));
  if(as.length) g.push({title:'A/S '+as.length+'건', view:'as',
    rows:as.map(a=>({main:a.client, sub:a.type+' · '+(a.content||''), right:a.done?'완료':'진행중'}))});
  return g;
}

function runSearch(q){
  const query=(q||'').trim();
  if(!query) return {mode:'', groups:[]};
  for(const r of NL_RULES){
    if(r.re.test(query)) return {mode:r.label, groups:r.run()};
  }
  const cleaned = query.replace(/(찾아줘|보여줘|알려줘|검색|조회)\s*$/,'').trim();
  return {mode:'', groups:keywordSearch(cleaned||query)};
}

function geoOf(){   // 여러 후보(주소·현장명·지역)를 순서대로 훑어 위치를 찾는다
  for(let i=0;i<arguments.length;i++){
    const v=arguments[i]; if(!v) continue;
    const s=String(v).replace(/\s/g,'');
    let best=null, blen=0;
    for(const k in KR_GEO){ if(s.indexOf(k)>=0 && k.length>blen){ best=KR_GEO[k]; blen=k.length; } }
    if(best) return best;
  }
  return null;
}
function haversine(a,b){
  if(!a||!b) return 999;
  const R=6371, dLat=(b[0]-a[0])*Math.PI/180, dLng=(b[1]-a[1])*Math.PI/180;
  const x=Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
/* 방문 후보: 설치/AS + 제작완료(출고전) 추천 */
function routeCandidates(date){
  const out=[];
  state.quotes.forEach(q=>{
    const j=getJob(q.id);
    if(j.installDate===date && j.step!=='시공완료'){
      const c=state.clients.find(x=>x.name===q.client)||{};
      out.push({ id:'i_'+q.id, qid:q.id, type:'설치', label:q.client, addr:j.site||c.address||q.region||'', time:j.installTime||'', tel:c.mobile||c.phone||'' });
    }
  });
  state.asList.forEach(a=>{
    if(a.date===date && a.doneDate!==a.date){
      const c=state.clients.find(x=>x.name===a.client)||{};
      out.push({ id:'a_'+a.id, qid:null, type:'A/S', label:a.client, addr:c.address||'', time:'', tel:a.phone||c.mobile||c.phone||'' });
    }
  });
  // 캘린더에 적은 일정도 자동으로 동선에 포함 (업체·지역이 있으면 위치 인식)
  (state.events||[]).forEach(e=>{
    if(e.done) return;
    if(!eachDate(e.startDate, e.endDate).includes(date)) return;
    if(e.cat==='휴가') return;                       // 휴가는 방문지 아님
    const c=state.clients.find(x=>x.name===e.client)||{};
    const addr = c.address || e.client || guessPlace(e.title) || '';
    if(!addr) return;                                 // 장소를 못 찾으면 제외
    out.push({ id:'e_'+e.id, qid:null, type:e.cat||'일정', label:e.title||e.client||'일정',
               addr, time:e.startTime||'', tel:c.mobile||c.phone||'' });
  });
  return out;
}

}

/* 최근접 이웃으로 방문 순서 최적화 */
function optimizeRoute(startGeo, stops){
  const rest=stops.map(s=>({...s, geo:geoOf(s.addr, s.label)}));
  const known=rest.filter(s=>s.geo), unknown=rest.filter(s=>!s.geo);
  const ordered=[]; let cur=startGeo||(known[0]&&known[0].geo);
  const pool=known.slice();
  while(pool.length){
    let bi=0, bd=Infinity;
    pool.forEach((s,i)=>{ const d=haversine(cur,s.geo); if(d<bd){ bd=d; bi=i; } });
    const nx=pool.splice(bi,1)[0]; nx.legKm=Math.round(haversine(cur,nx.geo)); ordered.push(nx); cur=nx.geo;
  }
  return ordered.concat(unknown.map(s=>({...s, legKm:null})));
}
/* ===== 실제 카카오 지도 (API 키 입력 시) — 없으면 약도로 자동 대체 ===== */
const KAKAO_KEY_DEFAULT='fcf6cbdcb27e4232a20fa35631b746e5';
function kakaoKey(){ return (state.mapKey||'').trim() || KAKAO_KEY_DEFAULT; }
function kakaoReady(){ return !!(window.kakao && window.kakao.maps && window.kakao.maps.services); }
let __kakaoLoading=null;
function loadKakao(){
  if(!kakaoKey()) return Promise.resolve(false);
  if(kakaoReady()) return Promise.resolve(true);
  if(__kakaoLoading) return __kakaoLoading;
  __kakaoLoading=new Promise(res=>{
    const sc=document.createElement('script');
    sc.src='https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&libraries=services&appkey='+encodeURIComponent(kakaoKey());
    sc.onload=()=>{ try{ window.kakao.maps.load(()=>res(true)); }catch(e){ res(false); } };
    sc.onerror=()=>res(false);
    document.head.appendChild(sc);
  });
  return __kakaoLoading;
}
/* 주소 문자열 → 좌표 (카카오 지오코딩, 결과 캐시) */
async function kakaoGeocode(addr){
  if(!addr) return null;
  state.geoCache=state.geoCache||{};
  const key=String(addr).trim();
  if(state.geoCache[key]) return state.geoCache[key];
  if(!(await loadKakao())) return null;
  return new Promise(res=>{
    try{
      const gc=new kakao.maps.services.Geocoder();
      const done=(r,st)=>{
        if(st===kakao.maps.services.Status.OK && r[0]){
          const g=[parseFloat(r[0].y), parseFloat(r[0].x)];
          state.geoCache[key]=g; store.set('geoCache', state.geoCache).catch(()=>{});
          res(g);
        } else res(null);
      };
      gc.addressSearch(key, (r,st)=>{
        if(st===kakao.maps.services.Status.OK && r[0]) return done(r,st);
        // 주소로 못 찾으면 장소(상호) 검색
        try{ new kakao.maps.services.Places().keywordSearch(key, (r2,st2)=>{
          if(st2===kakao.maps.services.Status.OK && r2[0]){
            const g=[parseFloat(r2[0].y), parseFloat(r2[0].x)];
            state.geoCache[key]=g; store.set('geoCache', state.geoCache).catch(()=>{}); res(g);
          } else res(null);
        }); }catch(e){ res(null); }
      });
      setTimeout(()=>res(null), 4000);
    }catch(e){ res(null); }
  });
}

   - 상호명/주소 둘 다 검색. 외부 라이브러리 추가 없음(기존 카카오 SDK 사용)

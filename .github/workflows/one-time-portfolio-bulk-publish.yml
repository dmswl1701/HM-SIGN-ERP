name: One-time portfolio bulk publish patch

on:
  push:
    paths:
      - '.github/workflows/one-time-portfolio-bulk-publish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only portfolio bulk publish UI and handler
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')

          ui_old = '''        <button type="button" class="aic-btn aic-btn-primary" id="cmsPjFromSiteAdd">＋ 이 현장을 시공사례로</button>
        <button type="button" class="aic-btn" id="cmsPjAdd">＋ 새 시공사례</button>'''
          ui_new = '''        <button type="button" class="aic-btn aic-btn-primary" id="cmsPjFromSiteAdd">＋ 이 현장을 시공사례로</button>
        <button type="button" class="aic-btn" id="cmsPjAdd">＋ 새 시공사례</button>
        <button type="button" class="aic-btn" id="cmsPjPublishAll">🌐 공개 가능한 시공사례 전체 공개</button>'''

          hook = "  document.querySelectorAll('.cmsPjDel').forEach(el=>el.addEventListener('click',()=>cmsDeletePortfolio(el.dataset.id)));"
          handler = '''  const pubAll=document.getElementById('cmsPjPublishAll');
  if(pubAll) pubAll.addEventListener('click',async()=>{
    const candidates=(cmsPortfolios||[]).filter(p=>{
      if((p.status||'draft')==='published') return false;
      const q=cmsQueue(p.id);
      if(q.running || q.items.some(x=>x.status==='ready')) return false;
      return (cmsAssets[p.id]||[]).length>0;
    });
    if(!candidates.length){toast('공개할 수 있는 시공사례가 없어요','warn');return;}
    if(!confirm('사진 업로드가 끝난 시공사례 '+candidates.length+'개를 모두 홈페이지에 공개할까요?')) return;
    pubAll.disabled=true; pubAll.textContent='공개 중… 0 / '+candidates.length;
    let done=0, failed=0;
    for(let i=0;i<candidates.length;i++){
      const p=candidates[i];
      p.status='published';
      await cmsEnsureCover(p.id);
      const ok=await cmsSavePortfolio(p.id,{silent:true,noRender:true});
      if(ok){ done++; cmsPortfolioDraftsSave(); }
      else { p.status='draft'; failed++; }
      pubAll.textContent='공개 중… '+(i+1)+' / '+candidates.length;
    }
    await cmsLoadPortfolios();
    render();
    if(failed) toast(done+'개 공개 완료 · '+failed+'개 실패','warn');
    else toast(done+'개 시공사례를 모두 홈페이지에 공개했어요','ok');
  });
'''

          if 'id="cmsPjPublishAll"' in text:
              print('Bulk publish patch is already present; no change needed.')
          else:
              if text.count(ui_old) != 1:
                  raise SystemExit(f'UI anchor count must be 1, got {text.count(ui_old)}')
              if text.count(hook) != 1:
                  raise SystemExit(f'Handler anchor count must be 1, got {text.count(hook)}')
              text = text.replace(ui_old, ui_new, 1)
              text = text.replace(hook, handler + hook, 1)
              path.write_text(text, encoding='utf-8')
              print('Patched exactly two anchors in public/index.html')
          PY

          git diff --check
          git diff -- public/index.html
      - name: Commit exact patch
        shell: bash
        run: |
          if git diff --quiet -- public/index.html; then
            echo "No index change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Add bulk publish for website portfolios"
          git push

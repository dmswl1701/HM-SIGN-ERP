name: Fix portfolio publish flow
on:
  push:
    branches: [fix/portfolio-publish-flow-20260807]
    paths:
      - .github/scripts/fix_portfolio_publish_flow.py
      - .github/workflows/fix-portfolio-publish-flow.yml
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[portfolio-publish-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-publish-flow-20260807
          fetch-depth: 0
      - run: python .github/scripts/fix_portfolio_publish_flow.py
      - name: Check JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text(encoding='utf-8')
          a=s.find('<script>'); b=s.rfind('</script>')
          assert a>=0 and b>a
          Path('/tmp/app.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/app.js
          grep -q "V43.0807.BATCH3" public/index.html
          grep -q "cmsPjPublish" public/index.html
          grep -q "cmsEnsureCover" public/index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add public/index.html
          git commit -m "Fix portfolio publish flow [portfolio-publish-applied]"
          git push origin HEAD:fix/portfolio-publish-flow-20260807

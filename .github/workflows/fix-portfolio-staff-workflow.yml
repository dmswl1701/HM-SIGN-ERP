name: Fix portfolio staff workflow
on:
  push:
    branches: [fix/portfolio-staff-workflow-20260807]
    paths:
      - .github/scripts/fix_portfolio_staff_workflow.py
      - .github/workflows/fix-portfolio-staff-workflow.yml
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[staff-workflow-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-staff-workflow-20260807
          fetch-depth: 0
      - run: python .github/scripts/fix_portfolio_staff_workflow.py
      - name: Validate ERP script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text(encoding='utf-8')
          a=s.find('<script>'); b=s.rfind('</script>')
          assert a>=0 and b>a
          Path('/tmp/app.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/app.js
          grep -q "V43.0807.BATCH5" public/index.html
          grep -q "cmsDeleteAsset" public/index.html
          grep -q "사진을 먼저 올려주세요" public/index.html
          grep -q "asset.image_url" public/index.html
      - name: Commit patch
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add public/index.html
          git commit -m "Improve portfolio staff upload review flow [staff-workflow-applied]"
          git push origin HEAD:fix/portfolio-staff-workflow-20260807

name: HM ERP build bump 20260814

on:
  push:
    paths:
      - '.github/hm-bump-build-trigger-20260814.txt'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump build marker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          old="const APP_BUILD = 'V56.0812.MISSINGROW';"
          new="const APP_BUILD = 'V57.0814.CMSSYNC';"
          if old not in s: raise SystemExit('APP_BUILD target missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: |
          python -c "import re,pathlib; s=pathlib.Path('public/index.html').read_text(encoding='utf-8'); pathlib.Path('/tmp/hm.js').write_text('\n;\n'.join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)),encoding='utf-8')"
          node --check /tmp/hm.js
      - name: Commit
        run: |
          rm -f .github/hm-bump-build-trigger-20260814.txt
          git config user.name 'hm-sign-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html .github/hm-bump-build-trigger-20260814.txt
          git commit -m 'Bump ERP build after CMS sync fixes'
          git push

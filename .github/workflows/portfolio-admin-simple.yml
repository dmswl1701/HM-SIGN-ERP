name: Simplify portfolio admin UX
on:
  push:
    branches: [fix/portfolio-admin-simple-20260807]
    paths:
      - .github/scripts/portfolio_admin_simple.py
      - .github/workflows/portfolio-admin-simple.yml
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[portfolio-simple-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-admin-simple-20260807
          fetch-depth: 0
      - run: python .github/scripts/portfolio_admin_simple.py
      - name: Validate JavaScript and UX tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text(encoding='utf-8')
          a=s.find('<script>'); b=s.rfind('</script>')
          assert a>=0 and b>a
          Path('/tmp/app.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/app.js
          grep -q "V43.0807.BATCH4" public/index.html
          grep -q "cmsShowAssetPreview" public/index.html
          grep -q "자동 업로드" public/index.html
          grep -q "홈페이지 공개중" public/index.html
          ! grep -q "장 일괄 업로드" public/index.html
      - name: Commit patch
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add public/index.html
          git commit -m "Simplify portfolio admin to auto upload [portfolio-simple-applied]"
          git push origin HEAD:fix/portfolio-admin-simple-20260807

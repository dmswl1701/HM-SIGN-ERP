name: Portfolio batch uploader one-shot patch

on:
  push:
    branches:
      - fix/portfolio-batch-uploader-20260807
    paths:
      - .github/workflows/portfolio-batch-uploader-patch.yml
      - .github/scripts/portfolio_batch_patch.py

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[portfolio-batch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-batch-uploader-20260807
          fetch-depth: 0

      - name: Patch ERP portfolio batch workflow
        run: python .github/scripts/portfolio_batch_patch.py

      - name: JavaScript syntax and structural checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          assert scripts, 'no script blocks found'
          Path('/tmp/erp.js').write_text(max(scripts,key=len),encoding='utf-8')
          checks=[
            'function cmsQueueAdd',
            'function cmsStartUploadQueue',
            'cms-upload-zone',
            'cmsAssetStage',
            "const attempts=['file','asset','image','upload','original']",
            '사진 여러 장을 여기에 끌어놓거나 클릭해서 선택'
          ]
          for c in checks:
              assert c in s, c
          assert 'class="cmsAssetUp"' not in s, 'old immediate-upload input still present'
          print('Structural checks passed')
          PY
          node --check /tmp/erp.js
          echo "JavaScript syntax OK"

      - name: Commit patched ERP
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add public/index.html
          git commit -m "Rebuild portfolio as project-first batch uploader [portfolio-batch-applied]"
          git push origin HEAD:fix/portfolio-batch-uploader-20260807

name: HM ERP hotfix 20260814

on:
  push:
    paths:
      - '.github/hm-hotfix-trigger-20260814.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/hm-hotfix-20260814.py
      - name: Check inline JavaScript syntax
        run: |
          python -c "import re,pathlib; s=pathlib.Path('public/index.html').read_text(encoding='utf-8'); pathlib.Path('/tmp/hm-erp-inline.js').write_text('\n;\n'.join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)),encoding='utf-8')"
          node --check /tmp/hm-erp-inline.js
      - name: Commit hotfix
        run: |
          rm -f .github/hm-hotfix-trigger-20260814.txt
          git config user.name 'hm-sign-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html .github/hm-hotfix-trigger-20260814.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Speed up CMS admin and verify photo role saves'
          git push

name: CMS stability one-shot patch

on:
  push:
    branches:
      - fix/cms-stability-20260807
    paths:
      - .github/workflows/cms-stability-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[cms-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cms-stability-20260807
          fetch-depth: 0
      - name: Patch ERP CMS safely
        shell: python
        run: |
          from pathlib import Path

          path = Path('public/index.html')
          s = path.read_text(encoding='utf-8')
          original = s

          # 1) Add a single normalizer for list-like CMS payloads.
          marker = "/* 서버에 돌려보낼 본문을 원본 행과 같은 모양으로 만든다 */"
          helper = r'''/* CMS 반복형 데이터 정규화 — 구버전/래핑 응답도 항상 배열로 흡수 */
          function cmsAsArray(value){
            if(Array.isArray(value)) return value;
            if(value===null || value===undefined || value==='') return [];
            if(typeof value==='string'){
              try{ return cmsAsArray(JSON.parse(value)); }catch(e){ return []; }
            }
            if(typeof value==='object'){
              for(const k of ['items','data','rows','results','list','steps','services','process']){
                if(Array.isArray(value[k])) return value[k];
              }
              const vals = Object.values(value);
              if(vals.length && vals.every(v=>typeof v==='string' || (v && typeof v==='object'))) return vals;
            }
            return [];
          }
          '''
          if 'function cmsAsArray(value)' not in s:
            assert marker in s, 'cms normalizer insertion marker not found'
            s = s.replace(marker, helper + '\n' + marker, 1)

          # 2) Normalize the editing model immediately after all CMS keys/public fallbacks are merged.
          target = """    // 문의함\n    cmsInquiries = null;"""
          repl = """    // 반복형 콘텐츠는 저장 형태가 배열/객체/JSON 문자열이어도 편집 화면에서는 배열로 통일\n    cmsData.services = cmsAsArray(cmsData.services);\n    cmsData.process = cmsAsArray(cmsData.process);\n\n    // 문의함\n    cmsInquiries = null;"""
          if repl not in s:
            assert target in s, 'cmsLoadAll normalization target not found'
            s = s.replace(target, repl, 1)

          # 3) Use the already-normalized process list in rendering (prevents .map runtime crash).
          target = """  if(tab==='services'){\n    const list = Array.isArray(cmsData.services)? cmsData.services : [];"""
          repl = """  if(tab==='services'){\n    const list = cmsAsArray(cmsData.services);\n    const processList = cmsAsArray(cmsData.process);"""
          assert target in s or repl in s, 'services tab marker not found'
          s = s.replace(target, repl, 1)
          s = s.replace("<h2>진행 절차 (${(cmsData.process||[]).length})</h2>", "<h2>진행 절차 (${processList.length})</h2>", 1)
          s = s.replace("${(cmsData.process||[]).map((p,i)=>`", "${processList.map((p,i)=>`", 1)

          # 4) Fix two stale inquiry API paths so HOME badge/debug use the same real CMS route.
          s = s.replace("cmsFetch('/api/v1/admin/inquiries')", "cmsFetch(CMS_BASE+'/inquiries')")

          # 5) Add an ERP-native inquiry detail modal without changing stored inquiry data.
          marker = "/* ---------- 값 읽기/쓰기 도우미 ---------- */"
          detail_fn = r'''/* 문의 상세보기 — 실제 응답 객체를 읽기 전용으로 전부 확인 */
          function cmsShowInquiryDetail(idx){
            const list = cmsInquiryList();
            const q = list && list[idx];
            if(!q){ toast('문의 내용을 찾지 못했어요','warn'); return; }
            const old = document.getElementById('cmsInquiryDetailModal');
            if(old) old.remove();
            const labels = {
              createdAt:'접수일시', created_at:'접수일시', name:'성함/담당자', contact_name:'성함/담당자',
              phone:'연락처', mobile:'연락처', company:'회사/매장명', company_name:'회사/매장명',
              location:'설치 장소', address:'설치 장소', serviceType:'요청', service:'요청',
              preferredDate:'희망 일정', preferred_date:'희망 일정', date:'희망 일정',
              budget:'예산', expected_budget:'예산', message:'프로젝트 내용', content:'프로젝트 내용',
              consented:'개인정보 동의', consent:'개인정보 동의', source_url:'접수 페이지', status:'상태', id:'문의 ID'
            };
            const order = ['createdAt','created_at','name','contact_name','phone','mobile','company','company_name','location','address','serviceType','service','preferredDate','preferred_date','date','budget','expected_budget','message','content','consented','consent','status','source_url','id'];
            const seen = new Set();
            const keys = [];
            order.concat(Object.keys(q)).forEach(k=>{
              if(seen.has(k) || q[k]===undefined || q[k]===null || q[k]==='') return;
              seen.add(k); keys.push(k);
            });
            const phoneKeys = new Set(['phone','mobile']);
            const rows = keys.map(k=>{
              let v=q[k];
              if(typeof v==='object'){ try{ v=JSON.stringify(v,null,2); }catch(e){ v=String(v); } }
              const safe=esc(String(v));
              const val=phoneKeys.has(k)
                ? `<a href="tel:${esc(String(v).replace(/[^0-9+]/g,''))}" style="color:var(--navy);font-weight:700">${safe}</a>`
                : `<div style="white-space:pre-wrap;word-break:break-word">${safe}</div>`;
              return `<div style="padding:11px 0;border-bottom:1px solid var(--border)"><div style="font-size:11px;color:var(--text-mute);font-weight:700;margin-bottom:5px">${esc(labels[k]||k)}</div>${val}</div>`;
            }).join('');
            const wrap=document.createElement('div');
            wrap.id='cmsInquiryDetailModal';
            wrap.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(10,24,48,.52);display:flex;justify-content:flex-end';
            wrap.innerHTML=`<section role="dialog" aria-modal="true" aria-label="문의 상세" style="width:min(560px,94vw);height:100%;background:#fff;box-shadow:-12px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column">
              <div style="padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px"><div><div style="font-size:12px;color:var(--text-mute)">홈페이지 문의</div><b style="font-size:20px;color:var(--navy)">${esc(q.company||q.company_name||q.name||q.contact_name||'문의 상세')}</b></div><button type="button" id="cmsInqDetailClose" class="aic-btn">닫기 ✕</button></div>
              <div style="padding:8px 22px 28px;overflow:auto;flex:1">${rows || '<div class="empty">표시할 내용이 없어요.</div>'}</div>
              <div style="padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end"><button type="button" id="cmsInqDetailToClient" class="aic-btn aic-btn-primary">거래처 등록</button></div>
            </section>`;
            document.body.appendChild(wrap);
            const close=()=>wrap.remove();
            document.getElementById('cmsInqDetailClose').onclick=close;
            wrap.addEventListener('click',e=>{ if(e.target===wrap) close(); });
            document.addEventListener('keydown',function escClose(e){ if(e.key==='Escape' && document.getElementById('cmsInquiryDetailModal')){ close(); document.removeEventListener('keydown',escClose); } });
            document.getElementById('cmsInqDetailToClient').onclick=()=>{ close(); cmsInquiryToClient(idx); };
          }
          '''
          if 'function cmsShowInquiryDetail(idx)' not in s:
            assert marker in s, 'inquiry detail insertion marker not found'
            s = s.replace(marker, detail_fn + '\n' + marker, 1)

          # 6) Add a detail action beside the existing client-conversion action.
          old_head = '<th>요청</th><th>내용</th><th></th></tr></thead><tbody>'
          new_head = '<th>요청</th><th>내용</th><th>상세</th><th></th></tr></thead><tbody>'
          assert old_head in s or new_head in s, 'inquiry table header not found'
          s = s.replace(old_head, new_head, 1)
          old_cell = """               <td data-l=\"내용\" style=\"white-space:pre-wrap\">${esc((q.message||'').slice(0,110))}</td>\n               <td data-l=\"\"><button type=\"button\" class=\"aic-btn ${exists?'':'aic-btn-primary'} cmsInqAdd\" data-i=\"${i}\" ${exists?'disabled':''}>${exists?'등록됨':'거래처 등록'}</button></td>"""
          new_cell = """               <td data-l=\"내용\" style=\"white-space:pre-wrap\">${esc((q.message||'').slice(0,110))}</td>\n               <td data-l=\"상세\"><button type=\"button\" class=\"aic-btn cmsInqDetail\" data-i=\"${i}\">상세보기</button></td>\n               <td data-l=\"\"><button type=\"button\" class=\"aic-btn ${exists?'':'aic-btn-primary'} cmsInqAdd\" data-i=\"${i}\" ${exists?'disabled':''}>${exists?'등록됨':'거래처 등록'}</button></td>"""
          assert old_cell in s or new_cell in s, 'inquiry table row target not found'
          s = s.replace(old_cell, new_cell, 1)

          # 7) Bind detail buttons.
          old_bind = "  document.querySelectorAll('.cmsInqAdd').forEach(el=> el.addEventListener('click', ()=> cmsInquiryToClient(+el.dataset.i)));"
          new_bind = "  document.querySelectorAll('.cmsInqDetail').forEach(el=> el.addEventListener('click', ()=> cmsShowInquiryDetail(+el.dataset.i)));\n  document.querySelectorAll('.cmsInqAdd').forEach(el=> el.addEventListener('click', ()=> cmsInquiryToClient(+el.dataset.i)));"
          assert old_bind in s or new_bind in s, 'inquiry binding target not found'
          s = s.replace(old_bind, new_bind, 1)

          if s == original:
            raise SystemExit('No changes made; refusing empty patch')

          path.write_text(s, encoding='utf-8')
          print('Patched public/index.html successfully')
      - name: Sanity checks
        shell: bash
        run: |
          grep -q "function cmsAsArray" public/index.html
          grep -q "function cmsShowInquiryDetail" public/index.html
          grep -q "processList.map" public/index.html
          grep -q "cmsInqDetail" public/index.html
          ! grep -q "(cmsData.process||\[\]).map" public/index.html
          echo "CMS patch checks passed"
      - name: Commit patch to branch
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add public/index.html
          git commit -m "Fix CMS process crash and add inquiry detail [cms-patch-applied]"
          git push origin HEAD:fix/cms-stability-20260807
